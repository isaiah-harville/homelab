---
# Non-secret cluster-wide defaults. Secrets live in vault.yml (encrypted)
# and are referenced here via vault_* variables.

# k3s cluster connection. Everything talks to the control plane through the
# kube-vip floating VIP, so the endpoint survives losing any one server.
k3s_vip: "10.1.10.9"
k3s_api_vip_url: "https://10.1.10.9:6443"
k3s_server_url: "{{ k3s_api_vip_url }}"
k3s_token: "{{ vault_k3s_token }}"

# Longhorn data directory (must match Helm values defaultDataPath)
longhorn_data_path: /data/longhorn

# Netplan defaults
node_gateway: "10.1.10.1"
node_dns:
  - "1.1.1.1"
  - "8.8.8.8"
# Ubuntu 24.04 uses predictable NIC names (enp1s0 on bare metal, ens18 on
# Proxmox), not eth0. Check `ip link` on the target.
network_interface: enp1s0

# Login user created on every node, and its password (both from the vault).
node_user: "{{ vault_node_user }}"
node_password: "{{ vault_node_password }}"

# SSH public keys authorized for node_user on every node (the common role
# installs these into ~/.ssh/authorized_keys).
ssh_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMuUl/9NL4klfG7Fs56DX9MJ6F8KPVol3lW5Ybv1Sn8W iharville@MacBook-Pro"
  - "ssh-rsa  isaiah@dl380"

# How Ansible connects: SSH in as the vault user and use the vault password for sudo.
ansible_user: "{{ vault_node_user }}"
ansible_become_password: "{{ vault_node_password }}"
