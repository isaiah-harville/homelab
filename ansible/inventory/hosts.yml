---
# Node inventory. No secrets here — user/password/token come from
# inventory/group_vars/all/ (vault). NIC names differ per machine
# (check with `ip -br link`), so each host pins its own interface.
#
# dl380 (10.1.10.10) is the existing control-plane / etcd bootstrap server and
# the box we run ansible FROM. It's listed under k3s_bootstrap for reference,
# but NO routine play targets it — its one-time etcd conversion + kube-vip
# bootstrap are done by hand (docs/k3s-ha-migration.md). Keeping the live API
# server out of sweep-style plays limits blast radius.

all:
  vars:
    # ansible_host = node_ip with the /CIDR stripped off
    ansible_host: "{{ node_ip.split('/')[0] }}"
  children:
    # Existing bootstrap control-plane server. Reference only — not targeted by
    # provision.yml or servers.yml. We run ansible from here (connection: local).
    k3s_bootstrap:
      hosts:
        dl380:
          node_name: dl380
          node_ip: "10.1.10.10/24"
          network_interface: eno1
          ansible_connection: local
    # Embedded-etcd control-plane servers that ansible joins to the cluster.
    # The VIP must already exist (dl380 bootstrap done) before joining, and each
    # node must be drained + agent-uninstalled first. Join one at a time.
    k3s_servers:
      hosts:
        precision-1:
          node_name: precision-1
          node_ip: "10.1.10.30/24"
          network_interface: enp0s31f6
        precision-2:
          node_name: precision-2
          node_ip: "10.1.10.31/24"
          network_interface: eno1
    # Worker (agent) nodes.
    k3s_agents:
      hosts:
        thinkcentre-01:
          node_name: thinkcentre-01
          node_ip: "10.1.10.33/24"
          network_interface: eno1
        latitude-01:
          node_name: latitude-01
          node_ip: "10.1.10.32/24"
          network_interface: enp0s31f6
        # GPU inference node running inside WSL2. Two composable flags:
        #   node_gpu  -> generic GPU setup (NVIDIA toolkit, gpu labels, dedicated=gpu
        #                taint) — same on bare-metal GPU nodes.
        #   node_wsl  -> WSL-only quirks (/-rshared mount fix, pinned node-ip).
        # k3s node name follows node_name (the WSL hostname).
        #
        # NOTE: flannel's VXLAN overlay can't receive inbound on WSL mirrored mode,
        # so this node does NOT do cross-node pod networking — vLLM runs with
        # hostNetwork instead (see apps/base/vllm). Nothing here needs the overlay.
        #
        # WSL is not provisioned like the bare-metal agents — set up the WSL base
        # yourself, then run ONLY the k3s role:
        #   ansible-playbook playbooks/provision.yml --limit harvi-desktop --tags k3s
        # WSL prereqs (do these on the Windows/WSL side first):
        #   - /etc/wsl.conf:        [boot]  systemd=true
        #   - %UserProfile%\.wslconfig:  [wsl2] networkingMode=mirrored
        #                                       firewall=false   (then: wsl --shutdown)
        #     (mirrored + firewall off = node_ip reachable on the LAN, incl. :8000)
        #   - current NVIDIA driver on Windows (provides /dev/dxg) + CUDA in WSL
        #   - sshd running in WSL (for ansible)
        harvi-desktop:
          node_name: harvi-desktop
          node_ip: "10.1.1.20/24"  # routed to the 10.1.10.x cluster subnet; pinned as k3s node-ip
          node_gpu: true
          node_wsl: true
        spark-a97a:
          node_name: spark-a97a
          node_ip: "10.1.10.75/24"
          network_interface: enP7s7
          node_gpu: true
          node_user: iharville
          ansible_user: iharville
