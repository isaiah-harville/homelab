---
# Node inventory. Contains NO secrets — the user password and k3s token live in
# the encrypted group_vars/all/vault.yml, so this file is safe to commit.
#
# Per host you set just two things:
#   node_name — hostname to assign
#   node_ip   — static IP in CIDR notation (e.g. 10.1.10.101/24)
#
# ansible_host is derived from node_ip. The login user (isaiah) and its
# password come from group_vars.

all:
  children:
    k3s_nodes:
      # ansible_host = node_ip with the /CIDR stripped off
      vars:
        ansible_host: "{{ node_ip.split('/')[0] }}"
      hosts:
        node-01:
          node_name: node-01
          node_ip: "10.1.10.101/24"

        node-02:
          node_name: node-02
          node_ip: "10.1.10.102/24"
