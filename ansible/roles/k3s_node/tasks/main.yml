---
- name: Check if k3s agent is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

# GPU prep runs BEFORE the agent install so k3s detects the NVIDIA container
# runtime on first start (it auto-creates the `nvidia` RuntimeClass). On WSL the
# GPU driver lives on the Windows host — we only install the toolkit here.
- name: Configure GPU support
  when: node_gpu | default(false)
  block:
    - name: Fetch the NVIDIA Container Toolkit GPG key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /tmp/nvidia-container-toolkit.asc
        mode: "0644"

    - name: Install the key into a keyring
      ansible.builtin.command:
        cmd: >-
          gpg --batch --yes --dearmor
          -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
          /tmp/nvidia-container-toolkit.asc
        creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

    - name: Add the NVIDIA Container Toolkit apt repository
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list
        dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        mode: "0644"

    - name: Point the repository at the signed keyring
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        regexp: '^deb https://'
        replace: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://"

    - name: Install nvidia-container-toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true
      notify: Restart k3s-agent

    # WSL2 mounts / as a private mount; containerd refuses containers that need
    # mount propagation (GPU device injection, node-exporter) with "path / is
    # mounted on / but it is not a shared or slave mount". Mark it rshared, and
    # persist it across WSL restarts with a oneshot unit ordered before k3s-agent.
    - name: Install make-rshared oneshot unit (WSL mount propagation)
      ansible.builtin.copy:
        dest: /etc/systemd/system/rshared-root.service
        mode: "0644"
        content: |
          [Unit]
          Description=Make / rshared for k8s mount propagation (WSL)
          DefaultDependencies=no
          Before=k3s-agent.service
          [Service]
          Type=oneshot
          ExecStart=/bin/mount --make-rshared /
          RemainAfterExit=yes
          [Install]
          WantedBy=multi-user.target

    - name: Enable + run make-rshared now
      ansible.builtin.systemd:
        name: rshared-root.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Ensure k3s config directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write k3s agent config (GPU labels + pinned node IP)
      # Pin node-ip: WSL has several interfaces (the LAN IP is on eth3), so don't
      # let k3s auto-pick a WSL-internal NAT address — advertise the routed LAN IP.
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
        content: |
          node-name: {{ node_name }}
          node-ip: {{ node_ip.split('/')[0] }}
          node-label:
            - "gpu=true"
            - "nvidia.com/gpu.present=true"
          # Reserve the node for GPU work: general pods + Longhorn/metallb (which
          # don't tolerate this) stay off; vLLM + the device plugin tolerate it.
          node-taint:
            - "dedicated=gpu:NoSchedule"
      notify: Restart k3s-agent

- name: Download and run k3s agent installer
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      K3S_URL="{{ k3s_server_url }}" \
      K3S_TOKEN="{{ k3s_token }}" \
      sh -s - agent
  when: not k3s_binary.stat.exists
  changed_when: true

- name: Keep the agent pointed at the current server endpoint (the VIP)
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/k3s-agent.service.env
    regexp: '^K3S_URL='
    line: "K3S_URL='{{ k3s_server_url }}'"
  notify: Restart k3s-agent

- name: Ensure k3s-agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
