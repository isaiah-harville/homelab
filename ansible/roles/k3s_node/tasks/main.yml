---
- name: Check if k3s agent is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

# GPU / WSL prep runs BEFORE the agent install so k3s picks up the NVIDIA runtime
# on first start. Two independent, composable flags:
#   node_gpu  — generic NVIDIA GPU node (toolkit + GPU labels/taint)  -> gpu.yml
#   node_wsl  — WSL2-only quirks (mount-propagation fix, pinned node-ip) -> wsl.yml
# A bare-metal GPU node sets only node_gpu; the WSL box sets both.
- name: Generic GPU node setup
  ansible.builtin.include_tasks: gpu.yml
  when: node_gpu | default(false)

- name: WSL-specific node setup
  ansible.builtin.include_tasks: wsl.yml
  when: node_wsl | default(false)

- name: Ensure /etc/rancher/k3s exists
  when: (node_gpu | default(false)) or (node_wsl | default(false))
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s agent config (GPU labels/taint + WSL node-ip pin)
  when: (node_gpu | default(false)) or (node_wsl | default(false))
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
    content: |
      {% if node_wsl | default(false) %}
      # WSL has several interfaces; pin the routed LAN IP instead of letting k3s
      # auto-pick a WSL-internal NAT address. node-name set since the WSL hostname
      # is what k3s would use anyway, kept explicit for clarity.
      node-name: {{ node_name }}
      node-ip: {{ node_ip.split('/')[0] }}
      {% endif %}
      {% if node_gpu | default(false) %}
      # gpu=true gates our own scheduling; nvidia.com/gpu.present satisfies the
      # device-plugin chart's GPU nodeAffinity (no NFD on these nodes). gpu-wsl
      # distinguishes WSL boxes (need the volume-mounts device-plugin release,
      # infrastructure/base/nvidia-device-plugin/helmrelease-wsl.yaml) from
      # bare-metal GPU nodes (the plain helmrelease.yaml, normal CDI-based
      # detection) — see node_wsl below.
      node-label:
        - "gpu=true"
        - "nvidia.com/gpu.present=true"
        {% if node_wsl | default(false) %}
        - "gpu-wsl=true"
        {% endif %}
      # Reserve the node for GPU work: general pods + Longhorn/metallb (which
      # don't tolerate this) stay off; vLLM + the device plugin tolerate it.
      node-taint:
        - "dedicated=gpu:NoSchedule"
      {% endif %}
  notify: Restart k3s-agent

- name: Download and run k3s agent installer
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      K3S_URL="{{ k3s_server_url }}" \
      K3S_TOKEN="{{ k3s_token }}" \
      sh -s - agent
  when: not k3s_binary.stat.exists
  changed_when: true

- name: Keep the agent pointed at the current server endpoint (the VIP)
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/k3s-agent.service.env
    regexp: '^K3S_URL='
    line: "K3S_URL='{{ k3s_server_url }}'"
  notify: Restart k3s-agent

- name: Ensure k3s-agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
