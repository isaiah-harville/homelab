---
# Host-level prep so a node can run Longhorn. Disk config is NOT done here:
# Longhorn auto-creates a default disk at /data/longhorn and applies the
# reserve % from its global settings (infrastructure/base/longhorn/helmrelease.yaml).
# This role just makes sure the host is ready and /data/longhorn exists; once
# the node joins, its storage appears automatically.

- name: Install Longhorn prerequisites
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
      - util-linux
      - cryptsetup
      - dmsetup
    state: present
    update_cache: true

- name: Enable and start iscsid
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

- name: Create Longhorn data directory
  ansible.builtin.file:
    path: "{{ longhorn_data_path }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - iscsi_tcp
    - dm_crypt

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/longhorn.conf
    content: "iscsi_tcp\ndm_crypt\n"
    mode: "0644"
