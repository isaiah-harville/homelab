---
# Join nodes to the cluster as embedded-etcd control-plane SERVERS.
#
# This is the second half of the HA migration; read docs/k3s-ha-migration.md.
# PREREQS before running:
#   1. dl380 converted to embedded etcd (cluster-init) and kube-vip is serving
#      the VIP (10.1.10.9) — Phases 1-2, done manually on dl380.
#   2. The target node has been drained and its k3s agent uninstalled.
#   3. SSH key + vault sudo creds work for the node (ssh-copy-id isaiah@<ip>).
#
# Always join ONE server at a time so etcd never loses quorum:
#   ansible-playbook servers.yml --limit precision-1
#   # verify 'kubectl get nodes' + etcd health, then:
#   ansible-playbook servers.yml --limit precision-2
#
# The `longhorn` role re-asserts the host prereqs (idempotent — already present
# on running nodes). `common` is intentionally NOT run here, to avoid rewriting
# the hostname/password/netplan of an existing, live node.

- name: Join k3s control-plane servers
  hosts: k3s_servers
  become: true
  gather_facts: true
  roles:
    - longhorn
    - k3s_server
