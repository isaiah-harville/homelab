---
# Omni runs with host networking, so these rules apply to it directly. Dex's
# 5556 is a Docker-published port, which Docker's own chains admit before
# ufw sees it; it is meant to be reachable anyway.
- name: Allow SSH and Omni's ports from the home network
  community.general.ufw:
    rule: allow
    src: "{{ item.0 }}"
    port: "{{ item.1.port }}"
    proto: "{{ item.1.proto }}"
    comment: "{{ item.1.comment }}"
  loop: "{{ omni_allowed_cidrs | product(omni_firewall_ports) | list }}"
  loop_control:
    label: "{{ item.0 }} {{ item.1.port }}/{{ item.1.proto }}"
  vars:
    omni_firewall_ports:
      - {port: "22", proto: tcp, comment: ssh}
      - {port: "443", proto: tcp, comment: omni ui/api}
      - {port: "5556", proto: tcp, comment: dex}
      - {port: "8090", proto: tcp, comment: omni machine api}
      - {port: "8100", proto: tcp, comment: omni k8s proxy}
      - {port: "50180", proto: udp, comment: siderolink wireguard}

# Everything the machines do after joining (event sink, logs, discovery)
# travels inside the WireGuard tunnel.
- name: Allow traffic inside the SideroLink tunnel
  community.general.ufw:
    rule: allow
    direction: in
    interface: siderolink
    comment: siderolink tunnel

# Default deny closes Omni's unauthenticated metrics (2122) and its internal
# API on 10000 to the LAN.
- name: Deny other inbound traffic and enable the firewall
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
