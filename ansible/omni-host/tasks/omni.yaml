---
- name: Set Omni paths
  ansible.builtin.set_fact:
    omni_dir: "{{ omni_repo_dir }}/omni-server"

- name: Clone the homelab repository
  become: true
  become_user: "{{ omni_user }}"
  ansible.builtin.git:
    repo: "{{ omni_repo_url }}"
    dest: "{{ omni_repo_dir }}"
    version: main
    accept_newhostkey: true
    update: false

# --- Secrets ----------------------------------------------------------------
# .env is the only place the Dex client secret and admin password hash live.
# Earlier hosts kept the hash in a hand-edited dex.yaml, which made every
# `git pull` conflict; move it into .env before resetting dex.yaml to git.

- name: Read the existing .env
  ansible.builtin.slurp:
    src: "{{ omni_dir }}/.env"
  register: omni_env_file
  failed_when: false
  no_log: true

- name: Note which secrets .env already has
  ansible.builtin.set_fact:
    omni_env_exists: "{{ omni_env_file.content is defined }}"
    omni_env_has_hash: "{{ (omni_env_file.content | default('') | b64decode) is search('(?m)^DEX_ADMIN_PASSWORD_HASH=') }}"
  no_log: true

- name: Find a password hash left in dex.yaml  # noqa: command-instead-of-module
  ansible.builtin.command: >-
    sed -nE 's/^[[:space:]]*hash:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' {{ omni_dir }}/dex.yaml
  register: omni_legacy_hash
  changed_when: false
  when: omni_env_exists and not omni_env_has_hash
  no_log: true
  check_mode: false


- name: Move the admin password hash into .env
  ansible.builtin.lineinfile:
    path: "{{ omni_dir }}/.env"
    regexp: "^DEX_ADMIN_PASSWORD_HASH="
    line: "DEX_ADMIN_PASSWORD_HASH='{{ omni_admin_password_hash | default(omni_legacy_hash_value) }}'"
  vars:
    omni_legacy_hash_value: >-
      {{ omni_legacy_hash.stdout_lines | default([]) | reject('search', 'REPLACE_WITH') | first | default('') }}
  when: omni_env_exists and not omni_env_has_hash
  no_log: true

- name: Drop OMNI_VERSION from .env (pinned in compose.yaml now)
  ansible.builtin.lineinfile:
    path: "{{ omni_dir }}/.env"
    regexp: "^OMNI_VERSION="
    state: absent
  when: omni_env_exists

- name: Require an admin password hash for a new host
  ansible.builtin.assert:
    that: omni_admin_password_hash is defined
    fail_msg: "Pass -e omni_admin_password_hash='<bcrypt>' to create .env."
  when: not omni_env_exists

- name: Create .env on a new host
  ansible.builtin.template:
    src: env.j2
    dest: "{{ omni_dir }}/.env"
    owner: "{{ omni_user }}"
    group: "{{ omni_user }}"
    mode: "0600"
    force: false
  when: not omni_env_exists
  no_log: true

- name: Check .env is complete
  ansible.builtin.command: grep -cE "^(DEX_OMNI_CLIENT_SECRET|DEX_ADMIN_PASSWORD_HASH)='?[^'[:space:]]{8,}" {{ omni_dir }}/.env
  register: omni_env_check
  changed_when: false
  # In --check runs the hash hasn't really been moved yet.
  failed_when: omni_env_check.stdout | int != 2 and not ansible_check_mode

# --- Repository -------------------------------------------------------------
  check_mode: false


- name: List local changes in the checkout
  become: true
  become_user: "{{ omni_user }}"
  ansible.builtin.command: git -C {{ omni_repo_dir }} status --porcelain --untracked-files=no  # noqa: command-instead-of-module
  register: omni_git_status
  changed_when: false
  check_mode: false


- name: Refuse to overwrite unexpected local changes
  ansible.builtin.assert:
    that: omni_git_status.stdout_lines | reject('search', 'omni-server/dex.yaml$') | list | length == 0
    fail_msg: "Local changes besides dex.yaml: {{ omni_git_status.stdout_lines }}"

- name: Reset dex.yaml to git now that its secrets are in .env
  become: true
  become_user: "{{ omni_user }}"
  ansible.builtin.command: git -C {{ omni_repo_dir }} checkout -- omni-server/dex.yaml  # noqa: command-instead-of-module
  changed_when: true
  when: omni_git_status.stdout is search('omni-server/dex.yaml')

# Hand-resolving the old dex.yaml conflicts left stashes holding the client
# secret and password hash. Drop only stashes that touch nothing but
# omni-server/dex.yaml; anything else is someone's work and stays.
- name: Drop leftover dex.yaml stashes  # noqa: command-instead-of-module
  become: true
  become_user: "{{ omni_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    cd {{ omni_repo_dir }}
    dropped=0
    for ref in $(git stash list --format=%gd | sort -t'{' -k2 -rn); do
      files=$(git stash show --name-only --include-untracked "$ref" 2>/dev/null || git stash show --name-only "$ref")
      if [ "$files" = "omni-server/dex.yaml" ]; then
        git stash drop -q "$ref"
        dropped=$((dropped + 1))
      fi
    done
    echo "dropped=$dropped"
  args:
    executable: /bin/bash
  register: omni_stash_drop
  changed_when: omni_stash_drop.stdout is not search('dropped=0')
  when: not ansible_check_mode

- name: Update the checkout
  become: true
  become_user: "{{ omni_user }}"
  ansible.builtin.git:
    repo: "{{ omni_repo_url }}"
    dest: "{{ omni_repo_dir }}"
    version: main
  register: omni_git

# --- Files and permissions --------------------------------------------------

- name: Lock down Omni's state directories
  ansible.builtin.file:
    path: "{{ omni_dir }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: certs, mode: "0750"}
    - {path: secrets, mode: "0700"}
    - {path: data, mode: "0750"}
    - {path: .lego, mode: "0700"}

- name: Find the TLS key and GPG private key
  ansible.builtin.stat:
    path: "{{ omni_dir }}/{{ item }}"
  loop: [certs/server-key.pem, secrets/omni.asc, .env, .lego-cf.env]
  register: omni_secret_files

# The key was 0644 so Dex (uid 1001) could read it; compose.yaml now gives
# Dex the host user's group instead.
- name: Make private keys and env files unreadable to others
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    owner: "{{ omni_user }}"
    group: "{{ omni_user }}"
    mode: "{{ '0640' if item.item == 'certs/server-key.pem' else '0600' }}"
  loop: "{{ omni_secret_files.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Require the GPG key that encrypts Omni's etcd
  ansible.builtin.assert:
    that: (omni_secret_files.results | selectattr('item', 'eq', 'secrets/omni.asc') | first).stat.exists
    fail_msg: "Create secrets/omni.asc (omni-server/README.md step 1) or restore a backup."

# --- Certificates -----------------------------------------------------------

- name: Write the Cloudflare token for lego
  ansible.builtin.copy:
    dest: "{{ omni_dir }}/.lego-cf.env"
    owner: "{{ omni_user }}"
    group: "{{ omni_user }}"
    mode: "0600"
    content: "CLOUDFLARE_DNS_API_TOKEN={{ cloudflare_dns_api_token }}\n"
  when: cloudflare_dns_api_token is defined
  no_log: true

- name: Install the certificate scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop: [omni-cert-renew.sh, omni-cert-deploy.sh, omni-backup.sh]

- name: Install the systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - omni-cert-renew.service
    - omni-cert-renew.timer
    - omni-backup.service
    - omni-backup.timer
  notify: Reload systemd

- name: Apply systemd changes now
  ansible.builtin.meta: flush_handlers

- name: Enable the renewal and backup timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [omni-cert-renew.timer, omni-backup.timer]

- name: Check for a certificate
  ansible.builtin.stat:
    path: "{{ omni_dir }}/certs/server-chain.pem"
  register: omni_cert

- name: Issue the first certificate
  ansible.builtin.systemd_service:
    name: omni-cert-renew.service
    state: started
  when: not omni_cert.stat.exists

# --- Stack ------------------------------------------------------------------

- name: Read the image Omni is running
  ansible.builtin.command: docker inspect omni --format "{{ '{{' }}.Config.Image{{ '}}' }}"
  register: omni_running_image
  changed_when: false
  failed_when: false
  check_mode: false


- name: Read the image compose.yaml pins  # noqa: command-instead-of-module
  ansible.builtin.command: >-
    sed -nE 's/^[[:space:]]*image:[[:space:]]*(ghcr.io\/siderolabs\/omni:[^[:space:]]+)/\1/p' {{ omni_dir }}/compose.yaml
  register: omni_pinned_image
  changed_when: false

# An Omni upgrade migrates its databases in place and can't be rolled back
# by changing the tag, so take a backup first.
  check_mode: false


- name: Note an Omni version change
  ansible.builtin.debug:
    msg: >-
      Omni {{ omni_running_image.stdout | default('not running') }} ->
      {{ omni_pinned_image.stdout }}. A backup runs first; if the new version
      fails its health check, restore it and pin the old version again.
  when: omni_running_image.stdout | default('') != omni_pinned_image.stdout

- name: Back up before changing the Omni version
  ansible.builtin.systemd_service:
    name: omni-backup.service
    state: started
  when:
    - omni_running_image.rc == 0
    - omni_running_image.stdout != omni_pinned_image.stdout

- name: Start or update the stack
  become: true
  become_user: "{{ omni_user }}"
  ansible.builtin.command: docker compose up -d --remove-orphans --pull missing
  args:
    chdir: "{{ omni_dir }}"
  register: omni_compose
  changed_when: omni_compose.stderr is search('Recreated|Created|Started')

# --- Health -----------------------------------------------------------------
# An upgrade is done when both answer again. Omni migrates its databases on
# the first start of a new version, which can take a minute or two.

- name: Wait for Omni to report healthy
  ansible.builtin.uri:
    url: "https://omni.{{ omni_domain }}/healthz"
    status_code: 200
  register: omni_health
  until: omni_health.status == 200
  retries: 36
  delay: 5
  when: not ansible_check_mode

- name: Wait for Dex to report healthy
  ansible.builtin.uri:
    url: "https://omni-dex.{{ omni_domain }}:5556/healthz"
    status_code: 200
  register: dex_health
  until: dex_health.status == 200
  retries: 24
  delay: 5
  when: not ansible_check_mode

- name: Show the running versions
  ansible.builtin.command: docker compose images --format json
  args:
    chdir: "{{ omni_dir }}"
  become: true
  become_user: "{{ omni_user }}"
  register: omni_images
  changed_when: false
  check_mode: false

- name: Report the running versions
  ansible.builtin.debug:
    msg: "{{ images | map(attribute='Repository') | zip(images | map(attribute='Tag')) | map('join', ':') | list }}"
  vars:
    images: "{{ omni_images.stdout | from_json }}"
