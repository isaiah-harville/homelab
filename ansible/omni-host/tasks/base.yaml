---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - age
      - apache2-utils   # htpasswd, for the Dex admin hash
      - ca-certificates
      - curl
      - git
      - gnupg
      - ufw
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable daily unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Kernel and libc updates do nothing until a reboot, and this host had gone
# four weeks with one pending. The cluster keeps running while Omni is down;
# only management pauses for the minute it takes.
- name: Reboot for updates in a quiet window
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52omni-auto-reboot
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
