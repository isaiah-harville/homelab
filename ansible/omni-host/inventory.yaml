---
# The self-hosted Omni host. It runs outside the cluster (see
# omni-server/README.md), so nothing in Flux manages it: this playbook does.
all:
  hosts:
    omni:
      ansible_host: 10.1.10.88
      ansible_user: isaiah
  vars:
    omni_user: isaiah
    omni_repo_url: git@github.com:isaiah-harville/homelab.git
    omni_repo_dir: /home/isaiah/homelab
    omni_domain: int.harville.dev
    # Who may reach SSH and Omni's ports: the home network, which covers the
    # nodes (10.1.10.0/24) and the workstation VLAN (10.1.1.0/24).
    omni_allowed_cidrs:
      - 10.1.0.0/16
    omni_acme_email: harvillerisaiah@gmail.com
    lego_version: "5.7.0"
    lego_sha256: ffc7f0d75810a70affffb10fc20a8db4d6dd4917f8f88cda9b54fb08c82a1967
    # Host-state backups are encrypted to the repo's SOPS age recipient
    # (.sops.yaml), whose identity is kept off-cluster for disaster recovery.
    omni_backup_age_recipient: age10ukgkhw204tv9u00mf57jfmxwkfhrp0f6k3vjak3caztelhgh5us9a5jj4
    omni_backup_keep_days: 56
