---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-internal
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/traefik-internal/traefik-internal/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
