---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.18.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      prometheusSpec:
        retention: 24h
        storageSpec: null
    alertmanager:
      alertmanagerSpec:
        storage: {}
    grafana:
      adminPassword: "admin"
      deploymentStrategy:
        type: Recreate
      initChownData:
        enabled: false
      persistence:
        enabled: true
        type: pvc
        existingClaim: kube-prometheus-stack-grafana-longhorn
        size: 10Gi
        accessModes:
          - ReadWriteOnce
      service:
        type: ClusterIP
      ingress:
        enabled: true
        ingressClassName: traefik-internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Observability
          gethomepage.dev/name: Grafana
          gethomepage.dev/description: Dashboards and alerting
          gethomepage.dev/pod-selector: app.kubernetes.io/name=grafana
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: apps-authelia-forwardauth@kubernetescrd
        hosts:
          - grafana.int.harville.dev
        tls:
          - hosts:
              - grafana.int.harville.dev
            secretName: harville-wildcard-shared-tls
