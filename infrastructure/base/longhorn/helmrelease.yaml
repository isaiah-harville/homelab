---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: longhorn
      version: ">=1.12.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    defaultSettings:
      # Auto-created default disk per node. On Talos this is the UserVolume mount
      # from talos/omni/patches/longhorn-disk.yaml (dedicated disk → /var/mnt/longhorn).
      defaultDataPath: /var/mnt/longhorn
      storageReservedPercentageForDefaultDisk: 30
      # 3 replicas (one per node via strict anti-affinity below) → any single node
      # can fail with no data loss and the volume stays redundant.
      defaultReplicaCount: 3
      # Don't create a volume unless all replicas can land on distinct nodes.
      allowVolumeCreationWithDegradedAvailability: false
      replicaAutoBalance: least-effort
      replicaSoftAntiAffinity: false
    persistence:
      defaultClassReplicaCount: 3
