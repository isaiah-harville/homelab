---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: longhorn
      version: "1.12.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    defaultSettings:
      # Longhorn auto-creates a default disk at this path on every node and
      # applies the reserve below. Provision a node (ansible) and its storage
      # appears automatically — nothing per-node to declare.
      defaultDataPath: /data/longhorn
      storageReservedPercentageForDefaultDisk: 30
      # 3 storage nodes, 3 replicas (one per node) → a single node can fail
      # with zero data loss, and the volume stays redundant during the outage.
      defaultReplicaCount: 3
      # Keep new volumes fully redundant: don't create them unless all replicas
      # can be scheduled across distinct nodes.
      allowVolumeCreationWithDegradedAvailability: false
      replicaAutoBalance: least-effort
      # Strict anti-affinity: replicas of a volume must land on different nodes.
      replicaSoftAntiAffinity: false
    persistence:
      defaultClassReplicaCount: 3
