---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: longhorn
      version: ">=1.12.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    defaultSettings:
      # Only labeled nodes have dedicated, persistent Longhorn disks.
      createDefaultDiskLabeledNodes: true
      # Mounted by talos/omni/patches/longhorn-disk.yaml.
      defaultDataPath: /var/mnt/longhorn
      storageReservedPercentageForDefaultDisk: 30
      # Keep one replica per node and tolerate one node failure.
      defaultReplicaCount: 3
      # Don't create a volume unless all replicas can land on distinct nodes.
      allowVolumeCreationWithDegradedAvailability: false
      replicaAutoBalance: least-effort
      replicaSoftAntiAffinity: false
    persistence:
      defaultClassReplicaCount: 3
