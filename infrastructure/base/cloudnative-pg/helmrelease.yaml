---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 30m
  releaseName: cloudnative-pg
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: cloudnative-pg
      # CNPG 1.29 is the newest line that supports Kubernetes 1.33.
      version: ">=0.28.3 <0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  values:
    # Chart 0.28.3 packages 1.29.1; use the current security/bugfix patch.
    image:
      tag: 1.29.2
    replicaCount: 2
    priorityClassName: system-cluster-critical
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
            app.kubernetes.io/instance: cloudnative-pg
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    monitoring:
      podMonitorEnabled: true
      podMonitorAdditionalLabels:
        release: kube-prometheus-stack
      grafanaDashboard:
        create: true
        namespace: monitoring
