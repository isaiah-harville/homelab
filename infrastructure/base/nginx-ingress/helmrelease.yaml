apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: nginx-ingress
spec:
  interval: 30m
  chart:
    spec:
      chart: nginx-ingress
      version: "2.4.1"
      sourceRef:
        kind: HelmRepository
        name: nginx-stable
        namespace: flux-system
  values:
    controller:
      ingressClass:
        create: true
        name: nginx
        setAsDefaultIngressClass: true
      service:
        type: LoadBalancer

