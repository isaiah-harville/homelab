---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weave-gitops
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: weave-gitops
      version: "4.0.36"
      sourceRef:
        kind: HelmRepository
        name: weave-gitops
        namespace: monitoring
  values:
    fullnameOverride: weave-gitops
    adminUser:
      create: true
      username: admin
      createSecret: false
    rbac:
      impersonationResourceNames:
        - admin
    ingress:
      enabled: true
      className: traefik-internal
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Cluster
        gethomepage.dev/name: Flux
        gethomepage.dev/description: GitOps dashboard
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: flux.int.harville.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - flux.int.harville.dev
          secretName: harville-wildcard-shared-tls
