---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.19.3"
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
        namespace: flux-system
  values:
    # k3s auto-creates the `nvidia` RuntimeClass once the NVIDIA Container Toolkit
    # is installed on the node (see ansible k3s_node role). The plugin must run
    # under it to see the GPU.
    runtimeClassName: nvidia
    # The chart keeps its default GPU-detection nodeAffinity even with affinity: {}
    # in values. WSL does not expose the GPU as PCI, so Ansible labels the node
    # nvidia.com/gpu.present=true to satisfy the chart's accepted GPU labels.
    affinity: {}
    # Also gate on our own GPU label so this stays limited to intentional GPU nodes.
    nodeSelector:
      gpu: "true"
    # GPU nodes are tainted dedicated=gpu (reserved for GPU work) — tolerate it.
    tolerations:
      - key: dedicated
        operator: Equal
        value: gpu
        effect: NoSchedule
    # WSL2 exposes the GPU as a mounted device rather than via the usual NVML
    # device list, so advertise it through volume-mounts.
    deviceListStrategy: volume-mounts
