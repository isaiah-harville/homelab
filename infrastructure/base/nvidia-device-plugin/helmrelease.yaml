---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.19.3"
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
        namespace: flux-system
  values:
    # k3s auto-creates the `nvidia` RuntimeClass once the NVIDIA Container Toolkit
    # is installed on the node (see ansible k3s_node role). The plugin must run
    # under it to see the GPU.
    runtimeClassName: nvidia
    # Any bare-metal GPU node (gpu=true, no gpu-wsl label) — WSL boxes use the
    # nvidia-device-plugin-wsl release instead, since they need a different
    # deviceListStrategy. affinity excludes gpu-wsl nodes (nodeSelector alone
    # can't express "label absent"); this also replaces the chart's default
    # NFD-based GPU-detection nodeAffinity, which doesn't apply here.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: gpu-wsl
                  operator: DoesNotExist
    nodeSelector:
      gpu: "true"
    # GPU nodes are tainted dedicated=gpu (reserved for GPU work) — tolerate it.
    tolerations:
      - key: dedicated
        operator: Equal
        value: gpu
        effect: NoSchedule
