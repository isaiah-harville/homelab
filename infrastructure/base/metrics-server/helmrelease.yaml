---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: metrics-server
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  values:
    args:
      # Talos kubelets serve a self-signed cert that isn't signed by the
      # cluster CA, so metrics-server can't verify it over TLS. Skip
      # verification (the standard Talos setting) — the scrape traffic stays
      # on the internal node network. This is what makes `kubectl top` and
      # Headlamp's CPU/memory usage graphs work.
      - --kubelet-insecure-tls
