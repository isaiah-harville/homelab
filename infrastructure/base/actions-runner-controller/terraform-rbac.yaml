---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraform
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraform-tfstate
  namespace: arc-runners
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraform-tfstate
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: terraform
    namespace: arc-runners
roleRef:
  kind: Role
  name: terraform-tfstate
  apiGroup: rbac.authorization.k8s.io
