---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: calibre-web-automated
  namespace: flux-system
spec:
  image: ghcr.io/crocodilestick/calibre-web-automated
  interval: 6h
  exclusionList:
    - ^.*\.sig$
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: calibre-web-automated
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: calibre-web-automated
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=4.0.6 <5.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: shelfmark
  namespace: flux-system
spec:
  image: ghcr.io/calibrain/shelfmark
  interval: 6h
  exclusionList:
    - ^.*\.sig$
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: shelfmark
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: shelfmark
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=1.3.5 <2.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  image: lscr.io/linuxserver/qbittorrent
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: qbittorrent
  filterTags:
    pattern: '^5\.2\.[0-9]+_v[0-9]+\.[0-9]+\.[0-9]+-ls(?P<build>[0-9]+)$'
    extract: '$build'
  policy:
    numerical:
      order: asc
