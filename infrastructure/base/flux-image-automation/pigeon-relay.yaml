---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: pigeon-relay
  namespace: flux-system
spec:
  image: ghcr.io/isaiah-harville/pigeon/relay
  interval: 6h
  exclusionList:
    - ^.*\.sig$
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: pigeon-relay
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: pigeon-relay
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.1.3 <0.2.0'
