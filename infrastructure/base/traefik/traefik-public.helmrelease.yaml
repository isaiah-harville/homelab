---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-public
  namespace: traefik-public
spec:
  interval: 30m
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: traefik
      version: "40.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-public
    additionalArguments:
      - "--entrypoints.web.http.redirections.entryPoint.to=:443"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    providers:
      kubernetesIngress:
        ingressClass: traefik-public
    service:
      annotations:
        metallb.io/address-pool: lab-lb-pool
      type: LoadBalancer
      loadBalancerIP: 10.1.10.252
