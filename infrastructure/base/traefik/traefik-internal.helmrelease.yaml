---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: traefik-internal
spec:
  interval: 30m
  install:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: traefik
      version: ">=41.0.0 <42.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    metrics:
      prometheus:
        addRoutersLabels: true
        service:
          enabled: true
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
    deployment:
      replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-internal-traefik-internal
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-internal
    additionalArguments:
      - "--entrypoints.web.http.redirections.entryPoint.to=:443"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    providers:
      kubernetesIngress:
        ingressClass: traefik-internal
    service:
      annotations:
        metallb.io/address-pool: lab-lb-pool
        # Pin .251 to the internal DNS record; MetalLB otherwise assigns pool IPs arbitrarily.
        metallb.io/loadBalancerIPs: 10.1.10.251
      type: LoadBalancer
