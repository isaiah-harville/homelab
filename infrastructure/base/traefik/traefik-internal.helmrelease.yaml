---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: traefik-internal
spec:
  interval: 30m
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: traefik
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-internal
    additionalArguments:
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    providers:
      kubernetesIngress:
        ingressClass: traefik-internal
    service:
      annotations:
        metallb.universe.tf/address-pool: lab-lb-pool
      type: LoadBalancer
      loadBalancerIP: 10.1.10.251
