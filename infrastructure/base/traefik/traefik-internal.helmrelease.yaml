apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: traefik-internal
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-internal
    providers:
      kubernetesIngress:
        ingressClass: traefik-internal
    service:
      type: LoadBalancer
      loadBalancerIP: 10.1.10.251
