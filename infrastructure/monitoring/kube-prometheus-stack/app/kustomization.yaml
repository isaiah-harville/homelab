---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-user-auth.sops.yaml
  - alertmanager-config.sops.yaml
  - helmrelease.yaml
  - grafana-longhorn.pvc.yaml
  - grafana.ingresses.yaml
  - grafana.networkpolicy.yaml
  - homelab-alerts.yaml
# Homelab dashboards, mounted into Grafana by the `homelab` provider in
# helmrelease.yaml. Fixed name (no hash suffix) because the HelmRelease
# references it; Grafana reloads the files when the ConfigMap changes.
configMapGenerator:
  - name: grafana-dashboards-homelab
    namespace: monitoring
    files:
      - dashboards/homelab-node-health.json
      - dashboards/homelab-storage-health.json
      - dashboards/homelab-services.json
      - dashboards/homelab-inference.json
      - dashboards/homelab-logs.json
    options:
      disableNameSuffixHash: true
