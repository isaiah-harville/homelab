---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=87.0.0 <88.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    # Talos binds the controller-manager, scheduler and kube-proxy metrics to
    # localhost, so Prometheus can never scrape them; left on, they only
    # produce permanent TargetDown/InstanceUnreachable alerts.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      disabled:
        # The nodes are 8/16/64/64 GB and llama-cpp (34Gi) plus primer-lab
        # (21Gi) can only ever fit on a 64 GB node, so the cluster can never
        # tolerate losing one. That's by design; the alert fired non-stop.
        KubeMemoryOvercommit: true
    prometheus:
      prometheusSpec:
        retention: 30d
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 4Gi
        # Whichever limit is hit first wins; in practice the size cap, which
        # keeps about 17 days. It counts the WAL, and sits below the volume
        # so KubePersistentVolumeFillingUp never fires.
        retentionSize: 18GB
        storageSpec:
          volumeClaimTemplate:
            metadata:
              # Longhorn `rolling` group: no snapshots, daily trim. Snapshots
              # kept every block Prometheus had already deleted, so this 24Gi
              # volume used 61Gi per replica. Only new PVCs get the label;
              # the existing one is labelled by hand (see the PR).
              labels:
                recurring-job-group.longhorn.io/rolling: enabled
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 25Gi
              storageClassName: longhorn-retain
    kube-state-metrics:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 192Mi
    prometheusOperator:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 192Mi
    prometheus-node-exporter:
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 128Mi
    alertmanager:
      alertmanagerSpec:
        # Routing, SMTP and the recipient live in this SOPS-encrypted Secret
        # (alertmanager-config.sops.yaml) rather than in these public values;
        # the Cloudflare SMTP token is mounted from the shared cloudflare-smtp.
        configSecret: alertmanager-config
        secrets:
          - cloudflare-smtp
        retention: 120h
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
              storageClassName: longhorn-retain
    grafana:
      # The chart's ~26 built-in dashboards (AIX/macOS node exporter, multi-
      # cluster, API server, etcd, ...) duplicate the curated set below.
      defaultDashboardsEnabled: false
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 768Mi
      sidecar:
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 256Mi
      deploymentStrategy:
        type: Recreate
      env:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      initChownData:
        enabled: false
      grafana.ini:
        users:
          allow_sign_up: false
          auto_assign_org_role: Admin
        auth:
          disable_login_form: true
        auth.proxy:
          enabled: true
          header_name: X-authentik-email
          header_property: email
          auto_sign_up: true
          headers: "Name:X-authentik-name Email:X-authentik-email Groups:X-authentik-groups"
          enable_login_token: false
        auth.anonymous:
          enabled: true
          org_role: Viewer
        security:
          cookie_secure: true
          cookie_samesite: strict
      persistence:
        enabled: true
        type: pvc
        existingClaim: kube-prometheus-stack-grafana-longhorn
        size: 10Gi
        accessModes:
          - ReadWriteOnce
      # Logs from Loki (../../loki), shipped by Alloy (../../alloy).
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc:3100
          jsonData:
            maxLines: 2000
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: kubernetes
              orgId: 1
              folder: Kubernetes
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/kubernetes
            - name: networking
              orgId: 1
              folder: Networking
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/networking
            - name: homelab
              orgId: 1
              folder: Homelab
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/homelab
      # The Homelab folder (generated JSON in ./dashboards) is the starting
      # point: nodes, storage, services, inference and logs. It replaced the
      # grafana.com Longhorn and Kubernetes "Nodes" dashboards, which covered
      # the same ground less usefully. Networking stays on the Traefik one.
      dashboardsConfigMaps:
        homelab: grafana-dashboards-homelab
      # Kubernetes drill-downs the Homelab set doesn't repeat: per-namespace
      # and per-pod resource use.
      dashboards:
        kubernetes:
          global:
            gnetId: 15757
            revision: 43
            datasource: Prometheus
          namespaces:
            gnetId: 15758
            revision: 46
            datasource: Prometheus
          pods:
            gnetId: 15760
            revision: 39
            datasource: Prometheus
        networking:
          traefik:
            gnetId: 17346
            revision: 9
            datasource: Prometheus
      service:
        type: ClusterIP
      ingress:
        enabled: false
