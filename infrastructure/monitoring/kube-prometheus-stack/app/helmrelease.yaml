---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=87.0.0 <88.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    # Talos binds the controller-manager, scheduler and kube-proxy metrics to
    # localhost, so Prometheus can never scrape them; left on, they only
    # produce permanent TargetDown/InstanceUnreachable alerts.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 30d
        retentionSize: 18GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 25Gi
              storageClassName: longhorn-retain
    alertmanager:
      alertmanagerSpec:
        # Routing, SMTP and the recipient live in this SOPS-encrypted Secret
        # (alertmanager-config.sops.yaml) rather than in these public values;
        # the Cloudflare SMTP token is mounted from the shared cloudflare-smtp.
        configSecret: alertmanager-config
        secrets:
          - cloudflare-smtp
        retention: 120h
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
              storageClassName: longhorn-retain
    grafana:
      deploymentStrategy:
        type: Recreate
      env:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      initChownData:
        enabled: false
      grafana.ini:
        users:
          allow_sign_up: false
          auto_assign_org_role: Admin
        auth:
          disable_login_form: true
        auth.proxy:
          enabled: true
          header_name: X-authentik-email
          header_property: email
          auto_sign_up: true
          headers: "Name:X-authentik-name Email:X-authentik-email Groups:X-authentik-groups"
          enable_login_token: false
        auth.anonymous:
          enabled: true
          org_role: Viewer
        security:
          cookie_secure: true
          cookie_samesite: strict
      persistence:
        enabled: true
        type: pvc
        existingClaim: kube-prometheus-stack-grafana-longhorn
        size: 10Gi
        accessModes:
          - ReadWriteOnce
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: kubernetes
              orgId: 1
              folder: Kubernetes
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/kubernetes
            - name: storage
              orgId: 1
              folder: Storage
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/storage
            - name: networking
              orgId: 1
              folder: Networking
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/networking
      dashboards:
        kubernetes:
          global:
            gnetId: 15757
            revision: 43
            datasource: Prometheus
          namespaces:
            gnetId: 15758
            revision: 46
            datasource: Prometheus
          nodes:
            gnetId: 15759
            revision: 40
            datasource: Prometheus
          pods:
            gnetId: 15760
            revision: 39
            datasource: Prometheus
        storage:
          longhorn:
            gnetId: 16888
            revision: 14
            datasource: Prometheus
        networking:
          traefik:
            gnetId: 17346
            revision: 9
            datasource: Prometheus
      service:
        type: ClusterIP
      ingress:
        enabled: false
