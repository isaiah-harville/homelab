---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates
  namespace: flux-system
  annotations:
    # TEMPORARY: moved here from clusters/homelab/flux-system; stops the
    # old parent deleting it (and pruning what it owns) on the way out.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/certificates/certificates/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: issuers
    - name: traefik-internal
