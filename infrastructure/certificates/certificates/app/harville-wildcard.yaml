---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harville-wildcard
spec:
  secretName: harville-wildcard-shared-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns
  dnsNames:
    - "*.harville.dev"
    - "*.int.harville.dev"
    - "harville.ai"
    - "*.harville.ai"
    - "*.int.harville.ai"
    - "innerswings.com"
    - "*.innerswings.com"
    - "pigeonwire.app"
    - "*.pigeonwire.app"
