---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harville-wildcard
spec:
  secretName: harville-wildcard-shared-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns
  dnsNames:
    # .dev
    - "harville.dev"
    - "*.harville.dev"
    - "*.int.harville.dev"
    # .ai
    - "harville.ai"
    - "*.harville.ai"
    - "*.int.harville.ai"
    # innerswings
    - "innerswings.com"
    - "*.innerswings.com"
    # pigeon
    - "pigeonwire.app"
    - "*.pigeonwire.app"
    # switchback
    - "switchback.sh"
    - "*.switchback.sh"
