---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/cnpg-system/cloudnative-pg/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
