---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/kube-system/metrics-server/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
