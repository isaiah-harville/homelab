---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: gpu-operator
      version: ">=26.7.0 <27.0.0"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
  values:
    driver:
      enabled: false
    toolkit:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
    devicePlugin:
      env:
        - name: NVIDIA_CDI_HOOK_PATH
          value: /usr/local/bin/nvidia-cdi-hook
    nfd:
      enabled: true
    migManager:
      enabled: false
    dcgmExporter:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
    daemonsets:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
