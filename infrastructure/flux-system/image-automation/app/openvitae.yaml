---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: openvitae-api
  namespace: flux-system
spec:
  image: ghcr.io/isaiah-harville/openvitae/api
  interval: 5m
  exclusionList:
    - ^.*\.sig$
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: openvitae-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: openvitae-api
  filterTags:
    pattern: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '*'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: openvitae-frontend
  namespace: flux-system
spec:
  image: ghcr.io/isaiah-harville/openvitae/frontend
  interval: 5m
  exclusionList:
    - ^.*\.sig$
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: openvitae-frontend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: openvitae-frontend
  filterTags:
    pattern: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '*'
