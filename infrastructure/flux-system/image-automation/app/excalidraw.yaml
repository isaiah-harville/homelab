---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: excalidash-backend
  namespace: flux-system
spec:
  image: docker.io/zimengxiong/excalidash-backend
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: excalidash-backend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: excalidash-backend
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '*'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: excalidash-frontend
  namespace: flux-system
spec:
  image: docker.io/zimengxiong/excalidash-frontend
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: excalidash-frontend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: excalidash-frontend
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '*'
