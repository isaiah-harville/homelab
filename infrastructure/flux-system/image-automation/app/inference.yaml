---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: vllm
  namespace: flux-system
spec:
  image: docker.io/vllm/vllm-openai
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vllm
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: vllm
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '*'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: text-embeddings-inference
  namespace: flux-system
spec:
  image: ghcr.io/huggingface/text-embeddings-inference
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: text-embeddings-inference
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: text-embeddings-inference
  filterTags:
    pattern: '^cpu-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '*'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: searxng
  namespace: flux-system
spec:
  image: docker.io/searxng/searxng
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: searxng
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: searxng
  filterTags:
    pattern: '^(?P<version>[0-9]{4}\.[0-9]+\.[0-9]+)-[0-9a-f]+$'
    extract: '$version'
  policy:
    semver:
      range: '*'
