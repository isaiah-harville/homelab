---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  image: ghcr.io/home-assistant/home-assistant
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: home-assistant
  filterTags:
    pattern: '^(?P<version>[0-9]{4}\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '*'
