---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: pigeon-website
  namespace: flux-system
spec:
  image: ghcr.io/isaiah-harville/pigeon/website
  interval: 5m
  exclusionList:
    - ^.*\.sig$
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: pigeon-website
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: pigeon-website
  filterTags:
    pattern: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '*'
