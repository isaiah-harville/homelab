---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  path: ./infrastructure/longhorn-system/longhorn/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
