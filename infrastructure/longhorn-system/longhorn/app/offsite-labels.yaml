---
# Recurring-job membership is a label on the Longhorn Volume, and Longhorn
# never copies it from the PVC, so a volume would silently miss its weekly
# off-site backup. Keep Git the source of truth: copy
# recurring-job-group.longhorn.io/* labels from each PVC onto its volume.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: offsite-labels
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: offsite-labels
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: offsite-labels
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: offsite-labels
subjects:
  - kind: ServiceAccount
    name: offsite-labels
    namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: offsite-labels
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: offsite-labels
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: offsite-labels
subjects:
  - kind: ServiceAccount
    name: offsite-labels
    namespace: longhorn-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-labels
  namespace: longhorn-system
spec:
  schedule: "40 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: offsite-labels
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: offsite-labels
              image: docker.io/bitnami/kubectl:1.34.1
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  kubectl get pvc -A -o json |
                    jq -r '.items[]
                      | select(.spec.volumeName != null)
                      | . as $p
                      | (.metadata.labels // {}) | to_entries
                      | map(select(.key | startswith("recurring-job-group.longhorn.io/")))
                      | select(length > 0)
                      | "\($p.spec.volumeName) " + (map("\(.key)=\(.value)") | join(" "))' |
                  while read -r volume labels; do
                    have=$(kubectl -n longhorn-system get volumes.longhorn.io "$volume" \
                      -o jsonpath='{.metadata.labels}' 2>/dev/null || true)
                    [ -n "$have" ] || continue
                    for label in $labels; do
                      key=${label%%=*}
                      case "$have" in *"\"$key\""*) continue;; esac
                      kubectl -n longhorn-system label volumes.longhorn.io "$volume" "$label" --overwrite
                    done
                  done
                  echo "labels reconciled"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
