---
# Recurring-job membership is a label on the Longhorn Volume, and Longhorn
# never copies it from the PVC, so a volume would silently miss its weekly
# off-site backup. Keep Git the source of truth: copy
# recurring-job-group.longhorn.io/* labels from each PVC onto its volume.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: offsite-labels
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: offsite-labels
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: offsite-labels
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: offsite-labels
subjects:
  - kind: ServiceAccount
    name: offsite-labels
    namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: offsite-labels
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [volumes]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: offsite-labels
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: offsite-labels
subjects:
  - kind: ServiceAccount
    name: offsite-labels
    namespace: longhorn-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-labels
  namespace: longhorn-system
spec:
  schedule: "40 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: offsite-labels
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: offsite-labels
              image: python:3.14-alpine
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /scripts/offsite_labels.py
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: scripts
              configMap:
                name: longhorn-offsite-labels
