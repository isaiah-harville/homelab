---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: longhorn
      version: ">=1.12.0 <1.13.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    defaultSettings:
      createDefaultDiskLabeledNodes: true
      defaultDataPath: /var/mnt/longhorn
      # Only applies when Longhorn creates a disk; existing disks keep their
      # own spec.disks[].storageReserved, which was patched to match.
      storageReservedPercentageForDefaultDisk: 20
      defaultReplicaCount: 3
      allowVolumeCreationWithDegradedAvailability: false
      replicaAutoBalance: least-effort
      replicaSoftAntiAffinity: false
      # When a node dies, force-delete its Deployment/StatefulSet pods so their
      # RWO volumes can attach elsewhere. The default (do-nothing) leaves them
      # stuck Terminating, and single-replica apps stay down until the node
      # comes back.
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      # A node that drops out comes back with replica data Longhorn has
      # already rebuilt elsewhere; delete those leftovers (after the default
      # grace period) instead of letting them fill the disk.
      orphanResourceAutoDeletion: replica-data;instance
    persistence:
      defaultClassReplicaCount: 3
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
