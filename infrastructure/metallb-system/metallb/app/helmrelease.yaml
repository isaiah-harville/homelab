---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: metallb
      version: ">=0.16.0 <0.17.0"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  values:
    crds:
      enabled: true
    controller:
      resources:
        requests:
          memory: 96Mi
        limits:
          memory: 320Mi
    frr-k8s:
      frrk8s:
        resources:
          requests:
            memory: 96Mi
          limits:
            memory: 320Mi
        frr:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
        reloader:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
        frrMetrics:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
        frrStatus:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
    speaker:
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 128Mi
