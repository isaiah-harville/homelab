---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-runners
  namespace: arc-runners
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  dependsOn:
    - name: gha-runner-scale-set-controller
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: ">=0.9.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  values:
    runnerScaleSetName: homelab
    githubConfigUrl: https://github.com/isaiah-harville/homelab
    githubConfigSecret: github-config

    minRunners: 0
    maxRunners: 1

    template:
      spec:
        serviceAccountName: terraform
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            env:
              - name: KUBE_IN_CLUSTER_CONFIG
                value: "true"
            envFrom:
              - secretRef:
                  name: omni-terraform
