---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: cert-manager
      version: ">=1.20.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    installCRDs: true
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    cainjector:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 192Mi
    webhook:
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 128Mi
