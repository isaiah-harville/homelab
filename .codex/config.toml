sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = true

[mcp_servers.flux-operator-mcp]
command = "flux-operator-mcp"
args = ["serve"]
enabled = true
required = false
default_tools_approval_mode = "writes"
startup_timeout_sec = 15
tool_timeout_sec = 90
