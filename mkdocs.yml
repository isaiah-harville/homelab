---
site_name: Homelab
site_description: Architecture, operations, and repository guides for the homelab
site_url: https://homelab.harville.dev/
repo_url: https://github.com/isaiah-harville/homelab
repo_name: isaiah-harville/homelab

docs_dir: docs
site_dir: site
strict: true

watch:
  - README.md
  - apps
  - clusters
  - infrastructure
  - omni-server/README.md
  - talos/README.md
  - terraform/omni/README.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/generate_reference.py
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Architecture:
      - Overview: architecture/overview.md
      - Reconciliation model: architecture/reconciliation.md
  - Repository:
      - Apps: apps/README.md
      - Primer: apps/primer.md
      - Clusters: clusters/README.md
      - Homelab composition: clusters/homelab/README.md
      - Infrastructure: infrastructure/README.md
      - Base infrastructure: infrastructure/base/README.md
  - Runbooks:
      - Omni management plane: omni-server/README.md
      - Talos cluster: talos/README.md
      - Terraform for Omni: terraform/omni/README.md
      - Backup and recovery: operations/backups.md
      - Secrets: operations/secrets.md
      - Authentication: operations/authentication.md
      - Storage: operations/storage.md
      - Monitoring: operations/monitoring.md
  - Decisions:
      - Terraform state backend: decisions/terraform-state.md
      - Metrics Server TLS: decisions/metrics-server-tls.md
      - Omni resource identity: decisions/omni-resource-identity.md
  - Generated reference:
      - About generated docs: reference/index.md
      - Helm releases: reference/helm-releases.md
      - Flux sources: reference/sources.md
      - Flux reconciliation: reference/flux-kustomizations.md
  - Contributing:
      - Documentation: contributing/documentation.md
