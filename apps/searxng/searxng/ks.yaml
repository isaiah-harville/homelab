---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: searxng
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/searxng/searxng/app
  prune: true
  wait: true
  targetNamespace: searxng
  sourceRef:
    kind: GitRepository
    name: flux-system
