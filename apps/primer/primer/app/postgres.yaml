---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: primer-postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
  primaryUpdateStrategy: unsupervised
  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      # A replication slot for a replica that is down pins WAL on the primary
      # indefinitely; unbounded, that filled authentik's 5Gi volume and took
      # the primary down with it. Past this cap the slot is dropped and the
      # replica re-syncs from the WAL archive instead.
      max_slot_wal_keep_size: 4GB
    # pgvector is mounted as a read-only ImageVolume rather than baked into a
    # custom Postgres image, so the extension upgrades independently of the
    # server. Needs CNPG >= 1.27 and PostgreSQL 18's extension_control_path.
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.6-18-trixie
  # Restored from the object store when this cluster moved out of the `apps`
  # namespace (2026-09-19); bootstrap only runs on first creation, and the
  # restored data already has the `vector` extension. `origin` is the
  # archive the old cluster wrote under its own server name.
  bootstrap:
    recovery:
      source: origin
      database: primer
      owner: primer
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: primer-postgres-backup
          serverName: primer-postgres
  storage:
    storageClass: longhorn-database
    size: 20Gi
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/default: enabled
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  monitoring:
    disableDefaultQueries: false
  # Libraries, documents, passages, and every stored vector live here. The
  # objects in S3 are raw uploads only, so losing this database loses the
  # citations and the index, not just the derived data.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: primer-postgres-backup
        # Distinct from `origin` above: a restored cluster must archive into
        # an empty location, not on top of the history it was restored from.
        serverName: primer-postgres-primer
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: primer-postgres-backup
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://backups/config/primer-postgres
    endpointURL: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
    s3Credentials:
      accessKeyId:
        name: config-backup-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: config-backup-s3
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: primer-postgres-nightly
spec:
  # Six-field cron (seconds first). 02:00, staggered off Authentik (01:30) and
  # MLflow (01:45) so the three do not compete for the same SeaweedFS volume.
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: primer-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: primer-postgres
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: primer-postgres
  podMetricsEndpoints:
    - port: metrics
