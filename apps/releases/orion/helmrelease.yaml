---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: orion
  namespace: apps
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: orion
      version: ">=0.2.0 <=5.0.0"
      sourceRef:
        kind: HelmRepository
        name: orion
        namespace: flux-system
      interval: 10m
  # The chart sets no spread, so both API replicas could land on one node and
  # fall over together. Force one per node.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: "orion-api"
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: _
              spec:
                template:
                  spec:
                    topologySpreadConstraints:
                      - maxSkew: 1
                        topologyKey: kubernetes.io/hostname
                        whenUnsatisfiable: DoNotSchedule
                        labelSelector:
                          matchLabels:
                            app.kubernetes.io/instance: orion
                        # Spread each component against its own current pods
                        # only, so old ReplicaSet pods don't block a rollout.
                        matchLabelKeys:
                          - app.kubernetes.io/component
                          - pod-template-hash
  values:
    ingress:
      enabled: false
    persistence:
      enabled: true
      accessMode: ReadWriteMany
      size: 15Gi
    api:
      replicaCount: 2
    nexrad:
      env:
        # NEXRAD's own publish latency dominates frame age: measured against
        # the archive, the median station's newest volume is already ~9 min
        # old, and 90% of stations are within ~15 min. Holding the cutoff a
        # further 10 min back (the 600s default) therefore bought nothing --
        # 360s selects the same 126 stations about 2.6 min sooner.
        ORION_NEXRAD_INGEST_LAG_SECONDS: "360"
    gui:
      env:
        VITE_API_URL: https://orion.harville.dev/api
