---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: swing-thoughts
  namespace: flux-system
spec:
  interval: 5m
  path: ./SwingThoughtsWebsite/deploy/k8s
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: swing-thoughts
  dependsOn:
    - name: infra
    - name: certificates
