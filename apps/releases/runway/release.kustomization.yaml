---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runway
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/k8s
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: runway
  dependsOn:
    - name: infra
    - name: certificates
