---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runway
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/k8s
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: runway
  dependsOn:
    - name: infra
    - name: certificates
  # Runway's manifests live in its own repo and set no spread, so both
  # replicas could land on one node and fall over together.
  patches:
    - target:
        kind: Deployment
        name: runway
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: runway
        spec:
          template:
            spec:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app: runway
                  matchLabelKeys:
                    - pod-template-hash
