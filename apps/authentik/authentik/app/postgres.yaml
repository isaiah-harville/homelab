---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
  priorityClassName: system-cluster-critical
  primaryUpdateStrategy: unsupervised
  # Restored from the object store when this cluster moved out of the `apps`
  # namespace (2026-09-19); bootstrap only runs on first creation. `origin`
  # is the archive the old cluster wrote under its own server name.
  bootstrap:
    recovery:
      source: origin
      database: authentik
      owner: authentik
      secret:
        name: authentik-postgres
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: authentik-postgres-backup
          serverName: authentik-postgres
  storage:
    storageClass: longhorn-database
    size: 10Gi
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/default: enabled
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      # A replication slot for a replica that is down pins WAL on the primary
      # indefinitely; unbounded, that filled authentik's 5Gi volume and took
      # the primary down with it. Past this cap the slot is dropped and the
      # replica re-syncs from the WAL archive instead.
      max_slot_wal_keep_size: 2GB
  monitoring:
    disableDefaultQueries: false
  # Authentik's users, groups, OIDC providers and flows live only here — none of
  # it is reconstructable from Git. Longhorn snapshots of a running Postgres are
  # crash-consistent at best, so back the database up properly: continuous WAL
  # archiving plus a nightly base backup gives point-in-time recovery.
  #
  # Uses the Barman Cloud plugin rather than spec.backup.barmanObjectStore,
  # which CNPG deprecated in 1.26. Configuration lives in the ObjectStore below.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-postgres-backup
        # Distinct from `origin` above: a restored cluster must archive into
        # an empty location, not on top of the history it was restored from.
        serverName: authentik-postgres-authentik
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: authentik-postgres-backup
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://backups/config/authentik-postgres
    endpointURL: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
    s3Credentials:
      accessKeyId:
        name: config-backup-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: config-backup-s3
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-postgres-nightly
spec:
  # CNPG uses six-field cron: seconds first. 01:30 daily, before the 02:15
  # Longhorn snapshot window so the two do not contend for disk.
  schedule: "0 30 1 * * *"
  backupOwnerReference: self
  cluster:
    name: authentik-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-postgres
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: authentik-postgres
  podMetricsEndpoints:
    - port: metrics
