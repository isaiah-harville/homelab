---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - authentik-postgres.sops.yaml
  - authentik-social.sops.yaml
  - authentik-core.sops.yaml
  - helmrelease.yaml
  - postgres.yaml
  - postgres-alerts.yaml
  - ingress.yaml
  - middleware.yaml
  - callback-ingresses.yaml
  - blueprint.yaml
configMapGenerator:
  - name: authentik-branding-assets
    files:
      - harville-labs-logo.png=assets/harville-labs-logo.png
      - harville-labs-favicon.png=assets/harville-labs-favicon.png
      - homelab-login-background.jpg=assets/homelab-login-background.jpg
  - name: authentik-customization
    files:
      - homelab-customization.yaml=customization-blueprint.yaml.tpl
    options:
      disableNameSuffixHash: true
generatorOptions:
  disableNameSuffixHash: false
configurations:
  - kustomizeconfig.yaml
# Blueprints re-apply only when their file changes, so stamp the social-login
# secret's SOPS MAC into the customization blueprint: rotating that secret
# then changes the file and Authentik picks up the new client credentials.
replacements:
  - source:
      kind: Secret
      name: authentik-social
      fieldPath: sops.mac
    targets:
      - select:
          kind: ConfigMap
          name: authentik-customization
        fieldPaths:
          - data.homelab-customization\.yaml
        options:
          delimiter: '# authentik-social-mac: '
          index: 1
