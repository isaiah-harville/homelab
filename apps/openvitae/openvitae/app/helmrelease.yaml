---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openvitae
  namespace: apps
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      # Chart lives in the OpenVitae repo (Git source), not a Helm registry.
      chart: helm/openvitae
      sourceRef:
        kind: GitRepository
        name: openvitae
        namespace: flux-system
      interval: 10m
  # Flux decrypts these values from the SOPS secret.
  valuesFrom:
    - kind: Secret
      name: openvitae-secrets
      valuesKey: jwtSecret
      targetPath: auth.jwtSecret
    - kind: Secret
      name: openvitae-secrets
      valuesKey: adminPassword
      targetPath: auth.admin.password
    - kind: Secret
      name: openvitae-secrets
      valuesKey: postgresPassword
      targetPath: postgres.auth.password
    - kind: Secret
      name: openvitae-secrets
      valuesKey: s3AccessKey
      targetPath: externalS3.accessKey
    - kind: Secret
      name: openvitae-secrets
      valuesKey: s3SecretKey
      targetPath: externalS3.secretKey
  values:
    api:
      image:
        tag: latest
        pullPolicy: Always
    frontend:
      image:
        tag: latest
        pullPolicy: Always
    auth:
      admin:
        email: isaiah@harville.dev
      # Authentik protects /admin and /api; the public CV and S3 host stay anonymous.
      mode: proxy
    # MinIO no longer publishes images; objects live in the shared SeaweedFS.
    minio:
      enabled: false
    externalS3:
      endpointUrl: http://seaweedfs-s3.apps.svc.cluster.local:8333
      bucket: openvitae
    # Presigned links are opened by the visitor's browser; s3-ingress.yaml
    # exposes only this bucket on the public host.
    publicS3Url: https://openvitae-s3.harville.dev
    # This chart renders its own Ingress, outside the repo-wide Ingress patches.
    ingress:
      enabled: true
      className: traefik-public
      host: isaiah.harville.dev
      tls:
        enabled: true
        secretName: harville-wildcard-shared-tls
      # The chart applies this middleware only to /admin and /api.
      protectedAnnotations:
        traefik.ingress.kubernetes.io/router.middlewares: apps-authentik-forwardauth@kubernetescrd
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Public
        gethomepage.dev/name: CV
        gethomepage.dev/description: Personal CV site
        gethomepage.dev/href: https://isaiah.harville.dev
        gethomepage.dev/siteMonitor: https://isaiah.harville.dev
