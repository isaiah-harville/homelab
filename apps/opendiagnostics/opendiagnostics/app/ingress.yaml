---
# Each prediction costs about a second of CPU, so requests are rate limited per client
# and each client may have only a few in flight at once.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opendiagnostics-limits
  namespace: opendiagnostics
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 20
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opendiagnostics-in-flight
  namespace: opendiagnostics
spec:
  inFlightReq:
    amount: 3
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Uploads are at most 10 MB; the app rejects anything larger too.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opendiagnostics-upload-size
  namespace: opendiagnostics
spec:
  buffering:
    maxRequestBodyBytes: 11534336
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opendiagnostics
  namespace: opendiagnostics
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: opendiagnostics-opendiagnostics-limits@kubernetescrd,opendiagnostics-opendiagnostics-in-flight@kubernetescrd,opendiagnostics-opendiagnostics-upload-size@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Public
    gethomepage.dev/name: OpenDiagnostics demo
    gethomepage.dev/description: Research medical-imaging models; uploads are never stored
    gethomepage.dev/href: https://diagnostics.harville.dev
    gethomepage.dev/siteMonitor: https://diagnostics.harville.dev/healthz
spec:
  ingressClassName: traefik-public
  tls:
    - hosts: [diagnostics.harville.dev]
  rules:
    - host: diagnostics.harville.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opendiagnostics-web
                port:
                  name: http
