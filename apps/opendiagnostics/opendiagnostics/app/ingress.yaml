---
# Each prediction (a form POST) costs about a second of CPU, so predictions are rate
# limited per client and each client may have only a few in flight at once. Pages and
# images are cheap and a model page loads eight thumbnails at once, so other requests get
# only the looser opendiagnostics-browse limit.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opendiagnostics-limits
  namespace: opendiagnostics
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 20
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opendiagnostics-in-flight
  namespace: opendiagnostics
spec:
  inFlightReq:
    amount: 3
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opendiagnostics-browse
  namespace: opendiagnostics
spec:
  rateLimit:
    average: 600
    period: 1m
    burst: 120
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Uploads are at most 10 MB; the app rejects anything larger too.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opendiagnostics-upload-size
  namespace: opendiagnostics
spec:
  buffering:
    maxRequestBodyBytes: 11534336
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opendiagnostics
  namespace: opendiagnostics
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: opendiagnostics-opendiagnostics-browse@kubernetescrd,opendiagnostics-opendiagnostics-upload-size@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Public
    gethomepage.dev/name: OpenDiagnostics demo
    gethomepage.dev/description: Research medical-imaging models; uploads are never stored
    gethomepage.dev/href: https://diagnostics.harville.dev
    gethomepage.dev/siteMonitor: https://diagnostics.harville.dev/healthz
spec:
  ingressClassName: traefik-public
  tls:
    - hosts: [diagnostics.harville.dev, diagnostics.harville.ai]
  rules:
    - host: diagnostics.harville.dev
      http: &site
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opendiagnostics-web
                port:
                  name: http
    - host: diagnostics.harville.ai
      http: *site
---
# Predictions are form POSTs. An IngressRoute because an Ingress cannot match on method;
# its longer rule wins over the Ingress for the same hosts. Neither Traefik sets a CRD
# ingress class, so both serve it; the public DNS names resolve only to traefik-public.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opendiagnostics-predict
  namespace: opendiagnostics
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: >-
        (Host(`diagnostics.harville.dev`) || Host(`diagnostics.harville.ai`))
        && Method(`POST`)
      middlewares:
        - name: opendiagnostics-limits
        - name: opendiagnostics-in-flight
        - name: opendiagnostics-upload-size
      services:
        - name: opendiagnostics-web
          port: http
  tls: {}
