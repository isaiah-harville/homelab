apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # The demo's own manifests (inference API and frontend), from its repo. The
  # `opendiagnostics` Kustomization that applies this file also owns the GitRepository
  # and the Ingress.
  name: opendiagnostics-upstream
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/k8s
  prune: true
  targetNamespace: opendiagnostics
  wait: true
  # The inference API downloads every published checkpoint (about 2.3 GB on the first start)
  # and loads the models on CPU before it reports ready; its startup probe allows 30 minutes.
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: opendiagnostics
  # Pinned by Flux image automation (infrastructure/flux-system/image-automation/app/
  # opendiagnostics.yaml) to the newest build of the app repo's main.
  images:
    - name: ghcr.io/isaiah-harville/opendiagnostics-serve
      newTag: 20261128160922-30c29e7 # {"$imagepolicy": "flux-system:opendiagnostics-serve:tag"}
    - name: ghcr.io/isaiah-harville/opendiagnostics-web
      newTag: 20261128171554-b298fb0 # {"$imagepolicy": "flux-system:opendiagnostics-web:tag"}
  dependsOn:
    - name: infra
    - name: certificates
