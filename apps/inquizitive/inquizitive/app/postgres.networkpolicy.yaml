---
# Only the database's own namespace, the CloudNativePG operator and Prometheus
# can reach these pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inquizitive-postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: inquizitive-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
