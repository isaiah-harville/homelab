---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: inquizitive-postgres
spec:
  # Study sets, progress and review history: one instance per node, and every
  # commit reaches a standby before it's acknowledged.
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
  primaryUpdateStrategy: unsupervised
  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      # See primer-postgres: an unbounded slot for a down replica can fill the volume.
      max_slot_wal_keep_size: 2GB
  # Bootstrap runs only when the cluster is first created. To rebuild it from
  # backups, switch this to `recovery` from `origin` (as primer-postgres does)
  # and bump the archiving serverName below, so the new cluster archives into
  # an empty location instead of on top of the history it restores from.
  bootstrap:
    initdb:
      database: inquizitive
      owner: inquizitive
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: inquizitive-postgres-backup
          serverName: inquizitive-postgres
  storage:
    storageClass: longhorn-database
    size: 5Gi
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/default: enabled
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  monitoring:
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: inquizitive-postgres-backup
        serverName: inquizitive-postgres
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: inquizitive-postgres-backup
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://backups/config/inquizitive-postgres
    endpointURL: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
    s3Credentials:
      accessKeyId:
        name: config-backup-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: config-backup-s3
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: inquizitive-postgres-nightly
spec:
  # 02:30, after switchback-site (02:15), so they don't compete for the same SeaweedFS volume.
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster:
    name: inquizitive-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: inquizitive-postgres
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: inquizitive-postgres
  podMetricsEndpoints:
    - port: metrics
