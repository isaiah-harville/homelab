---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: inquizitive
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: inquizitive
      # 0.x: minor versions may change values; review before widening.
      version: ">=0.1.0 <0.2.0"
      sourceRef:
        kind: HelmRepository
        name: inquizitive
        namespace: flux-system
  values:
    appUrl: https://inquizitive.harville.dev
    # SQLite and card images share one retained Longhorn volume, so this stays
    # a single replica. Moving to CNPG needs config-backup-s3 reflected here.
    persistence:
      enabled: true
      size: 5Gi
      storageClass: longhorn-retain
    # Inquizitive signs people in itself (public OIDC client with PKCE), so
    # there is no ForwardAuth: the desktop app syncs with bearer tokens that
    # can't follow Authentik's browser redirect.
    auth:
      mode: oidc
      oidc:
        issuer: https://auth.harville.dev/application/o/inquizitive/
        clientId: inquizitive
        scopes: openid profile email groups
        adminClaim: groups
        adminValue: authentik Admins
        providerName: Harville Labs account
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      fsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    ingress:
      enabled: true
      className: traefik-public
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Public
        gethomepage.dev/name: Inquizitive
        gethomepage.dev/description: Flashcards and spaced repetition
        gethomepage.dev/href: https://inquizitive.harville.dev
        gethomepage.dev/siteMonitor: https://inquizitive.harville.dev/api/health/
      hosts:
        - host: inquizitive.harville.dev
          paths:
            - path: /
              pathType: Prefix
      # No secretName: the default TLSStore serves the wildcard certificate.
      tls:
        - hosts:
            - inquizitive.harville.dev
