---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: inquizitive
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: inquizitive
      # 0.x: minor versions may change values; review before widening.
      version: ">=0.1.0 <0.2.0"
      sourceRef:
        kind: HelmRepository
        name: inquizitive
        namespace: flux-system
  values:
    appUrl: https://quiz.harville.dev
    # Stateless: Postgres from CloudNativePG, card images in the shared
    # SeaweedFS (bucket `inquizitive`, scoped credentials), sessions in the DB.
    replicaCount: 2
    database:
      existingSecret: inquizitive-postgres-app
      existingSecretKey: uri
    storage:
      driver: s3
      s3:
        endpoint: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
        bucket: inquizitive
        forcePathStyle: true
        existingSecret: inquizitive-s3
    persistence:
      enabled: false
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: inquizitive
    # Inquizitive signs people in itself (public OIDC client with PKCE), so
    # there is no ForwardAuth: the desktop app syncs with bearer tokens that
    # can't follow Authentik's browser redirect.
    auth:
      mode: oidc
      oidc:
        issuer: https://auth.harville.dev/application/o/inquizitive/
        clientId: inquizitive
        scopes: openid profile email groups
        adminClaim: groups
        adminValue: authentik Admins
        providerName: Harville Labs account
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      fsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    # The Ingresses live in this folder (ingress.yaml): ForwardAuth for the
    # site, and a second route without it for desktop sync.
    ingress:
      enabled: false
