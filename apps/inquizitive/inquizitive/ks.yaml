---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inquizitive
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/inquizitive/inquizitive/app
  prune: true
  wait: true
  targetNamespace: inquizitive
  sourceRef:
    kind: GitRepository
    name: flux-system
