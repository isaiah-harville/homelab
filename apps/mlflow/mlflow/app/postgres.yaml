---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mlflow-postgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: mlflow
      owner: mlflow
      secret:
        name: mlflow-postgres
      postInitSQL:
        - CREATE DATABASE mlflow_auth OWNER mlflow;
  storage:
    storageClass: longhorn-database
    size: 10Gi
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/default: enabled
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      # A replication slot for a replica that is down pins WAL on the primary
      # indefinitely; unbounded, that filled authentik's 5Gi volume and took
      # the primary down with it. Past this cap the slot is dropped and the
      # replica re-syncs from the WAL archive instead.
      max_slot_wal_keep_size: 2GB
  monitoring:
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: mlflow-postgres-backup
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: mlflow-postgres-backup
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://backups/config/mlflow-postgres
    endpointURL: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
    s3Credentials:
      accessKeyId:
        name: config-backup-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: config-backup-s3
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mlflow-postgres-nightly
spec:
  schedule: "0 45 1 * * *"
  backupOwnerReference: self
  cluster:
    name: mlflow-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mlflow-postgres
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: mlflow-postgres
  podMetricsEndpoints:
    - port: metrics
