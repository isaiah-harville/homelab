---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pool
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-media
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  labels:
    # Daily snapshots plus a weekly backup off-site (Cloudflare R2).
    recurring-job-group.longhorn.io/default: enabled
    recurring-job-group.longhorn.io/offsite: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-retain
  resources:
    requests:
      storage: 2Gi
---
