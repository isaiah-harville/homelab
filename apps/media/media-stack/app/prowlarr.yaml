---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: bootstrap
          image: python:3.14-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: ARR_NAME
              value: Prowlarr
            - name: ARR_PORT
              value: "9696"
            - name: ARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-auth
                  key: PROWLARR_API_KEY
          command:
            - python
            - /scripts/arr_bootstrap.py
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.1
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - NET_ADMIN
                - SETUID
          env:
            - name: VPN_SERVICE_PROVIDER
              value: nordvpn
            - name: VPN_TYPE
              value: openvpn
            - name: OPENVPN_PROTOCOL
              value: udp
            - name: SERVER_COUNTRIES
              value: United States
            # Select from Nord's full P2P pool instead of pinning a hostname;
            # Gluetun refreshes this list and fails closed if the tunnel drops.
            - name: SERVER_CATEGORIES
              value: P2P
            - name: UPDATER_PERIOD
              value: 480h
            - name: FIREWALL_INPUT_PORTS
              value: "9696"
            # The default health check resolves a hostname, so it fails when DNS
            # itself is the problem — which is exactly what stalled Prowlarr for
            # 22 hours. Check a literal address instead.
            - name: HEALTH_TARGET_ADDRESS
              value: 1.1.1.1:443
            # Plain DNS through the tunnel rather than gluetun's DNS-over-TLS:
            # when the DoT upstreams were unreachable, every lookup in the pod
            # failed and the tunnel never recovered.
            - name: DOT
              value: "off"
            - name: DNS_ADDRESS
              value: 1.1.1.1
            # Reconnect (picking another US P2P server) soon after a tunnel
            # goes bad, instead of backing off for long stretches.
            - name: HEALTH_VPN_DURATION_INITIAL
              value: 30s
            - name: HEALTH_VPN_DURATION_ADDITION
              value: 10s
            # Permit only in-cluster service/pod ranges outside the VPN so
            # Prowlarr can reach Radarr and qBittorrent without leaking indexer
            # traffic onto the LAN.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 10.96.0.0/12,10.244.0.0/16
            - name: TZ
              value: America/Chicago
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: NORDVPN_SERVICE_USERNAME
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: NORDVPN_SERVICE_PASSWORD
          startupProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 10
            failureThreshold: 3
          # Last resort: if the tunnel is still unhealthy after ~10 minutes of
          # gluetun's own reconnects, restart the container so it starts over
          # with a freshly chosen server.
          livenessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 30
            failureThreshold: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: gluetun-state
              mountPath: /gluetun
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls155
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
          ports:
            - name: prowlarr-http
              containerPort: 9696
          startupProbe:
            tcpSocket:
              port: prowlarr-http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: prowlarr-http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: prowlarr-http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: scripts
          configMap:
            name: media-stack-scripts
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: gluetun-state
          persistentVolumeClaim:
            claimName: prowlarr-gluetun-state
