  name: seerr-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seerr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-public
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 5055
---
apiVersion: networking.k8s.io/v1
