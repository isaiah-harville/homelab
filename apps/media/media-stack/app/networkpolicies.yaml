        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-public
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8096
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seerr
      ports:
        - protocol: TCP
          port: 8096
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
