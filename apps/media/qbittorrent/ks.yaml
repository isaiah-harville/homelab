---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/media/qbittorrent/app
  prune: true
  wait: true
  targetNamespace: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
