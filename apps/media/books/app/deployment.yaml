apiVersion: apps/v1
kind: Deployment
metadata:
  name: books
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: books
  template:
    metadata:
      labels:
        app.kubernetes.io/name: books
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Writes CWA's mail server and per-user Kindle addresses into app.db
        # from Git and SOPS secrets before CWA starts (CWA has no env support
        # for them). See scripts/cwa_config.py and docs/apps/books.md.
        - name: cwa-config
          image: ghcr.io/crocodilestick/calibre-web-automated:v4.0.8 # {"$imagepolicy": "flux-system:calibre-web-automated"}
          imagePullPolicy: IfNotPresent
          command: ["/lsiopy/bin/python3", "/scripts/cwa_config.py"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: SMTP_HOST
              value: smtp.mx.cloudflare.net
            - name: SMTP_PORT
              value: "465"
            - name: SMTP_SECURITY
              value: ssl
            - name: SMTP_USERNAME
              value: api_token
            - name: SMTP_FROM
              value: books@harville.dev
            # Cloudflare rejects messages over 5 MiB including base64 overhead
            # (~4/3), so cap attachments at 3.5 MiB for a clear error in CWA.
            - name: SMTP_MAX_ATTACHMENT_BYTES
              value: "3670016"
            - name: SMTP_PASSWORD_FILE
              value: /run/secrets/books-smtp/cloudflare-smtp-token
            - name: KINDLE_RECIPIENTS_FILE
              value: /run/secrets/kindle/recipients.json
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: cwa-config
              mountPath: /config
            - name: smtp-credentials
              mountPath: /run/secrets/books-smtp
              readOnly: true
            - name: kindle-recipients
              mountPath: /run/secrets/kindle
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: calibre-web-automated
          image: ghcr.io/crocodilestick/calibre-web-automated:v4.0.8 # {"$imagepolicy": "flux-system:calibre-web-automated"}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
          ports:
            - name: cwa-http
              containerPort: 8083
          startupProbe:
            httpGet:
              path: /
              port: cwa-http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: cwa-http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: cwa-http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: cwa-config
              mountPath: /config
            - name: library
              mountPath: /calibre-library
            - name: ingest
              mountPath: /cwa-book-ingest
            - name: smtp-credentials
              mountPath: /run/secrets/books-smtp
              readOnly: true
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:v1.7.1 # {"$imagepolicy": "flux-system:shelfmark"}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
            - name: AUTH_METHOD
              value: oidc
            - name: OIDC_DISCOVERY_URL
              value: https://auth.harville.dev/application/o/books/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: books-oidc
                  key: BOOKS_OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: books-oidc
                  key: BOOKS_OIDC_CLIENT_SECRET
            - name: OIDC_GROUP_CLAIM
              value: groups
            - name: OIDC_ADMIN_GROUP
              value: authentik Admins
            - name: OIDC_USE_ADMIN_GROUP
              value: "true"
            - name: OIDC_AUTO_PROVISION
              value: "true"
            - name: DISABLE_LOCAL_AUTH
              value: "true"
            - name: OIDC_AUTO_REDIRECT
              value: "true"
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: SEARCH_MODE
              value: universal
            - name: METADATA_PROVIDER
              value: hardcover
            - name: RELEASE_SEARCH_TIMEOUT
              value: "90"
            # Anna's Archive gates search behind a DDoS-Guard challenge the
            # built-in bypasser can't solve, so the Direct Download tab only
            # times out and delays Prowlarr results. Torrents via Prowlarr only.
            - name: DIRECT_DOWNLOAD_ENABLED
              value: "false"
            - name: BOOKS_OUTPUT_MODE
              value: folder
            # One folder per Shelfmark user. CWA auto-sends a book from
            # /cwa-book-ingest/<user>/ only to the CWA user of that name.
            - name: INGEST_DIR
              value: /books/{User}
            - name: CALIBRE_WEB_URL
              value: https://calibre.int.harville.dev
            - name: PROWLARR_ENABLED
              value: "true"
            - name: PROWLARR_URL
              value: http://prowlarr.media.svc:9696
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-auth
                  key: PROWLARR_API_KEY
            # Prowlarr indexer IDs 1 (The Pirate Bay) and 4 (Knaben), the only
            # ones that return ebooks. Searching every indexer waits on the
            # movie/TV ones (LimeTorrents hangs), so cap each search at 30s.
            - name: PROWLARR_INDEXERS
              value: "1,4"
            - name: PROWLARR_INDEXER_TIMEOUT
              value: "30"
            # IRCHighway #ebooks: the largest ebook-focused source reachable
            # without an invite. Shelfmark asks its search bot, then fetches
            # the file over outbound DCC. The nick must be unique on the network.
            - name: IRC_SERVER
              value: irc.irchighway.net
            - name: IRC_PORT
              value: "6697"
            - name: IRC_USE_TLS
              value: "true"
            - name: IRC_CHANNEL
              value: ebooks
            - name: IRC_NICK
              value: harvbooks4127
            - name: IRC_SEARCH_BOT
              value: search
            - name: PROWLARR_TORRENT_CLIENT
              value: qbittorrent
            - name: QBITTORRENT_URL
              value: http://qbittorrent.media.svc:8080
            - name: QBITTORRENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: QBITTORRENT_USERNAME
            - name: QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: QBITTORRENT_PASSWORD
            - name: QBITTORRENT_CATEGORY
              value: books
            - name: QBITTORRENT_DOWNLOAD_DIR
              value: /media/downloads/complete
            - name: PROWLARR_TORRENT_ACTION
              value: change_category
            - name: PROWLARR_TORRENT_POST_IMPORT_CATEGORY
              value: imported
            - name: REQUESTS_ENABLED
              value: "false"
          ports:
            - name: shelfmark-http
              containerPort: 8084
          startupProbe:
            httpGet:
              path: /api/health
              port: shelfmark-http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: shelfmark-http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: shelfmark-http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: shelfmark-config
              mountPath: /config
            - name: ingest
              mountPath: /books
            - name: media-pool
              mountPath: /media
      volumes:
        - name: cwa-config
          persistentVolumeClaim:
            claimName: books-cwa-config
        - name: library
          persistentVolumeClaim:
            claimName: books-library
        - name: ingest
          persistentVolumeClaim:
            claimName: books-ingest
        - name: shelfmark-config
          persistentVolumeClaim:
            claimName: books-shelfmark-config
        - name: smtp-credentials
          secret:
            secretName: cloudflare-smtp
            items:
              - key: CLOUDFLARE_SMTP_TOKEN
                path: cloudflare-smtp-token
        - name: media-pool
          persistentVolumeClaim:
            claimName: media-pool
        - name: kindle-recipients
          secret:
            secretName: books-kindle-recipients
        - name: scripts
          configMap:
            name: books-scripts
