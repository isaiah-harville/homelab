---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: books-cwa-config
  labels:
    # Daily snapshots plus a weekly backup off-site (Cloudflare R2).
    recurring-job-group.longhorn.io/default: enabled
    recurring-job-group.longhorn.io/offsite: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-retain
  resources:
    requests:
      storage: 5Gi
---
