---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pigeon
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/pigeon/pigeon/app
  prune: true
  wait: true
  targetNamespace: pigeon
  sourceRef:
    kind: GitRepository
    name: flux-system
