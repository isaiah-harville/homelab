apiVersion: apps/v1
kind: Deployment
metadata:
  name: pigeon-relay
  labels:
    app: pigeon-relay
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: pigeon-relay
  template:
    metadata:
      labels:
        app: pigeon-relay
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: own-relay-state
          image: busybox:1.37.0
          command:
            - chown
            - -R
            - 65532:65532
            - /var/lib/pigeon-relay
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: relay-state
              mountPath: /var/lib/pigeon-relay
      containers:
        - name: pigeon-relay
          image: ghcr.io/isaiah-harville/pigeon/relay:v0.4.1 # {"$imagepolicy": "flux-system:pigeon-relay"}
          imagePullPolicy: IfNotPresent
          env:
            - name: PIGEON_RELAY_ADDR
              value: 0.0.0.0:8080
            - name: PIGEON_COORDINATOR_SIGNING_SEED_HEX
              valueFrom:
                secretKeyRef:
                  name: pigeon-relay-coordinator
                  key: PIGEON_COORDINATOR_SIGNING_SEED_HEX
          # APNs is optional so the relay can run before its SOPS secret exists.
          envFrom:
            - secretRef:
                name: pigeon-relay-apns
                optional: true
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: relay-state
              mountPath: /var/lib/pigeon-relay
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: relay-state
          persistentVolumeClaim:
            claimName: pigeon-relay-state
