# Operations: docs/operations/external-inference.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-router
  namespace: apps
  labels:
    app: vllm-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-router
  template:
    metadata:
      labels:
        app: vllm-router
    spec:
      containers:
        - name: vllm-router
          image: docker.io/lmcache/lmstack-router:v0.1.12 # {"$imagepolicy": "flux-system:lmstack-router"}
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8001"
            - --service-discovery
            - static
            - --static-backends
            - http://vllm.apps.svc.cluster.local:8000
            - --static-models
            - qwen2.5-3b-instruct
            - --static-model-types
            - chat
            - --routing-logic
            - roundrobin
            - --log-stats
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
