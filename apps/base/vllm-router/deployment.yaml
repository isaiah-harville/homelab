---
# Request router in front of the two vLLM backends (apps/base/vllm-wsl,
# apps/base/vllm-dgx). Replaces the old frps/frpc reverse-tunnel hack: the WSL
# backend is still only reachable at its node IP (hostNetwork, VXLAN inbound
# is broken there), but the router just hits that directly as a static
# backend — same as SSH/ansible already do — instead of tunneling through it.
# Static (not k8s) service discovery because the two backends serve different
# models on different networking modes; the router picks the backend by the
# "model" field in each request, so this also gives Open WebUI both models
# through one OpenAI-compatible endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-router
  namespace: apps
  labels:
    app: vllm-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-router
  template:
    metadata:
      labels:
        app: vllm-router
    spec:
      containers:
        - name: vllm-router
          image: lmcache/lmstack-router:v0.1.11
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8001"
            - --service-discovery
            - static
            # The router's URL validator requires a dotted hostname (or IPv4/
            # localhost) — a bare Service name like "vllm-dgx" fails validation
            # and gets silently dropped, which then crashes the router on the
            # URLs/models length-mismatch assertion. Use the fully-qualified
            # in-cluster DNS name instead.
            - --static-backends
            - http://10.1.1.20:8000,http://vllm-dgx.apps.svc.cluster.local:8000
            - --static-models
            - qwen3-8b,qwen3.6-35b
            - --static-model-types
            - chat,chat
            - --routing-logic
            - roundrobin
            - --log-stats
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
