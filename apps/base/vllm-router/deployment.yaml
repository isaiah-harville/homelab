---
# Request router in front of the vLLM backend on the WSL GPU box (harvi-desktop,
# 10.1.10.20). That box is NOT a cluster node — it runs vLLM standalone and the
# router reaches it as a static external backend (same address SSH already uses).
# Static (not k8s) service discovery: the router picks the backend by the
# "model" field, giving Open WebUI an OpenAI-compatible endpoint. Single backend
# today (the DGX box was retired); add more static-backends here to fan out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-router
  namespace: apps
  labels:
    app: vllm-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-router
  template:
    metadata:
      labels:
        app: vllm-router
    spec:
      containers:
        - name: vllm-router
          image: lmcache/lmstack-router:v0.1.11
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8001"
            - --service-discovery
            - static
            # The router's URL validator requires a dotted hostname (or IPv4/
            # localhost), so use the WSL box's LAN IP directly.
            - --static-backends
            - http://10.1.10.20:8000
            - --static-models
            - qwen3-8b
            - --static-model-types
            - chat
            - --routing-logic
            - roundrobin
            - --log-stats
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
