apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: apps
spec:
  interval: 30m
  chart:
    spec:
      chart: open-webui
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  values:
    fullnameOverride: openwebui
    ollama:
      enabled: true
    pipelines:
      enabled: false
    persistence:
      enabled: true
