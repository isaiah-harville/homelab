---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: apps
spec:
  interval: 30m
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: openwebui
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: WEBUI_URL
                  value: https://webui.harville.dev
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: ENABLE_SIGNUP
                  value: "false"
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: ENABLE_PERSISTENT_CONFIG
                  value: "false"
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: DEFAULT_USER_ROLE
                  value: user
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
                  value: Remote-Email
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: WEBUI_AUTH_SIGNOUT_REDIRECT_URL
                  value: https://auth.harville.dev/logout
              # vLLM as an OpenAI-compatible backend (in-cluster service DNS).
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: ENABLE_OPENAI_API
                  value: "true"
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: OPENAI_API_BASE_URL
                  value: http://vllm:8000/v1
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vllm-api-key
                      key: VLLM_API_KEY
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: open-webui
      version: "14.8.0"
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  values:
    fullnameOverride: openwebui
    ollama:
      enabled: true
      persistentVolume:
        enabled: true
        existingClaim: openwebui-ollama-longhorn
        size: 50Gi
        accessModes:
          - ReadWriteOnce
    pipelines:
      enabled: false
    persistence:
      enabled: true
      existingClaim: openwebui-longhorn
