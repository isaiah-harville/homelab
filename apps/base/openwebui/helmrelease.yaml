---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: apps
spec:
  interval: 30m
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: openwebui
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: WEBUI_URL
                  value: https://webui.harville.dev
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: ENABLE_SIGNUP
                  value: "false"
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: ENABLE_PERSISTENT_CONFIG
                  value: "false"
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: DEFAULT_USER_ROLE
                  value: user
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
                  value: Remote-Email
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: WEBUI_AUTH_SIGNOUT_REDIRECT_URL
                  value: https://auth.harville.dev/logout
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: open-webui
      version: "14.11.0"
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  values:
    fullnameOverride: openwebui
    # Ollama dropped — Open WebUI uses vLLM via the OpenAI API only. These are the
    # chart's native OpenAI values (NOT postRenderers env, which would duplicate
    # the chart-set env and break Helm's patch). The vllm Service points at the
    # frp tunnel to the GPU node.
    ollama:
      enabled: false
    enableOpenaiApi: true
    openaiBaseApiUrl: http://vllm:8000/v1
    openaiApiKeyExistingSecret: vllm-api-key
    openaiApiKeyExistingSecretKey: VLLM_API_KEY
    pipelines:
      enabled: false
    persistence:
      enabled: true
      existingClaim: openwebui-longhorn
