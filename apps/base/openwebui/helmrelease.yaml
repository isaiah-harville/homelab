---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: apps
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: open-webui
      version: "12.10.0"
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  values:
    fullnameOverride: openwebui
    ollama:
      enabled: true
      persistentVolume:
        enabled: true
        size: 50Gi
        accessModes:
          - ReadWriteOnce
    pipelines:
      enabled: false
    persistence:
      enabled: true
