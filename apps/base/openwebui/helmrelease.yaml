---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: apps
spec:
  interval: 30m
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: openwebui
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: WEBUI_URL
                  value: https://webui.harville.dev
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: ENABLE_SIGNUP
                  value: "false"
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: ENABLE_PERSISTENT_CONFIG
                  value: "false"
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: DEFAULT_USER_ROLE
                  value: user
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
                  value: Remote-Email
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: WEBUI_AUTH_SIGNOUT_REDIRECT_URL
                  value: https://auth.harville.dev/logout
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: open-webui
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  values:
    fullnameOverride: openwebui
    # Use the chart's native OpenAI values; injecting the same environment
    # variables with postRenderers breaks Helm's patch.
    ollama:
      enabled: false
    enableOpenaiApi: true
    openaiBaseApiUrl: http://vllm-router:8001/v1
    openaiApiKeyExistingSecret: vllm-api-key
    openaiApiKeyExistingSecretKey: VLLM_API_KEY
    pipelines:
      enabled: false
    persistence:
      enabled: true
      existingClaim: openwebui-longhorn
    extraEnvVars:
      - name: ENABLE_WEB_SEARCH
        value: "true"
      - name: WEB_SEARCH_ENGINE
        value: searxng
      - name: SEARXNG_QUERY_URL
        value: "http://searxng:8080/search?q=<query>"
      - name: WEB_SEARCH_RESULT_COUNT
        value: "5"
      - name: WEB_SEARCH_CONCURRENT_REQUESTS
        value: "5"
