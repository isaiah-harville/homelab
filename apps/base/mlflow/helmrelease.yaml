---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mlflow
  namespace: apps
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: mlflow
      version: ">=1.11.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system
  values:
    fullnameOverride: mlflow
    replicaCount: 1
    backendStore:
      databaseMigration: true
      databaseConnectionCheck: true
      postgres:
        enabled: true
        host: mlflow-postgres-rw.apps.svc.cluster.local
        port: 5432
        database: mlflow
        driver: psycopg2
      existingDatabaseSecret:
        name: mlflow-postgres
        usernameKey: username
        passwordKey: password
    artifactRoot:
      proxiedArtifactStorage: true
      s3:
        enabled: true
        bucket: mlflow
        existingSecret:
          name: mlflow-s3
          keyOfAccessKeyId: AWS_ACCESS_KEY_ID
          keyOfSecretAccessKey: AWS_SECRET_ACCESS_KEY
    extraEnvVars:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs-s3.apps.svc.cluster.local:8333
      AWS_DEFAULT_REGION: us-east-1
    oidcAuth:
      enabled: true
      discoveryUrl: https://auth.harville.dev/application/o/mlflow/.well-known/openid-configuration
      clientId: mlflow
      existingSecret:
        name: mlflow-oidc
        clientSecretKey: OIDC_CLIENT_SECRET
      providerDisplayName: Login with Authentik
      scope: openid,email,profile,groups
      groupsAttribute: groups
      groupName:
        - MLflow Users
      adminGroupName:
        - MLflow Admins
      defaultPermission: READ
      sessionCookieSecure: true
      trustedProxies:
        - 10.244.0.0/16
      database:
        postgres:
          enabled: true
          host: mlflow-postgres-rw.apps.svc.cluster.local
          port: 5432
          database: mlflow_auth
          driver: psycopg2
          existingSecret:
            name: mlflow-postgres
            usernameKey: username
            passwordKey: password
    serverAllowedHosts:
      - "*"
    corsAllowedOrigins:
      - https://mlflow.int.harville.dev
    service:
      type: ClusterIP
      port: 5000
    serviceMonitor:
      enabled: true
      namespace: apps
      useServicePort: true
      labels:
        release: kube-prometheus-stack
    # `serviceMonitor.enabled` above makes the chart pass
    # `--expose-prometheus=/mlflow/metrics`, and then mounts nothing there.
    # The container runs with a read-only root filesystem, so MLflow's
    # `os.makedirs` for that directory raises at import and the process
    # dies before it ever binds a port:
    #
    #   OSError: [Errno 30] Read-only file system: '/mlflow/metrics'
    #
    # Which is why no release of this chart has ever succeeded here - the
    # first install failed on 2026-08-02 and every upgrade since inherited
    # it, leaving pods with four thousand restarts and a HelmRelease that
    # fails the health check for the whole `apps` Kustomization.
    #
    # An emptyDir rather than relaxing readOnlyRootFilesystem: only this
    # one path needs writing, and prometheus_client's multiprocess mode
    # wants a directory that starts empty for each process group anyway,
    # which is exactly what an emptyDir gives every pod.
    extraVolumes:
      - name: prometheus-metrics
        emptyDir: {}
    extraVolumeMounts:
      - name: prometheus-metrics
        mountPath: /mlflow/metrics
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
