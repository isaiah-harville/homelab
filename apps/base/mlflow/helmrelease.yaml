---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mlflow
  namespace: apps
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: mlflow
      version: ">=1.11.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system
  values:
    fullnameOverride: mlflow
    replicaCount: 1
    backendStore:
      databaseMigration: true
      databaseConnectionCheck: true
      postgres:
        enabled: true
        host: mlflow-postgres-rw.apps.svc.cluster.local
        port: 5432
        database: mlflow
        driver: psycopg2
      existingDatabaseSecret:
        name: mlflow-postgres
        usernameKey: username
        passwordKey: password
    artifactRoot:
      proxiedArtifactStorage: true
      s3:
        enabled: true
        bucket: mlflow
        existingSecret:
          name: mlflow-s3
          keyOfAccessKeyId: AWS_ACCESS_KEY_ID
          keyOfSecretAccessKey: AWS_SECRET_ACCESS_KEY
    extraEnvVars:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs-s3.apps.svc.cluster.local:8333
      AWS_DEFAULT_REGION: us-east-1
    oidcAuth:
      enabled: true
      discoveryUrl: https://auth.harville.dev/application/o/mlflow/.well-known/openid-configuration
      clientId: mlflow
      existingSecret:
        name: mlflow-oidc
        clientSecretKey: OIDC_CLIENT_SECRET
      providerDisplayName: Login with Authentik
      scope: openid,email,profile,groups
      groupsAttribute: groups
      groupName:
        - MLflow Users
      adminGroupName:
        - MLflow Admins
      defaultPermission: READ
      sessionCookieSecure: true
      trustedProxies:
        - 10.244.0.0/16
      database:
        postgres:
          enabled: true
          host: mlflow-postgres-rw.apps.svc.cluster.local
          port: 5432
          database: mlflow_auth
          driver: psycopg2
          existingSecret:
            name: mlflow-postgres
            usernameKey: username
            passwordKey: password
    serverAllowedHosts:
      - "*"
    corsAllowedOrigins:
      - https://mlflow.int.harville.dev
    service:
      type: ClusterIP
      port: 5000
    serviceMonitor:
      enabled: true
      namespace: apps
      useServicePort: true
      labels:
        release: kube-prometheus-stack
    extraVolumes:
      - name: prometheus-metrics
        emptyDir: {}
    extraVolumeMounts:
      - name: prometheus-metrics
        mountPath: /mlflow/metrics
    # The chart's default is 4, and each one is a whole MLflow app: the
    # Flask server, the FastAPI wrapper and the OIDC auth plugin, loaded
    # per process. Four of those did not fit the limit below, which nothing
    # had noticed because the container had never started long enough to
    # allocate anything. Two is ample for a deployment with this many
    # users and halves the resident cost of serving it.
    workers: 2
    resources:
      requests:
        # Above what two workers actually settle at, not below it. A
        # request under steady-state usage is what lets the scheduler place
        # a pod somewhere it cannot live.
        cpu: 100m
        memory: 1Gi
      limits:
        # Raised from 2Gi, which OOM-killed this the moment the read-only
        # filesystem fix let it boot - the second fault of two, hidden
        # behind the first because a process that dies at import never
        # reaches the memory it needs.
        memory: 4Gi
