apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-dashboard
  namespace: apps
spec:
  interval: 30m
  chart:
    spec:
      chart: kubernetes-dashboard
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: kubernetes-dashboard
        namespace: flux-system
  values:
    fullnameOverride: kubernetes-dashboard
    metricsScraper:
      enabled: true
