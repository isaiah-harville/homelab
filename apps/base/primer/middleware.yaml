---
# The chart's own header stripping is written as nginx-ingress annotations,
# which Traefik ignores silently. This is the same rule expressed for Traefik,
# and it is the line that keeps the deployment safe: Primer trusts these
# headers absolutely, so a request that arrived carrying its own would be
# believed. Without this, anyone who can reach the ingress is any user they
# care to name, and nothing about the deployment looks wrong.
#
# In Traefik an empty customRequestHeaders value removes the header outright
# rather than forwarding it blank.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: primer-strip-identity
  namespace: apps
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
      X-Auth-Request-Groups: ""
      X-Auth-Request-Preferred-Username: ""
      X-Forwarded-User: ""
      X-Forwarded-Email: ""
      X-Forwarded-Groups: ""
