---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: primer-postgres
  namespace: apps
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
  primaryUpdateStrategy: unsupervised
  postgresql:
    synchronous:
      method: any
      number: 1
    # pgvector is mounted as a read-only ImageVolume rather than baked into a
    # custom Postgres image, so the extension upgrades independently of the
    # server. Needs CNPG >= 1.27 and PostgreSQL 18's extension_control_path.
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.6-18-trixie
  bootstrap:
    initdb:
      database: primer
      owner: primer
      # Runs inside the primer database as superuser. Primer's retrieval
      # service expects the extension to already exist; it never creates it,
      # because the application role is not a superuser.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  storage:
    storageClass: longhorn-database
    size: 20Gi
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/default: enabled
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  monitoring:
    disableDefaultQueries: false
  # Libraries, documents, passages, and every stored vector live here. The
  # objects in S3 are raw uploads only, so losing this database loses the
  # citations and the index, not just the derived data.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: primer-postgres-backup
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: primer-postgres-backup
  namespace: apps
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://backups/config/primer-postgres
    endpointURL: http://seaweedfs-s3.apps.svc.cluster.local:8333
    s3Credentials:
      accessKeyId:
        name: config-backup-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: config-backup-s3
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: primer-postgres-nightly
  namespace: apps
spec:
  # Six-field cron (seconds first). 02:00, staggered off Authentik (01:30) and
  # MLflow (01:45) so the three do not compete for the same SeaweedFS volume.
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: primer-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: primer-postgres
  namespace: apps
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: primer-postgres
  podMetricsEndpoints:
    - port: metrics
