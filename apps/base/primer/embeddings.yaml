---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primer-embeddings
  namespace: apps
  labels:
    app: primer-embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: primer-embeddings
  template:
    metadata:
      labels:
        app: primer-embeddings
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
          args:
            # The ONNX export rather than Qwen's own repo, which publishes
            # no ONNX at all. TEI prefers its ONNX Runtime backend and only
            # falls back to Candle when a repo has none - and that fallback
            # is the whole performance story here: measured on the Candle
            # path, this server embeds ~1 chunk/sec and gets no faster with
            # larger batches or more concurrent clients (8 clients take 8x
            # as long as one). The weights, tokenizer and config are the
            # same model at the same 1024 dimensions; only the runtime
            # differs, so pgvector is untouched.
            #
            # Deliberately the fp32 `onnx/model.onnx`, not one of the int8
            # or q4 variants in the same repo. Those change the vectors
            # materially, and quantization damage to retrieval quality is
            # the kind nobody notices.
            #
            # Changing the runtime does shift the vectors slightly, so this
            # is a reindex, not a hot swap.
            - --model-id
            - onnx-community/Qwen3-Embedding-0.6B-ONNX
            # Required here and not on Qwen's own repo, which ships a
            # `1_Pooling/config.json` for TEI to read; the ONNX export does
            # not, and TEI refuses to start rather than guess:
            #
            #   Error: The `--pooling` arg is not set and we could not find
            #   a pooling configuration (`1_Pooling/config.json`)
            #
            # Which is the behaviour you want, because the wrong answer
            # here is not an error. Qwen3-Embedding pools the last token
            # (`"pooling_mode_lasttoken": true` in that file upstream), and
            # mean pooling over it would return plausible vectors that
            # retrieve badly - the same silent-degradation failure the
            # pinned image version above exists to avoid.
            - --pooling
            - last-token
            - --port
            - "8080"
            - --max-batch-tokens
            - "4096"
            - --auto-truncate
            - --max-client-batch-size
            - "32"
            - --max-concurrent-requests
            - "256"
          env:
            - name: HUGGINGFACE_HUB_CACHE
              value: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              memory: 16Gi
          volumeMounts:
            - name: model-cache
              mountPath: /data
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: primer-embeddings-model-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: primer-embeddings-model-cache
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 4Gi held the Candle safetensors with room to spare. The ONNX build
      # is bigger - model.onnx_data alone is 2.09GB - and lands beside them
      # rather than replacing them, which left 2.8GB free against a ~2.1GB
      # download. 10Gi is slack enough that this is not revisited.
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: primer-embeddings
  namespace: apps
  labels:
    app: primer-embeddings
spec:
  selector:
    app: primer-embeddings
  ports:
    - name: http
      port: 8080
      targetPort: 8080
