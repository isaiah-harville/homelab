---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primer-embeddings
  namespace: apps
  labels:
    app: primer-embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: primer-embeddings
  template:
    metadata:
      labels:
        app: primer-embeddings
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
          args:
            - --model-id
            - onnx-community/Qwen3-Embedding-0.6B-ONNX
            - --pooling
            - last-token
            - --port
            - "8080"
            - --max-batch-tokens
            - "4096"
            - --auto-truncate
            - --max-client-batch-size
            - "32"
            - --max-concurrent-requests
            - "256"
          env:
            - name: HUGGINGFACE_HUB_CACHE
              value: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              memory: 16Gi
          volumeMounts:
            - name: model-cache
              mountPath: /data
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: primer-embeddings-model-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: primer-embeddings-model-cache
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 4Gi held the Candle safetensors with room to spare. The ONNX build
      # is bigger - model.onnx_data alone is 2.09GB - and lands beside them
      # rather than replacing them, which left 2.8GB free against a ~2.1GB
      # download. 10Gi is slack enough that this is not revisited.
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: primer-embeddings
  namespace: apps
  labels:
    app: primer-embeddings
spec:
  selector:
    app: primer-embeddings
  ports:
    - name: http
      port: 8080
      targetPort: 8080
