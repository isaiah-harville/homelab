---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pigeon-relay
  labels:
    app: pigeon-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pigeon-relay
  template:
    metadata:
      labels:
        app: pigeon-relay
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: pigeon-relay
          image: ghcr.io/isaiah-harville/pigeon/relay:latest
          imagePullPolicy: Always
          env:
            - name: PIGEON_RELAY_ADDR
              value: 0.0.0.0:8080
          # Opt-in APNs push wake-up config (only the official relay pushes).
          # All keys — PIGEON_APNS_TEAM_ID/KEY_ID/TOPIC/HOST and the .p8 inline as
          # PIGEON_APNS_KEY_PEM — come from the SOPS-encrypted pigeon-relay-apns
          # secret. optional:true so the relay still runs (just without push) if
          # the secret isn't present yet.
          envFrom:
            - secretRef:
                name: pigeon-relay-apns
                optional: true
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
