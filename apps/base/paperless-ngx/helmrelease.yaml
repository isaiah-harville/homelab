---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: apps
spec:
  interval: 30m
  releaseName: paperless
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: paperless
            patch: |
              - op: add
                path: /spec/template/spec/enableServiceLinks
                value: false
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: paperless-ngx
      version: "0.3.15"
      sourceRef:
        kind: HelmRepository
        name: paperless-ngx
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: paperless-values
      valuesKey: values.yaml
  values:
    fullnameOverride: paperless
    config:
      url: https://paperless.int.harville.dev
    env:
      PAPERLESS_TIME_ZONE: America/Chicago
      TZ: America/Chicago
      PAPERLESS_OCR_LANGUAGE: eng
    ingress:
      enabled: true
      className: traefik-internal
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Library
        gethomepage.dev/name: Paperless
        gethomepage.dev/description: Document archive and PDF reader
        gethomepage.dev/pod-selector: app.kubernetes.io/instance=paperless,app.kubernetes.io/name=paperless-ngx
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: paperless.int.harville.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - paperless.int.harville.dev
          secretName: harville-wildcard-shared-tls
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 50Gi
      storageClass: local-path
    postgresql:
      enabled: true
      primary:
        persistence:
          enabled: true
          size: 8Gi
          storageClass: local-path
    valkey:
      internal: true
