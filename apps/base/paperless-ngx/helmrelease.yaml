---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: apps
spec:
  interval: 30m
  releaseName: paperless
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: paperless-ngx
      version: "0.24.1"
      sourceRef:
        kind: HelmRepository
        name: paperless-ngx
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: paperless-values
      valuesKey: values.yaml
  values:
    fullnameOverride: paperless
    env:
      TZ: America/Chicago
      PAPERLESS_OCR_LANGUAGE: eng
    ingress:
      main:
        enabled: true
        ingressClassName: traefik-internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Library
          gethomepage.dev/name: Paperless
          gethomepage.dev/description: Document archive and PDF reader
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=paperless,app.kubernetes.io/name=paperless-ngx
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: paperless.int.harville.dev
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - paperless.int.harville.dev
            secretName: harville-wildcard-shared-tls
    persistence:
      data:
        enabled: true
        accessMode: ReadWriteOnce
        size: 4Gi
        storageClass: local-path
      media:
        enabled: true
        accessMode: ReadWriteOnce
        size: 50Gi
        storageClass: local-path
      consume:
        enabled: false
      export:
        enabled: false
    postgresql:
      enabled: true
      primary:
        persistence:
          enabled: true
          size: 8Gi
          storageClass: local-path
    redis:
      enabled: true
      auth:
        enabled: true
      master:
        persistence:
          enabled: false
      replica:
        replicaCount: 0
