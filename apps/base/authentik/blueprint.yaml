---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint
  namespace: apps
data:
  homelab.yaml: |
    version: 1
    metadata:
      name: Homelab
    entries:
      # Content-addressed blueprint mounts can coexist briefly during rolling
      # updates. Frequent discovery guarantees the newest revision is imported
      # immediately after all old workers have exited.
      - model: authentik_tasks_schedules.schedule
        identifiers:
          actor_name: authentik.blueprints.v1.tasks.blueprints_discovery
        attrs:
          crontab: "*/2 * * * *"
      - model: authentik_core.group
        id: open-webui-users
        identifiers:
          name: Open WebUI Users
      - model: authentik_core.group
        id: seaweedfs-admins
        identifiers:
          name: SeaweedFS Admins
      - model: authentik_core.group
        id: openvitae-admins
        identifiers:
          name: OpenVitae Admins
      - model: authentik_core.group
        id: flux-admins
        identifiers:
          name: Flux Admins
      - model: authentik_core.group
        id: longhorn-admins
        identifiers:
          name: Longhorn Admins
      - model: authentik_core.group
        id: grafana-users
        identifiers:
          name: Grafana Users
      - model: authentik_core.group
        id: headlamp-users
        identifiers:
          name: Headlamp Users
      - model: authentik_core.group
        id: books-users
        identifiers:
          name: Books Users
      - model: authentik_core.group
        id: media-users
        identifiers:
          name: Media Users
      - model: authentik_core.group
        id: harbor-users
        identifiers:
          name: Harbor Users
      - model: authentik_providers_proxy.proxyprovider
        id: webui-provider
        identifiers:
          name: Open WebUI Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://webui.harville.dev
      - model: authentik_core.application
        identifiers:
          slug: open-webui
        attrs:
          name: Open WebUI
          provider: !KeyOf webui-provider
          meta_launch_url: https://webui.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, open-webui]]
          order: 0
        attrs:
          group: !KeyOf open-webui-users
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, open-webui]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_providers_proxy.proxyprovider
        id: seaweedfs-provider
        identifiers:
          name: SeaweedFS Admin Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://seaweedfs.int.harville.dev
      - model: authentik_core.application
        identifiers:
          slug: seaweedfs-admin
        attrs:
          name: SeaweedFS Admin
          provider: !KeyOf seaweedfs-provider
          meta_launch_url: https://seaweedfs.int.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, seaweedfs-admin]]
          order: 0
        attrs:
          group: !KeyOf seaweedfs-admins
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, seaweedfs-admin]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_providers_proxy.proxyprovider
        id: openvitae-provider
        identifiers:
          name: OpenVitae Admin Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://isaiah.harville.dev
      - model: authentik_core.application
        identifiers:
          slug: openvitae-admin
        attrs:
          name: OpenVitae Admin
          provider: !KeyOf openvitae-provider
          meta_launch_url: https://isaiah.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, openvitae-admin]]
          order: 0
        attrs:
          group: !KeyOf openvitae-admins
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, openvitae-admin]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_providers_proxy.proxyprovider
        id: flux-provider
        identifiers:
          name: Flux Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://flux.int.harville.dev
      - model: authentik_core.application
        identifiers:
          slug: flux
        attrs:
          name: Flux
          provider: !KeyOf flux-provider
          meta_launch_url: https://flux.int.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, flux]]
          order: 0
        attrs:
          group: !KeyOf flux-admins
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, flux]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_providers_proxy.proxyprovider
        id: longhorn-provider
        identifiers:
          name: Longhorn Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://longhorn.int.harville.dev
      - model: authentik_core.application
        identifiers:
          slug: longhorn
        attrs:
          name: Longhorn
          provider: !KeyOf longhorn-provider
          meta_launch_url: https://longhorn.int.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, longhorn]]
          order: 0
        attrs:
          group: !KeyOf longhorn-admins
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, longhorn]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_providers_proxy.proxyprovider
        id: grafana-provider
        identifiers:
          name: Grafana Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://grafana.int.harville.dev
      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://grafana.int.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, grafana]]
          order: 0
        attrs:
          group: !KeyOf grafana-users
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, grafana]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_providers_proxy.proxyprovider
        id: calibre-web-automated-provider
        identifiers:
          name: Calibre Web Automated Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://calibre.int.harville.dev
      - model: authentik_core.application
        identifiers:
          slug: calibre-web-automated
        attrs:
          name: Calibre Web Automated
          provider: !KeyOf calibre-web-automated-provider
          meta_launch_url: https://calibre.int.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, calibre-web-automated]]
          order: 0
        attrs:
          group: !KeyOf books-users
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, calibre-web-automated]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_providers_proxy.proxyprovider
        id: qbittorrent-provider
        identifiers:
          name: qBittorrent Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://torrent.int.harville.dev
      - model: authentik_core.application
        identifiers:
          slug: qbittorrent
        attrs:
          name: qBittorrent
          provider: !KeyOf qbittorrent-provider
          meta_launch_url: https://torrent.int.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, qbittorrent]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_providers_proxy.proxyprovider
        id: prowlarr-provider
        identifiers:
          name: Prowlarr Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://prowlarr.int.harville.dev
      - model: authentik_core.application
        identifiers:
          slug: prowlarr
        attrs:
          name: Prowlarr
          provider: !KeyOf prowlarr-provider
          meta_launch_url: https://prowlarr.int.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, prowlarr]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_providers_proxy.proxyprovider
        id: radarr-provider
        identifiers:
          name: Radarr Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://radarr.int.harville.dev
      - model: authentik_core.application
        identifiers:
          slug: radarr
        attrs:
          name: Radarr
          provider: !KeyOf radarr-provider
          meta_launch_url: https://radarr.int.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, radarr]]
          order: 0
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_providers_oauth2.scopemapping
        id: groups-scope
        identifiers:
          name: Homelab groups
        attrs:
          scope_name: groups
          description: Kubernetes RBAC group membership
          expression: |
            return {"groups": [group.name for group in request.user.ak_groups.all()]}
      - model: authentik_providers_oauth2.oauth2provider
        id: shelfmark-provider
        identifiers:
          name: Shelfmark Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env [BOOKS_OIDC_CLIENT_ID, ""]
          client_secret: !Env [BOOKS_OIDC_CLIENT_SECRET, ""]
          grant_types:
            - authorization_code
            - refresh_token
          include_claims_in_id_token: true
          issuer_mode: per_provider
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf groups-scope
          redirect_uris:
            - matching_mode: strict
              url: https://books.harville.dev/api/auth/oidc/callback
              redirect_uri_type: authorization
      - model: authentik_core.application
        identifiers:
          slug: books
        attrs:
          name: Books
          provider: !KeyOf shelfmark-provider
          meta_launch_url: https://books.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, books]]
          order: 0
        attrs:
          group: !KeyOf books-users
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, books]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_providers_oauth2.oauth2provider
        id: headlamp-provider
        identifiers:
          name: Headlamp Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: headlamp
          grant_types:
            - authorization_code
            - refresh_token
          include_claims_in_id_token: true
          issuer_mode: per_provider
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf groups-scope
          redirect_uris:
            - matching_mode: strict
              url: https://headlamp.int.harville.dev/oidc-callback
              redirect_uri_type: authorization
      - model: authentik_core.application
        identifiers:
          slug: headlamp
        attrs:
          name: Headlamp
          provider: !KeyOf headlamp-provider
          meta_launch_url: https://headlamp.int.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, headlamp]]
          order: 0
        attrs:
          group: !KeyOf headlamp-users
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, headlamp]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      # Harbor authenticates natively via OIDC rather than the ForwardAuth
      # outpost, so `docker login` keeps working against the registry API.
      - model: authentik_providers_oauth2.oauth2provider
        id: harbor-provider
        identifiers:
          name: Harbor Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env [HARBOR_OIDC_CLIENT_ID, ""]
          client_secret: !Env [HARBOR_OIDC_CLIENT_SECRET, ""]
          grant_types:
            - authorization_code
            - refresh_token
          include_claims_in_id_token: true
          issuer_mode: per_provider
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            # Harbor requests offline_access so it can refresh a session without
            # bouncing the user back through the browser flow.
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
            - !KeyOf groups-scope
          redirect_uris:
            - matching_mode: strict
              url: https://harbor.harville.dev/c/oidc/callback
              redirect_uri_type: authorization
      - model: authentik_core.application
        identifiers:
          slug: harbor
        attrs:
          name: Harbor
          provider: !KeyOf harbor-provider
          meta_launch_url: https://harbor.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, harbor]]
          order: 0
        attrs:
          group: !KeyOf harbor-users
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, harbor]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      # Jellyfin clients need native username/password authentication. Authentik's
      # LDAP outpost validates those credentials while Jellyfin JIT-provisions
      # its own local user records through the LDAP Authentication plugin.
      - model: authentik_core.user
        id: jellyfin-ldap-bind-user
        identifiers:
          username: jellyfin-ldap-bind
        attrs:
          name: Jellyfin LDAP Bind
          type: service_account
          permissions:
            - authentik_providers_ldap.search_full_directory
      - model: authentik_core.token
        identifiers:
          identifier: jellyfin-ldap-bind
        attrs:
          key: !Env [AUTHENTIK_LDAP_BIND_TOKEN, ""]
          user: !KeyOf jellyfin-ldap-bind-user
          intent: app_password
          expiring: false
      - model: authentik_providers_ldap.ldapprovider
        id: jellyfin-ldap-provider
        identifiers:
          name: Jellyfin LDAP Provider
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          base_dn: dc=media,dc=harville,dc=dev
          bind_mode: cached
          search_mode: cached
      - model: authentik_core.application
        identifiers:
          slug: jellyfin-ldap
        attrs:
          name: Jellyfin
          provider: !KeyOf jellyfin-ldap-provider
          meta_launch_url: https://media.harville.dev
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, jellyfin-ldap]]
          order: 0
        attrs:
          group: !KeyOf media-users
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, jellyfin-ldap]]
          order: 1
        attrs:
          group: !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, jellyfin-ldap]]
          order: 2
        attrs:
          user: !KeyOf jellyfin-ldap-bind-user
      # Pre-create the deterministic outpost identity and managed token. The
      # Outpost model then adopts them and builds the least-privilege provider
      # permissions when its provider relation is attached.
      - model: authentik_core.user
        id: jellyfin-ldap-outpost-user
        identifiers:
          username: ak-outpost-7e1f9d0aefad4e6891aadf8261227079
        attrs:
          name: Jellyfin LDAP Outpost Service-Account
          type: service_account
      - model: authentik_core.token
        identifiers:
          identifier: ak-outpost-7e1f9d0a-efad-4e68-91aa-df8261227079-api
        attrs:
          key: !Env [AUTHENTIK_LDAP_OUTPOST_TOKEN, ""]
          user: !KeyOf jellyfin-ldap-outpost-user
          intent: api
          expiring: false
          managed: goauthentik.io/outpost/ak-outpost-7e1f9d0a-efad-4e68-91aa-df8261227079-api
      - model: authentik_outposts.outpost
        identifiers:
          uuid: 7e1f9d0a-efad-4e68-91aa-df8261227079
        attrs:
          name: Jellyfin LDAP Outpost
          type: ldap
          config:
            authentik_host: http://authentik-server.apps.svc.cluster.local
          providers:
            - !KeyOf jellyfin-ldap-provider
      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          config:
            authentik_host: https://auth.harville.dev
            authentik_host_browser: https://auth.harville.dev
          providers:
            - !KeyOf webui-provider
            - !KeyOf seaweedfs-provider
            - !KeyOf openvitae-provider
            - !KeyOf flux-provider
            - !KeyOf longhorn-provider
            - !KeyOf grafana-provider
            - !KeyOf calibre-web-automated-provider
