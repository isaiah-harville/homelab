---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seerr
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - talos-rwj-wvp
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare
          image: python:3.14-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: SEERR_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: media-auth
                  key: SEERR_OIDC_CLIENT_ID
            - name: SEERR_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: media-auth
                  key: SEERR_OIDC_CLIENT_SECRET
          command:
            - python
            - /scripts/seerr_prepare.py
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: seerr
          # Native OIDC is not in Seerr stable yet. Pin the official preview's
          # multi-architecture digest so a mutable preview tag cannot drift.
          image: ghcr.io/seerr-team/seerr@sha256:6a2a160b878b98d079c8ee6933f58997bb26d68dbcbc789c1a559bc6955db60d
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: TZ
              value: America/Chicago
            - name: PORT
              value: "5055"
            - name: CONFIG_DIRECTORY
              value: /app/config
            # These are consumed by the init container. Keeping the references
            # on the workload also makes secret rotation roll the Deployment.
            - name: SEERR_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: media-auth
                  key: SEERR_OIDC_CLIENT_ID
            - name: SEERR_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: media-auth
                  key: SEERR_OIDC_CLIENT_SECRET
          ports:
            - name: seerr-http
              containerPort: 5055
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: seerr-http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: seerr-http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: seerr-http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config
        - name: scripts
          configMap:
            name: media-stack-scripts
