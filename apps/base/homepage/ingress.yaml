---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: apps
  annotations:
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [homepage.int.harville.dev]
      secretName: harville-wildcard-shared-tls
  rules:
    - host: homepage.int.harville.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 80
