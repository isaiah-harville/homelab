apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - talos-rwj-wvp
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: bootstrap
          image: python:3.14-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: QBITTORRENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: QBITTORRENT_USERNAME
            - name: QBITTORRENT_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: QBITTORRENT_PASSWORD_HASH
          command:
            - python
            - /scripts/bootstrap.py
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-pool
              mountPath: /media
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.1
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - NET_ADMIN
                - SETUID
          env:
            - name: VPN_SERVICE_PROVIDER
              value: nordvpn
            - name: VPN_TYPE
              value: openvpn
            - name: OPENVPN_PROTOCOL
              value: udp
            - name: SERVER_COUNTRIES
              value: United States
            - name: SERVER_CATEGORIES
              value: P2P
            - name: UPDATER_PERIOD
              value: 480h
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: TZ
              value: America/Chicago
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: NORDVPN_SERVICE_USERNAME
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: NORDVPN_SERVICE_PASSWORD
          startupProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: gluetun-state
              mountPath: /gluetun
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls472 # {"$imagepolicy": "flux-system:qbittorrent"}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
          ports:
            - name: qbit-http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: qbit-http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: qbit-http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: qbit-http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-pool
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media-pool
          persistentVolumeClaim:
            claimName: media-pool
        - name: scripts
          configMap:
            name: qbittorrent-scripts
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: gluetun-state
          persistentVolumeClaim:
            claimName: qbittorrent-gluetun-state
