---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-wsl
  namespace: apps
  labels:
    app: vllm-wsl
spec:
  replicas: 1
  # Single GPU, weights on a node-local volume — never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-wsl
  template:
    metadata:
      labels:
        app: vllm-wsl
    spec:
      # No Service targets this pod (hostNetwork means the router in
      # apps/base/vllm-router reaches it directly at the node IP), but leave
      # legacy Service env injection off regardless.
      enableServiceLinks: false
      # The GPU node is a WSL2 box whose flannel VXLAN overlay can't receive
      # inbound (WSL mirrored networking doesn't deliver to the kernel VXLAN
      # handler). hostNetwork bypasses the overlay: vLLM binds the node's LAN IP
      # directly (reachable like SSH, and how apps/base/vllm-router reaches it)
      # and dnsPolicy:Default uses the node's resolver/egress instead of
      # CoreDNS, so it can pull the model from HF.
      hostNetwork: true
      dnsPolicy: Default
      # Run under the nvidia container runtime (k3s auto-creates this RuntimeClass
      # once the NVIDIA Container Toolkit is on the node).
      runtimeClassName: nvidia
      # Both GPU nodes carry gpu=true; pin to the WSL box specifically — the
      # router hardcodes this pod's node IP (10.1.10.20) as a static backend, and
      # hostNetwork below only makes sense on the WSL box (see comment above).
      # Use nodeSelector, not .spec.nodeName — nodeName bypasses the scheduler
      # entirely, which breaks WaitForFirstConsumer PVC binding (see
      # apps/base/vllm-dgx/deployment.yaml for the full explanation).
      nodeSelector:
        gpu: "true"
        kubernetes.io/hostname: harvi-desktop
      # The GPU node is tainted dedicated=gpu so general workloads stay off it
      # (and Longhorn/metallb don't run there). GPU pods opt in via this toleration.
      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu
          effect: NoSchedule
      containers:
        - name: vllm-wsl
          # CUDA 12.x on purpose — cu13/:latest had an Apr-2026 gibberish bug on Qwen3.
          image: vllm/vllm-openai:v0.22.1-cu129-ubuntu2404
          args:
            # 8B AWQ (~5 GiB) fits comfortably on the desktop-shared 12 GB card,
            # leaving room for a real context window and for the desktop/gaming to
            # use the GPU without OOM-killing inference. (14B scraped the ceiling.)
            - --model
            - Qwen/Qwen3-8B-AWQ
            - --served-model-name
            - qwen3-8b
            - --quantization
            - awq_marlin
            - --max-model-len
            - "8192"
            # GPU is shared with the Windows desktop (~1.2 GiB already used), so
            # keep the target under the free memory and leave headroom.
            - --gpu-memory-utilization
            - "0.85"
            - --kv-cache-dtype
            - fp8
            - --enable-auto-tool-choice
            - --tool-call-parser
            - hermes
            - --api-key
            - $(VLLM_API_KEY)
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
            # Cache weights on the node-local PVC instead of the container layer.
            - name: HF_HOME
              value: /models
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "1"
              memory: 4Gi
          # First start downloads ~9 GB and loads the model — give it room before
          # liveness/readiness kick in.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-wsl-models
        # vLLM needs shared memory for its worker IPC.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
