---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-wsl-models
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
  # Node-local (WaitForFirstConsumer binds on the GPU node). Avoids Longhorn's 3x
  # replication for large, re-downloadable model weights.
  storageClassName: local-path
