---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swingthoughts-alias
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: apps-swing-thoughts-redirect@kubernetescrd
spec:
  ingressClassName: traefik-public
  tls:
    - hosts: [swingthoughts.harville.dev]
  rules:
    - host: swingthoughts.harville.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swing-thoughts
                port:
                  number: 80
