---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swing-thoughts-html
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location = /.well-known/apple-app-site-association {
          default_type application/json;
          try_files $uri =404;
      }

      location /privacy-policy {
          try_files /privacy-policy.html =404;
      }

      location /import {
          try_files /index.html =404;
      }

      location /support {
          try_files /index.html =404;
      }

      location / {
        return 301 https://swingthoughtspro.com/support;
      }
    }
  apple-app-site-association: |
    {
      "applinks": {
        "details": [
          {
            "appIDs": ["PUMV3ZMP9G.com.isaiah-harville.SwingThoughts"],
            "components": [
              { "/": "/import*", "comment": "Thought import links" }
            ]
          }
        ]
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Swing Thoughts support page." />
        <title>Swing Thoughts Support</title>
        <style>
          :root {
            color-scheme: dark;
          }

          html,
          body {
            height: 100%;
            margin: 0;
          }

          body {
            display: grid;
            place-items: center;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
          }

          main {
            max-width: 42rem;
            padding: 2rem;
            text-align: center;
          }

          h1 {
            margin: 0 0 1rem;
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
          }

          p {
            margin: 0;
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            line-height: 1.6;
          }

          .note {
            margin-top: 1.25rem;
            font-size: 1rem;
            opacity: 0.72;
          }

          a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
          }
        </style>
      </head>
      <body>
        <main>
          <h1>For support, email isaiah@harville.dev</h1>
          <p class="note">Site under construction.</p>
        </main>
      </body>
    </html>
  privacy-policy.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Privacy Policy for Swing Thoughts." />
        <title>Privacy Policy for Swing Thoughts</title>
        <style>
          :root {
            color-scheme: dark;
          }

          html,
          body {
            min-height: 100%;
            margin: 0;
          }

          body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
          }

          main {
            box-sizing: border-box;
            max-width: 48rem;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
          }

          h1 {
            margin: 0 0 0.5rem;
            font-size: 2.25rem;
            line-height: 1.15;
          }

          .effective-date {
            margin: 0 0 2rem;
            opacity: 0.72;
          }

          h2 {
            margin: 2rem 0 0.75rem;
            font-size: 1.1rem;
            font-weight: 700;
          }

          p {
            margin: 0 0 1rem;
            font-size: 1rem;
            line-height: 1.65;
          }

          ul {
            margin: 0.25rem 0 1rem;
            padding-left: 1.25rem;
          }

          li {
            margin: 0.4rem 0;
            line-height: 1.55;
          }

          a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.55);
          }
        </style>
      </head>
      <body>
        <main>
          <h1>Privacy Policy for Swing Thoughts</h1>
          <p class="effective-date"><strong>Effective Date:</strong> May 8, 2026</p>

          <p>Swing Thoughts is designed to help you record, organize, and review golf swing thoughts, practice sessions, rounds, scores, notes, and related photos or videos.</p>

          <h2>Information We Collect</h2>
          <p>Swing Thoughts does not require you to create an account with us.</p>
          <p>The app may store information you choose to enter, including swing thoughts, notes, tags, club selections, practice or round details, manually entered course or location names, scores, ratings, session duration, handicap index, average score, app preferences, and media attachments such as photos, videos, and captions.</p>
          <p>If you use Apple Watch features, relevant swing thoughts, session information, dictated pending thoughts, and scorecard data may be transferred between your iPhone and Apple Watch using Apple's Watch Connectivity framework.</p>
          <p>If you contact support by email, we may receive your email address and any information you include in your message.</p>

          <h2>Photos, Videos, and Camera Access</h2>
          <p>Swing Thoughts may ask for access to your camera or photo library so you can attach photos or videos to your swing thoughts or sessions. These media files are used only for app functionality and are stored with your app data unless you export or share them.</p>

          <h2>iCloud Sync</h2>
          <p>Swing Thoughts uses Apple iCloud and CloudKit to sync your app data across your devices when iCloud is enabled. This may include your swing thoughts, sessions, scores, settings, and media attachments. Your iCloud data is handled by Apple under your Apple ID and iCloud settings.</p>

          <h2>Purchases</h2>
          <p>Swing Thoughts offers optional subscriptions through Apple In-App Purchase. Payments and billing information are processed by Apple. We do not receive or store your payment card information. The app checks your subscription entitlement through Apple's StoreKit system to unlock premium features.</p>

          <h2>Analytics, Advertising, and Tracking</h2>
          <p>Swing Thoughts does not use third-party advertising SDKs and does not sell your personal information. Based on the current app implementation, Swing Thoughts does not include third-party analytics or cross-app tracking.</p>

          <h2>How We Use Information</h2>
          <p>Your information is used to provide the app's features, including saving and organizing swing thoughts, tracking sessions and rounds, syncing data across your devices, enabling Apple Watch and widget features, supporting import/export, restoring purchases, and responding to support requests.</p>

          <h2>Sharing and Exporting</h2>
          <p>You may choose to export your Swing Thoughts data as a file or share content from the app. Exported files may include your swing thoughts, sessions, scores, notes, media captions, and media file data. You control where exported or shared information is sent.</p>

          <h2>Data Retention and Deletion</h2>
          <p>Your app data remains on your device and, if iCloud sync is enabled, in your iCloud account until you delete it. You can delete individual content in the app, delete the app from your device, or manage iCloud data through Apple's iCloud settings. Support emails may be retained as needed to respond to your request and maintain support records.</p>

          <h2>Security</h2>
          <p>Swing Thoughts relies on Apple platform security, local device protections, and iCloud security for stored and synced data. No method of storage or transmission is perfectly secure, but we design the app to limit data use to the features you choose to use.</p>

          <h2>Children's Privacy</h2>
          <p>Swing Thoughts is suitable for a general audience. The app does not require users to create an account, does not include social networking features, and does not knowingly collect personal information from children for advertising or tracking. Any information entered into the app is used to provide the app's features, such as saving swing thoughts, sessions, scores, and media attachments.</p>

          <h2>Changes to This Policy</h2>
          <p>We may update this Privacy Policy from time to time. If we make material changes, we will update the effective date and, where appropriate, provide notice in the app or on our website.</p>

          <h2>Contact</h2>
          <p>If you have questions about this Privacy Policy or your data, contact: <a href="mailto:isaiah@harville.dev">isaiah@harville.dev</a></p>

          <h2>Sources Consulted</h2>
          <ul>
            <li><a href="https://developer.apple.com/app-store/app-privacy-details/">Apple App Privacy Details</a></li>
            <li><a href="https://developer.apple.com/documentation/cloudkit">Apple CloudKit documentation</a></li>
            <li><a href="https://developer.apple.com/documentation/storekit/in-app-purchase/">Apple In-App Purchase documentation</a></li>
          </ul>
        </main>
      </body>
    </html>
