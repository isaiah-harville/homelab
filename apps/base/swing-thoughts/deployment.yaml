---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swing-thoughts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swing-thoughts
  template:
    metadata:
      labels:
        app: swing-thoughts
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: html
              mountPath: /usr/share/nginx/html/privacy-policy.html
              subPath: privacy-policy.html
              readOnly: true
            - name: aasa
              mountPath: /usr/share/nginx/html/.well-known
              readOnly: true
            - name: html
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: swing-thoughts-html
        - name: aasa
          configMap:
            name: swing-thoughts-html
            items:
              - key: apple-app-site-association
                path: apple-app-site-association
