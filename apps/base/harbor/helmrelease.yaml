---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: apps
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: harbor
      version: ">=1.19.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  values:
    externalURL: https://harbor.harville.dev
    # Recreate releases the ReadWriteOnce volumes before starting replacement pods.
    updateStrategy:
      type: Recreate
    # `docker login` cannot traverse Authentik forward auth.
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: harville-wildcard-shared-tls
      ingress:
        hosts:
          core: harbor.harville.dev
        className: traefik-public
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/name: Harbor
          gethomepage.dev/description: Container registry
          gethomepage.dev/href: https://harbor.harville.dev
          gethomepage.dev/siteMonitor: https://harbor.harville.dev
    # The admin password comes from SOPS; the chart manages its other secrets.
    existingSecretAdminPassword: harbor-secrets
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    core:
      extraEnvVars:
        - name: CONFIG_OVERWRITE_JSON
          valueFrom:
            secretKeyRef:
              name: harbor-oidc
              key: CONFIG_OVERWRITE_JSON
    database:
      type: internal
    redis:
      type: internal
    trivy:
      enabled: true
    metrics:
      enabled: false
    # No cluster-wide default StorageClass is set.
    persistence:
      enabled: true
      imageChartStorage:
        type: filesystem
      persistentVolumeClaim:
        registry:
          storageClass: longhorn
          size: 50Gi
        jobservice:
          jobLog:
            storageClass: longhorn
            size: 1Gi
        database:
          storageClass: longhorn
          size: 5Gi
        redis:
          storageClass: longhorn
          size: 1Gi
        trivy:
          storageClass: longhorn
          size: 5Gi
