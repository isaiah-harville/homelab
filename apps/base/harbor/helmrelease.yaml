---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: apps
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: harbor
      version: "1.19.1"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  values:
    externalURL: https://harbor.harville.dev
    # registry/jobservice use ReadWriteOnce Longhorn volumes; the default
    # RollingUpdate starts the new pod before releasing the old one's volume,
    # which deadlocks on Multi-Attach and times out every upgrade. Recreate kills
    # the old pod first so the RWO volume frees up.
    updateStrategy:
      type: Recreate
    # Harbor ships its own auth, and `docker login` can't traverse Authelia
    # forwardauth — so this is exposed publicly with no forwardauth middleware.
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: harville-wildcard-shared-tls
      ingress:
        hosts:
          core: harbor.harville.dev
        className: traefik-public
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/name: Harbor
          gethomepage.dev/description: Container registry
          gethomepage.dev/href: https://harbor.harville.dev
          gethomepage.dev/siteMonitor: https://harbor.harville.dev
    # Admin password from SOPS; all other internal secrets are auto-generated
    # by the chart and preserved across upgrades.
    existingSecretAdminPassword: harbor-secrets
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    # Bundled Postgres + Redis (goharbor images, not Bitnami).
    database:
      type: internal
    redis:
      type: internal
    trivy:
      enabled: true
    metrics:
      enabled: false
    # Image layers + chart state on Longhorn (default StorageClass is not set
    # cluster-wide, so every PVC must name longhorn explicitly).
    persistence:
      enabled: true
      imageChartStorage:
        type: filesystem
      persistentVolumeClaim:
        registry:
          storageClass: longhorn
          size: 50Gi
        jobservice:
          jobLog:
            storageClass: longhorn
            size: 1Gi
        database:
          storageClass: longhorn
          size: 5Gi
        redis:
          storageClass: longhorn
          size: 1Gi
        trivy:
          storageClass: longhorn
          size: 5Gi
