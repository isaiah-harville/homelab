---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-s3
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Storage
    gethomepage.dev/name: SeaweedFS S3
    gethomepage.dev/description: S3-compatible object storage
    gethomepage.dev/pod-selector: app.kubernetes.io/component=s3
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [s3.int.harville.dev]
  rules:
    - host: s3.int.harville.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seaweedfs-s3
                port:
                  number: 8333
