---
# Retention policy: docs/operations/backups.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seaweedfs-backup-prune
  namespace: apps
spec:
  schedule: "0 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mc-prune
              image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: MC_CONFIG_DIR
                  value: /tmp/.mc
                - name: ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: omni-backup-s3-creds
                      key: accessKey
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: omni-backup-s3-creds
                      key: secretKey
                - name: MC_HOST_backup
                  value: http://$(ACCESS_KEY):$(SECRET_KEY)@seaweedfs-s3.apps.svc.cluster.local:8333
              command:
                - sh
                - -c
                - |
                  set -eu
                  mc rm --recursive --force --older-than 76h backup/backups/
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
