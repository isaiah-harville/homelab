---
# Retention policy: docs/operations/backups.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seaweedfs-backup-prune
  namespace: apps
spec:
  schedule: "0 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: mc-prune
              image: minio/mc:latest
              env:
                - name: ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: omni-backup-s3-creds
                      key: accessKey
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: omni-backup-s3-creds
                      key: secretKey
                - name: MC_HOST_backup
                  value: http://$(ACCESS_KEY):$(SECRET_KEY)@seaweedfs-s3.apps.svc.cluster.local:8333
              command:
                - sh
                - -c
                - |
                  set -eu
                  mc rm --recursive --force --older-than 76h backup/backups/
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
