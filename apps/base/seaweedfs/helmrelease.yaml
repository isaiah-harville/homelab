---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: apps
spec:
  interval: 30m
  # Flux defaults this to 5 minutes, and every 4.45.0 upgrade has failed on
  # it: revisions 16 and 18 both timed out with all five workloads still
  # 'InProgress', then rolled back cleanly to 4.43.0. Nothing was broken -
  # the rendered diff between the two versions is an image bump plus one
  # new filer flag - there was simply never enough time. Five workloads
  # pull a new image and four of them are StatefulSets rolling one pod at a
  # time, each detaching and reattaching a Longhorn volume.
  #
  # The rollback is what made this look chronic rather than slow: it
  # restored 4.43.0 every time, so the next reconcile found the same
  # upgrade to do and the same five minutes to do it in.
  timeout: 20m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: seaweedfs
      version: ">=4.40.0 <5.0.0"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
  values:
    master:
      replicas: 1
      data:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: longhorn
      logs:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: longhorn
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    volume:
      replicas: 1
      dataDirs:
        - name: data1
          type: persistentVolumeClaim
          size: 50Gi
          storageClass: longhorn
          maxVolumes: 0
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    filer:
      replicas: 1
      data:
        type: persistentVolumeClaim
        size: 8Gi
        storageClass: longhorn
      logs:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: longhorn
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    s3:
      enabled: true
      replicas: 1
      port: 8333
      existingConfigSecret: seaweedfs-s3-config
      logs:
        type: emptyDir
      createBuckets:
        - name: general
        - name: backups
        - name: mlflow
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    admin:
      enabled: true
      replicas: 1
      data:
        type: persistentVolumeClaim
        size: 2Gi
        storageClass: longhorn
      logs:
        type: emptyDir
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
