---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-dgx-models
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 250Gi
  # Node-local (WaitForFirstConsumer binds on the DGX Spark). Avoids Longhorn's
  # 3x replication for large, re-downloadable model weights.
  storageClassName: local-path
