---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-ministral-3b-reasoning
  namespace: apps
  labels:
    app: llama-ministral-3b-reasoning
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-ministral-3b-reasoning
  template:
    metadata:
      labels:
        app: llama-ministral-3b-reasoning
    spec:
      enableServiceLinks: false
      nodeSelector:
        nvidia.com/gpu.product: Quadro-T1000
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - -hf
            - unsloth/Ministral-3-3B-Reasoning-2512-GGUF:Q4_K_M
            - --no-mmproj
            - --alias
            - ministral-3-3b-reasoning
            # "deepseek" names the response shape rather than a model family:
            # it is the DeepSeek API's convention for carrying reasoning in
            # its own field, and every value other than "none" extracts. It
            # is stated rather than left to the "auto" default because that
            # default has changed across llama.cpp releases and this image
            # tag is a rolling one - what a deployment relies on should not
            # depend on the day its node last pulled.
            - --reasoning-format
            - deepseek
            - --jinja
            - -ngl
            - "all"
            - -c
            - "16384"
            - -ctk
            - q8_0
            - -ctv
            - q8_0
            - -np
            - "1"
            - --metrics
          env:
            - name: LLAMA_CACHE
              value: /models
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              nvidia.com/gpu: 1
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-ministral-3b-reasoning-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-ministral-3b-reasoning-models
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: llama-ministral-3b-reasoning
  namespace: apps
  labels:
    app: llama-ministral-3b-reasoning
spec:
  selector:
    app: llama-ministral-3b-reasoning
  ports:
    - name: http
      port: 8080
      targetPort: 8080
