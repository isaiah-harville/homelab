---
# Ministral 3 3B Reasoning (2512), on the Quadro T1000.
#
# The same base model post-trained to think before answering, which is worth
# a second card for the questions where the first answer is usually wrong -
# maths, code, anything multi-step.
#
# Its reasoning is delimited by [THINK] ... [/THINK], which is Mistral's
# syntax and not the <think> tags most reasoning models use. That matters
# more than it looks: a client that strips <think> - Primer included - sees
# nothing to strip here, so unless the server separates the thinking itself
# it arrives as part of the answer, or not at all. The flags below are what
# make the server do the separating.
#
# This is the second of the cluster's two GPUs, and there is no third: the
# device plugin hands out whole cards, so this deployment and the instruct
# one above are the entire GPU budget. vLLM used to hold this card and is now
# scaled to zero, which is what freed it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-ministral-3b-reasoning
  namespace: apps
  labels:
    app: llama-ministral-3b-reasoning
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-ministral-3b-reasoning
  template:
    metadata:
      labels:
        app: llama-ministral-3b-reasoning
    spec:
      enableServiceLinks: false
      # Pinned to the T1000 by the card rather than the node name. Note this
      # is Turing (SM75) - old enough that runtimes needing SM89 features
      # refuse to start on it, which is a large part of why llama.cpp is
      # what runs here.
      nodeSelector:
        nvidia.com/gpu.product: Quadro-T1000
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - -hf
            - unsloth/Ministral-3-3B-Reasoning-2512-GGUF:Q4_K_M
            # Vision weights this deployment never uses; see the instruct
            # deployment for the reasoning.
            - --no-mmproj
            - --alias
            - ministral-3-3b-reasoning
            # Hand the thinking over already separated, in reasoning_content
            # beside the content, which is the field Primer reads.
            #
            # "deepseek" names the response shape rather than a model family:
            # it is the DeepSeek API's convention for carrying reasoning in
            # its own field, and every value other than "none" extracts. It
            # is stated rather than left to the "auto" default because that
            # default has changed across llama.cpp releases and this image
            # tag is a rolling one - what a deployment relies on should not
            # depend on the day its node last pulled.
            - --reasoning-format
            - deepseek
            # Extraction is driven by the model's own chat template, which is
            # where [THINK] is defined. Jinja is the current default, and is
            # named here for the same reason as the line above.
            - --jinja
            - -ngl
            - "all"
            - -c
            - "16384"
            - -ctk
            - q8_0
            - -ctv
            - q8_0
            # One slot, unlike the instruct model. A reasoning model spends a
            # long stretch of tokens thinking before the answer starts, so
            # the whole context is better given to one request than halved
            # between two that both then run out of room mid-thought.
            - -np
            - "1"
            - --metrics
          env:
            - name: LLAMA_CACHE
              value: /models
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              nvidia.com/gpu: 1
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-ministral-3b-reasoning-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-ministral-3b-reasoning-models
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: llama-ministral-3b-reasoning
  namespace: apps
  labels:
    app: llama-ministral-3b-reasoning
spec:
  selector:
    app: llama-ministral-3b-reasoning
  ports:
    - name: http
      port: 8080
      targetPort: 8080
