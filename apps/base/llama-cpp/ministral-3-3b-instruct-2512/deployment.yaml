---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-ministral-3b-instruct
  namespace: apps
  labels:
    app: llama-ministral-3b-instruct
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-ministral-3b-instruct
  template:
    metadata:
      labels:
        app: llama-ministral-3b-instruct
    spec:
      # Kubernetes injects a Docker-link environment variable per Service in
      # the namespace, and llama-server reads a great many LLAMA_* variables
      # as its own configuration. Off for the same reason vLLM has it off:
      # the next name collision would be found at 3am rather than here.
      enableServiceLinks: false
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-RTX-A2000-Laptop-GPU
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - -hf
            - unsloth/Ministral-3-3B-Instruct-2512-GGUF:Q4_K_M
            - --no-mmproj
            - --alias
            - ministral-3-3b-instruct
            - -ngl
            - "all"
            - -c
            - "16384"
            - -ctk
            - q8_0
            - -ctv
            - q8_0
            - -np
            - "2"
            - --metrics
          env:
            - name: LLAMA_CACHE
              value: /models
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              nvidia.com/gpu: 1
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-ministral-3b-instruct-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-ministral-3b-instruct-models
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: llama-ministral-3b-instruct
  namespace: apps
  labels:
    app: llama-ministral-3b-instruct
spec:
  selector:
    app: llama-ministral-3b-instruct
  ports:
    - name: http
      port: 8080
      targetPort: 8080
