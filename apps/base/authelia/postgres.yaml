---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authelia-postgres
  namespace: apps
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
  priorityClassName: system-cluster-critical
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: authelia
      owner: authelia
      secret:
        name: authelia-postgres
  storage:
    storageClass: longhorn-database
    size: 5Gi
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/default: enabled
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  postgresql:
    synchronous:
      method: any
      number: 1
  monitoring:
    disableDefaultQueries: false
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authelia-postgres
  namespace: apps
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: authelia-postgres
  podMetricsEndpoints:
    - port: metrics
