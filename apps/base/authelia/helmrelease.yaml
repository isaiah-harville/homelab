---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: apps
spec:
  interval: 30m
  releaseName: authelia
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: authelia
      version: ">=0.11.0 <0.12.0"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
  values:
    nameOverride: authelia
    pod:
      kind: StatefulSet
      replicas: 1
      priorityClassName: system-cluster-critical
      # SQLite requires a single writer. Reserve enough capacity for reliable
      # scheduling but leave memory uncapped for password-hash verification.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
    ingress:
      enabled: false
    persistence:
      enabled: true
      existingClaim: authelia-longhorn
    configMap:
      identity_validation:
        reset_password:
          secret:
            secret_name: authelia-core
            path: identity-validation.reset-password.secret
      key: configuration.yaml
      existingConfigMap: authelia-config
      filters:
        disabled: false
      session:
        encryption_key:
          secret_name: authelia-core
          path: session.encryption.key
      storage:
        encryption_key:
          secret_name: authelia-core
          path: storage.encryption.key
    secret:
      mountPath: /secrets
      additionalSecrets:
        authelia-core: {}
        authelia-extras: {}
        authelia-oidc-rsa: {}
        authelia-secrets: {}
        authelia-users-database: {}
