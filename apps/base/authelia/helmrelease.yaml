---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: apps
spec:
  interval: 30m
  releaseName: authelia
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: authelia
      version: ">=0.11.0 <0.12.0"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
  values:
    nameOverride: authelia
    pod:
      kind: StatefulSet
      replicas: 1
      priorityClassName: system-cluster-critical
      # The external database removes SQLite's storage single point of failure.
      # Keep one replica until Redis Sentinel and a network notifier make the
      # remaining stateful providers safe for active-active operation.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
      initContainers:
        - name: migrate-sqlite-to-postgres
          image: ghcr.io/authelia/authelia:4.39.20
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: authelia
              mountPath: /config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authelia-postgres
                  key: password
            - name: STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: authelia-core
                  key: storage.encryption.key
          command:
            - /bin/sh
            - -ec
            - |
              marker=/config/.postgres-migration-v1
              if [ -f "$marker" ]; then
                exit 0
              fi

              attempts=0
              until authelia storage migrate up \
                --encryption-key "$STORAGE_ENCRYPTION_KEY" \
                --postgres.address tcp://authelia-postgres-rw.apps.svc.cluster.local:5432 \
                --postgres.database authelia \
                --postgres.username authelia \
                --postgres.password "$POSTGRES_PASSWORD"; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 180 ]; then
                  exit 1
                fi
                sleep 5
              done

              for dataset in identifiers totp webauthn; do
                export_file="/tmp/$dataset.yml"
                export_log="/tmp/$dataset-export.log"
                if authelia storage user "$dataset" export --file "$export_file" \
                  --encryption-key "$STORAGE_ENCRYPTION_KEY" \
                  --sqlite.path /config/db.sqlite3 >"$export_log" 2>&1; then
                  authelia storage user "$dataset" import "$export_file" \
                    --encryption-key "$STORAGE_ENCRYPTION_KEY" \
                    --postgres.address tcp://authelia-postgres-rw.apps.svc.cluster.local:5432 \
                    --postgres.database authelia \
                    --postgres.username authelia \
                    --postgres.password "$POSTGRES_PASSWORD"
                elif grep -q "no data to export" "$export_log"; then
                  echo "No $dataset records to migrate"
                else
                  cat "$export_log"
                  exit 1
                fi
              done
              touch "$marker"
    ingress:
      enabled: false
    persistence:
      enabled: true
      existingClaim: authelia-longhorn
    configMap:
      identity_validation:
        reset_password:
          secret:
            secret_name: authelia-core
            path: identity-validation.reset-password.secret
      key: configuration.yaml
      existingConfigMap: authelia-config
      filters:
        disabled: false
      session:
        encryption_key:
          secret_name: authelia-core
          path: session.encryption.key
      storage:
        encryption_key:
          secret_name: authelia-core
          path: storage.encryption.key
    secret:
      mountPath: /secrets
      additionalSecrets:
        authelia-core: {}
        authelia-extras: {}
        authelia-oidc-rsa: {}
        authelia-secrets: {}
        authelia-users-database: {}
        authelia-postgres: {}
        authelia-postgres-ca: {}
