---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: apps
spec:
  interval: 30m
  releaseName: authelia
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: authelia
      version: "0.10.49"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
  values:
    nameOverride: authelia
    pod:
      kind: StatefulSet
      replicas: 1
    ingress:
      enabled: false
    persistence:
      enabled: true
      existingClaim: authelia
    configMap:
      key: configuration.yaml
      existingConfigMap: authelia-config
      filters:
        disabled: false
    secret:
      mountPath: /secrets
      additionalSecrets:
        authelia-oidc-rsa: {}
        authelia-secrets: {}
        authelia-users-database: {}
