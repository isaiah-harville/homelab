---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Security
    gethomepage.dev/name: Authelia
    gethomepage.dev/description: Shared sign-in portal
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=authelia,app.kubernetes.io/name=authelia
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik-public
  tls:
    - hosts: [auth.harville.dev]
      secretName: harville-wildcard-shared-tls
  rules:
    - host: auth.harville.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia
                port:
                  number: 80
