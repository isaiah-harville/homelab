---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odysseus
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/name: Odysseus
    gethomepage.dev/description: Self-hosted AI workspace
    gethomepage.dev/pod-selector: app=odysseus
    traefik.ingress.kubernetes.io/router.middlewares: apps-authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik-public
  tls:
    - hosts: [odysseus.harville.dev]
  rules:
    - host: odysseus.harville.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odysseus
                port:
                  number: 80
