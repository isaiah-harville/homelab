---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odysseus-searxng
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odysseus-searxng
  template:
    metadata:
      labels:
        app: odysseus-searxng
    spec:
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:latest
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: "http://localhost:8080/"
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
      volumes:
        - name: settings
          secret:
            secretName: odysseus-searxng-settings
