---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odysseus
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odysseus
  template:
    metadata:
      labels:
        app: odysseus
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1000
      containers:
        - name: odysseus
          image: ghcr.io/isaiah-harville/odysseus:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7000
          envFrom:
            - configMapRef:
                name: odysseus-config
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /
              port: 7000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: odysseus-data
        - name: logs
          emptyDir: {}
