server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
  }

  location /verse/ {
    return 302 https://apps.apple.com/us/app/lucerna-bible-study-tools/id6785046767;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
