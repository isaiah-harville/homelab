<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lucerna Support</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --fg: #17202a;
        --muted: #5f6b7a;
        --accent: #b45309;
        --panel: #ffffff;
        --border: #d8dee8;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101418;
          --fg: #f2f5f8;
          --muted: #a9b2bd;
          --accent: #fbbf24;
          --panel: #171d23;
          --border: #2d3640;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(100% - 32px, 680px);
        padding: 48px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 1.08;
        letter-spacing: 0;
      }

      p {
        max-width: 56ch;
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1.125rem;
      }

      a {
        color: var(--accent);
        font-weight: 700;
        text-decoration-thickness: 0.1em;
        text-underline-offset: 0.18em;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/">Lucerna</a>
      <h1>Support</h1>
      <p>For Lucerna support, email <a href="mailto:isaiah@harville.dev">isaiah@harville.dev</a>.</p>
    </main>
  </body>
</html>
