---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/name: vLLM
    gethomepage.dev/description: Qwen3-8B OpenAI-compatible inference
    gethomepage.dev/pod-selector: app=vllm
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts: [vllm.int.harville.dev]
  rules:
    - host: vllm.int.harville.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vllm
                port:
                  number: 8000
