---
# The vLLM pod runs on the WSL node and can't be reached directly (WSL inbound is
# broken), so this Service points at the frps tunnel server instead. Open WebUI
# and the ingress keep using http://vllm:8000 — frps forwards over the tunnel to
# the real vLLM on the GPU node.
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: apps
  labels:
    app: vllm
spec:
  selector:
    app: frps
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# frpc on the WSL node dials in here. NodePort so the WSL node can reach it on a
# normal node's LAN IP (it can't reach cluster ClusterIPs over the overlay).
apiVersion: v1
kind: Service
metadata:
  name: frps-control
  namespace: apps
  labels:
    app: frps
spec:
  type: NodePort
  selector:
    app: frps
  ports:
    - name: control
      port: 7000
      targetPort: 7000
      nodePort: 30700
