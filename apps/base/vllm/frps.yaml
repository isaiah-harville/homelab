---
# Reverse-tunnel server. Runs on a normal node (the dedicated=gpu taint keeps it
# off the WSL node). frpc on the WSL node dials OUT to this (WSL inbound is
# broken, outbound works), and the cluster reaches vLLM via the proxy port 8000.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frps-config
  namespace: apps
data:
  frps.toml: |
    bindPort = 7000
    auth.method = "token"
    auth.token = "{{ .Envs.FRP_TOKEN }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frps
  namespace: apps
  labels:
    app: frps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frps
  template:
    metadata:
      labels:
        app: frps
    spec:
      enableServiceLinks: false
      containers:
        - name: frps
          image: snowdreamtech/frps:0.61.1
          env:
            - name: FRP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: frp-token
                  key: FRP_TOKEN
          ports:
            - name: control
              containerPort: 7000
            - name: vllm
              containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /etc/frp/frps.toml
              subPath: frps.toml
      volumes:
        - name: config
          configMap:
            name: frps-config
