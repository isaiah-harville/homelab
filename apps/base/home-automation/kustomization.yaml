---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - mosquitto.yaml
  - zigbee2mqtt.yaml
  - home-assistant.yaml
  - matter-server.yaml
  - otbr.yaml
  - monitoring.yaml
  - ingresses.yaml
# Home Assistant and its radios are single-writer, so HA here means fast
# failover rather than extra replicas: spread the stack so one node takes
# out as little of it as possible, and leave a dead node after 60s instead
# of the default 5 minutes.
labels:
  - pairs:
      app.kubernetes.io/part-of: home-automation
    includeSelectors: false
    includeTemplates: true
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: _
      spec:
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: home-automation
            tolerations:
              - key: node.kubernetes.io/not-ready
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 60
              - key: node.kubernetes.io/unreachable
                operator: Exists
                effect: NoExecute
                tolerationSeconds: 60
