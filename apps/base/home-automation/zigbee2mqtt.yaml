---
# Zigbee2MQTT's own configuration.yaml lives on the PVC (it rewrites the file at
# runtime — notably the generated network key, which must survive restarts or
# every paired device drops off). Anything this repo wants to own is set through
# ZIGBEE2MQTT_CONFIG_* environment overrides instead of templating that file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-adapter
  namespace: apps
data:
  # Radio 2 / CC2674P10 is reserved for Zigbee. Replace port 0 with the
  # endpoint shown by the configured MR3U; never point this at Radio 1.
  serial_port: tcp://slzb-mr3u.home.arpa:0
  serial_adapter: zstack
  serial_baudrate: "115200"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: apps
  labels:
    app: zigbee2mqtt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      enableServiceLinks: false
      initContainers:
        - name: validate-radio-config
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              case "${SERIAL_PORT}" in
                tcp://*:0)
                  echo "Set zigbee2mqtt-adapter serial_port to the MR3U CC2674P10 Zigbee endpoint" >&2
                  exit 1
                  ;;
                tcp://*:*) ;;
                *)
                  echo "serial_port must be a tcp:// URL" >&2
                  exit 1
                  ;;
              esac
          env:
            - name: SERIAL_PORT
              valueFrom:
                configMapKeyRef:
                  name: zigbee2mqtt-adapter
                  key: serial_port
      containers:
        - name: zigbee2mqtt
          image: koenkk/zigbee2mqtt:2.13.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: America/Chicago
            - name: ZIGBEE2MQTT_DATA
              value: /app/data
            - name: ZIGBEE2MQTT_CONFIG_MQTT_SERVER
              value: mqtt://mosquitto.apps.svc.cluster.local:1883
            - name: ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC
              value: zigbee2mqtt
            - name: ZIGBEE2MQTT_CONFIG_MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: mosquitto-clients
                  key: ZIGBEE2MQTT_MQTT_USER
            - name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-clients
                  key: ZIGBEE2MQTT_MQTT_PASSWORD
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_PORT
              valueFrom:
                configMapKeyRef:
                  name: zigbee2mqtt-adapter
                  key: serial_port
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER
              valueFrom:
                configMapKeyRef:
                  name: zigbee2mqtt-adapter
                  key: serial_adapter
            - name: ZIGBEE2MQTT_CONFIG_SERIAL_BAUDRATE
              valueFrom:
                configMapKeyRef:
                  name: zigbee2mqtt-adapter
                  key: serial_baudrate
            # Publishes MQTT discovery messages so paired devices appear in
            # Home Assistant without per-device YAML.
            - name: ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED
              value: "true"
            - name: ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED
              value: "true"
            - name: ZIGBEE2MQTT_CONFIG_FRONTEND_PORT
              value: "8080"
            - name: ZIGBEE2MQTT_CONFIG_FRONTEND_URL
              value: https://zigbee2mqtt.int.harville.dev
            - name: ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_LEVEL
              value: info
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
---
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
  namespace: apps
spec:
  selector:
    app: zigbee2mqtt
  ports:
    - name: http
      port: 8080
      targetPort: http
