---
# Git-owned Lovelace dashboards, mounted read-only at /config/dashboards.
#
# Home Assistant's normal "Edit dashboard" button writes to /config/.storage,
# which Flux cannot track and would fight. So the default Overview stays
# UI-editable and untracked, and anything that should live in Git goes here as
# a YAML-mode dashboard. YAML dashboards render read-only in the UI: the edit
# pencil is absent by design, and this file is the only way to change them.
#
# After editing, Flux updates the ConfigMap, the kubelet syncs the file into
# the pod within a minute, and the new layout appears on a browser reload.
# Home Assistant does not need a restart for YAML dashboard changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-dashboards
  namespace: apps
data:
  control.yaml: |
    # "Control" in the sidebar. Built for everyday household use: big obvious
    # controls, no administrative detail.
    #
    # The Areas strategy generates this view from Home Assistant's own area
    # registry, so it is populated by assigning devices to areas in
    # Settings > Areas rather than by editing entity IDs here. That is what
    # makes it useful before anything is paired and what lets it grow when
    # lights, plugs, and locks are added later, without a dashboard rewrite.
    #
    # To assign a device to an area: Settings > Devices & services > the
    # device > the pencil > Area. It appears here on the next page load.
    title: Control
    views:
      - title: Home
        path: home
        icon: mdi:home
        strategy:
          type: areas

      # Everything in the house, grouped by domain, generated by Home
      # Assistant. Useful as the fallback when something is not yet assigned
      # to an area and so has not appeared on the Home view.
      - title: All devices
        path: all
        icon: mdi:format-list-bulleted
        strategy:
          type: original-states

    # ---------------------------------------------------------------------
    # Adding a curated view
    # ---------------------------------------------------------------------
    # Once devices have actually joined, a hand-built view can be added above.
    # Entity IDs are only knowable after pairing, so none are committed here;
    # find the real ID under Settings > Devices & services > Entities, or in
    # Developer tools > States, and paste it in. With the friendly names from
    # docs/apps/home-automation.md, a water view looks like this:
    #
    #   - title: Water
    #     path: water
    #     icon: mdi:water-alert
    #     type: sections
    #     sections:
    #       - type: grid
    #         cards:
    #           - type: heading
    #             heading: Leak sensors
    #           - type: entities
    #             entities:
    #               - binary_sensor.leak_washing_machine_water_leak
    #               - binary_sensor.leak_water_heater_water_leak
    #               - binary_sensor.leak_dishwasher_water_leak
    #               - binary_sensor.leak_refrigerator_water_leak
    #
    # For one-touch household shortcuts, add script or scene buttons. Scripts
    # are edited in the UI (Settings > Automations & scenes > Scripts) and
    # stored on the PVC, so only the button belongs in Git:
    #
    #           - type: button
    #             name: Cool the house
    #             icon: mdi:snowflake
    #             tap_action:
    #               action: perform-action
    #               perform_action: script.turn_on
    #               target:
    #                 entity_id: script.cool_the_house
