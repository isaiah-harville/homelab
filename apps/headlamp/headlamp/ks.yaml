---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/headlamp/headlamp/app
  prune: true
  wait: true
  targetNamespace: headlamp
  sourceRef:
    kind: GitRepository
    name: flux-system
