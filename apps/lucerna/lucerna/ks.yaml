---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lucerna
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/lucerna/lucerna/app
  prune: true
  wait: true
  targetNamespace: lucerna
  sourceRef:
    kind: GitRepository
    name: flux-system
