---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: excalidraw
  labels:
    app: excalidraw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: excalidraw
  template:
    metadata:
      labels:
        app: excalidraw
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1001
      initContainers:
        # One-time move off the image's default dev.db: write a compacted copy
        # to excalidash.db while the old pod is stopped. dev.db stays as the
        # rollback copy. Remove once excalidash.db is confirmed in production.
        - name: migrate-db-file
          image: docker.io/zimengxiong/excalidash-backend:0.6.9 # {"$imagepolicy": "flux-system:excalidash-backend"}
          command:
            - node
            - -e
            - |
              const fs = require("fs");
              const Database = require("/app/node_modules/better-sqlite3");
              const src = "/app/prisma/dev.db";
              const dst = "/app/prisma/excalidash.db";
              const tmp = `${dst}.partial`;
              if (fs.existsSync(dst) || !fs.existsSync(src)) process.exit(0);
              fs.rmSync(tmp, { force: true });
              const db = new Database(src, { fileMustExist: true });
              db.exec(`VACUUM INTO '${tmp}'`);
              db.close();
              const copy = new Database(tmp);
              copy.pragma("journal_mode = WAL");
              const check = copy.pragma("integrity_check", { simple: true });
              copy.close();
              if (check !== "ok") {
                fs.rmSync(tmp, { force: true });
                throw new Error(`Compacted copy of ${src} failed integrity_check: ${check}`);
              }
              fs.chmodSync(tmp, 0o600);
              fs.renameSync(tmp, dst);
              console.log(`Compacted ${src} (${fs.statSync(src).size} bytes) into ${dst} (${fs.statSync(dst).size} bytes)`);
          volumeMounts:
            - name: data
              mountPath: /app/prisma
              subPath: db
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
      containers:
        - name: backend
          image: docker.io/zimengxiong/excalidash-backend:0.6.9 # {"$imagepolicy": "flux-system:excalidash-backend"}
          env:
            - name: DATABASE_PROVIDER
              value: sqlite
            - name: DATABASE_URL
              value: file:/app/prisma/excalidash.db
            - name: PORT
              value: "8000"
            - name: NODE_ENV
              value: production
            - name: AUTH_MODE
              value: oidc_enforced
            - name: FRONTEND_URL
              value: https://excalidraw.harville.dev
            - name: OIDC_PROVIDER_NAME
              value: Authentik
            - name: OIDC_ISSUER_URL
              value: https://auth.harville.dev/application/o/excalidraw/
            - name: OIDC_CLIENT_ID
              value: excalidraw
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: excalidraw-oidc
                  key: EXCALIDRAW_OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URI
              value: https://excalidraw.harville.dev/api/auth/oidc/callback
            - name: OIDC_REQUIRE_EMAIL_VERIFIED
              value: "false"
            - name: TRUST_PROXY
              value: "1"
            - name: NODE_OPTIONS
              value: --max-old-space-size=768
            - name: BACKUP_SCHEDULE
              value: "0 0 4 * * *"
            - name: BACKUP_DIR
              value: /app/backups
            - name: BACKUP_RETENTION_DAYS
              value: "7"
          volumeMounts:
            - name: data
              mountPath: /app/prisma
              subPath: db
            - name: data
              mountPath: /app/backups
              subPath: backups
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 6
        - name: frontend
          image: docker.io/zimengxiong/excalidash-frontend:0.6.9 # {"$imagepolicy": "flux-system:excalidash-frontend"}
          env:
            - name: BACKEND_URL
              value: 127.0.0.1:8000
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: excalidraw-data
