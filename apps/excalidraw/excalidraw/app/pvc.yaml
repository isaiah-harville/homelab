---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: excalidraw-data
  labels:
    recurring-job-group.longhorn.io/default: enabled
    recurring-job-group.longhorn.io/offsite: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-retain
  resources:
    requests:
      storage: 4Gi
