---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/homepage/homepage/app
  prune: true
  wait: true
  targetNamespace: homepage
  sourceRef:
    kind: GitRepository
    name: flux-system
