---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: switchback
  namespace: flux-system
spec:
  interval: 5m
  ref:
    branch: main
  secretRef:
    name: switchback-site-auth
  url: ssh://git@github.com/Harville-Labs/switchback.git
  # Only the deploy manifests; the rest of the monorepo isn't needed here.
  ignore: |
    /*
    !/deploy/
