---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # The console's Deployment and Service, from the private sites repo (read
  # through the `website` Kustomization's GitRepository). CI there bumps the
  # image tag in deploy/k8s/console/kustomization.yaml on every build of main.
  # The `switchback-site` Kustomization that applies this file also owns the
  # Ingress, Postgres cluster, and configuration.
  name: switchback-site-upstream
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/k8s/console
  prune: true
  targetNamespace: harville-labs
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: website
  dependsOn:
    - name: website
    - name: infra
    - name: certificates
