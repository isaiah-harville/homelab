---
# Only the database's own namespace, the CloudNativePG operator and Prometheus
# can reach these pods. Other namespaces have no reason to speak Postgres to
# them, and a compromised pod elsewhere shouldn't be able to try.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: switchback-site-postgres
  namespace: harville-labs
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: switchback-site-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
