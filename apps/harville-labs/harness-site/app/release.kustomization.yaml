---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # The site's Deployment and Service, from the harness repo. CI there bumps
  # the image tag in deploy/k8s/site/kustomization.yaml on every build of
  # main. The `harness-site` Kustomization that applies this file also owns
  # the GitRepository, Ingress, Postgres cluster, and configuration.
  name: harness-site-upstream
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/k8s/site
  prune: true
  targetNamespace: harville-labs
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: harness
  dependsOn:
    - name: infra
    - name: certificates
