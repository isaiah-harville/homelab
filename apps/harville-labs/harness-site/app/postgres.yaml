---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harness-site-postgres
  namespace: harville-labs
spec:
  # Customer sites, members, policies, and device tokens: one instance per
  # node, and every commit reaches a standby before it's acknowledged.
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
  primaryUpdateStrategy: unsupervised
  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      # See primer-postgres: an unbounded slot for a down replica can fill the volume.
      max_slot_wal_keep_size: 2GB
  # Bootstrap runs only when the cluster is first created. To rebuild it from
  # backups, switch this to `recovery` from `origin` (as primer-postgres does)
  # and bump the archiving serverName below, so the new cluster archives into
  # an empty location instead of on top of the history it restores from.
  bootstrap:
    initdb:
      database: harness_site
      owner: harness_site
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: harness-site-postgres-backup
          serverName: harness-site-postgres
  storage:
    storageClass: longhorn-database
    size: 5Gi
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/default: enabled
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  monitoring:
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: harness-site-postgres-backup
        serverName: harness-site-postgres
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: harness-site-postgres-backup
  namespace: harville-labs
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://backups/config/harness-site-postgres
    endpointURL: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
    s3Credentials:
      accessKeyId:
        name: config-backup-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: config-backup-s3
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: harness-site-postgres-nightly
  namespace: harville-labs
spec:
  # 02:15, after primer (02:00), so they don't compete for the same SeaweedFS volume.
  schedule: "0 15 2 * * *"
  backupOwnerReference: self
  cluster:
    name: harness-site-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: harness-site-postgres
  namespace: harville-labs
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: harness-site-postgres
  podMetricsEndpoints:
    - port: metrics
