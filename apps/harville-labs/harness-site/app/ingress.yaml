---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: harness-site-limits
  namespace: harville-labs
spec:
  # Every signed-in Harness polls for policy every few minutes; this is far
  # above that and still stops scraping and brute force.
  rateLimit:
    average: 240
    period: 1m
    burst: 60
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: harness-site-sign-in-limits
  namespace: harville-labs
spec:
  # Sign-in emails and link redemption: a person needs a handful per hour.
  rateLimit:
    average: 10
    period: 1m
    burst: 10
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harness-site
  namespace: harville-labs
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: harville-labs-harness-site-limits@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Public
    gethomepage.dev/name: Harness sites
    gethomepage.dev/description: Harness control plane for customer organizations
    gethomepage.dev/href: https://harness.harville.ai
    gethomepage.dev/siteMonitor: https://harness.harville.ai/healthz
spec:
  ingressClassName: traefik-public
  tls:
    - hosts: [harness.harville.ai]
  rules:
    - host: harness.harville.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harness-site
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harness-site-sign-in
  namespace: harville-labs
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: harville-labs-harness-site-sign-in-limits@kubernetescrd
spec:
  ingressClassName: traefik-public
  tls:
    - hosts: [harness.harville.ai]
  rules:
    - host: harness.harville.ai
      http:
        paths:
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: harness-site
                port:
                  name: http
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: harness-site
                port:
                  name: http
