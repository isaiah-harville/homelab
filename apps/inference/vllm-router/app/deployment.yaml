apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-router
  labels:
    app: vllm-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-router
  template:
    metadata:
      labels:
        app: vllm-router
    spec:
      containers:
        - name: vllm-router
          image: docker.io/lmcache/lmstack-router:v0.1.13 # {"$imagepolicy": "flux-system:lmstack-router"}
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8001"
            - --service-discovery
            - static
            - --static-backends
            - "http://llama-qwen3-5-4b.inference.svc.cluster.local:8080,http://llama-qwen3-5-9b.inference.svc.cluster.local:8080,http://llama-ministral-3b-reasoning.inference.svc.cluster.local:8080"
            - --static-models
            - "qwen3.5-4b,qwen3.5-9b,ministral-3-3b-reasoning"
            - --static-model-types
            - "chat,chat,chat"
            - --routing-logic
            - roundrobin
            - --log-stats
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
        - name: auth-proxy
          image: docker.io/library/nginx:1.31.8-alpine # {"$imagepolicy": "flux-system:nginx"}
          ports:
            - name: public
              containerPort: 8002
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: api-key
          volumeMounts:
            - name: auth-proxy
              mountPath: /etc/nginx/templates
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8002
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: auth-proxy
          configMap:
            name: vllm-router-auth-proxy
