---
# The router has no API-key option, so a bearer-token check sits in front of
# the public listener. nginx renders this template at start and substitutes
# only the env vars that are set (VLLM_API_KEY), leaving its own $variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-router-auth-proxy
data:
  default.conf.template: |
    server {
      listen 8002;

      location / {
        # A direct comparison, not a map: a map key as long as "Bearer <key>"
        # overflows nginx's default map_hash_bucket_size and nginx won't start.
        if ($http_authorization != "Bearer ${VLLM_API_KEY}") {
          add_header WWW-Authenticate 'Bearer realm="vllm"' always;
          add_header Content-Type application/json always;
          return 401 '{"error":{"message":"Missing or invalid API key","type":"invalid_request_error","code":"invalid_api_key"}}';
        }

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        # Token streaming and long generations: no buffering, no short timeout.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 32m;
      }
    }
