---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vllm
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/inference/vllm/app
  prune: true
  wait: true
  targetNamespace: inference
  sourceRef:
    kind: GitRepository
    name: flux-system
