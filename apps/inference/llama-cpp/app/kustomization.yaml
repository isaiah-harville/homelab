---
# llama.cpp inference, one deployment per model.
#
# One subdirectory per model, and the directory is named after the model.
# Inkling 2 Mini is the only model and runs on CPU; both 4GB GPUs are free.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - inkling-2-mini
  - podmonitor.yaml
