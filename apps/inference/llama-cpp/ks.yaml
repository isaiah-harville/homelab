---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llama-cpp
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/inference/llama-cpp/app
  prune: true
  wait: true
  targetNamespace: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
