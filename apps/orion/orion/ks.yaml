---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orion
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/orion/orion/app
  prune: true
  wait: true
  targetNamespace: orion
  sourceRef:
    kind: GitRepository
    name: flux-system
