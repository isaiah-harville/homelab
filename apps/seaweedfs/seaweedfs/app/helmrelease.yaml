---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
spec:
  interval: 30m
  timeout: 20m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  chart:
    spec:
      chart: seaweedfs
      version: ">=4.40.0 <5.0.0"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
  # global.monitoring.enabled also ships the upstream SeaweedFS dashboard and
  # the chart has no separate switch for it. Homelab / Storage Health covers
  # SeaweedFS, so drop the ConfigMap and keep only the ServiceMonitors.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: seaweedfs-seaweedfs-grafana-dashboard
            patch: |
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: seaweedfs-seaweedfs-grafana-dashboard
  values:
    global:
      # ServiceMonitors for master/volume/filer/S3/admin. The release label is
      # what the kube-prometheus-stack Prometheus selects on.
      monitoring:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
    master:
      replicas: 1
      data:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: longhorn
      logs:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: longhorn
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    volume:
      replicas: 1
      dataDirs:
        - name: data1
          type: persistentVolumeClaim
          size: 50Gi
          storageClass: longhorn
          maxVolumes: 0
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    filer:
      replicas: 1
      data:
        type: persistentVolumeClaim
        size: 8Gi
        storageClass: longhorn
      logs:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: longhorn
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    s3:
      enabled: true
      replicas: 1
      port: 8333
      # Without enableAuth the chart never mounts existingConfigSecret, so the
      # gateway ran wide open: anonymous list/read/write on every bucket, including
      # openvitae via its public Ingress. Every client signs with a key from this
      # secret; OpenVitae visitors use presigned URLs, which still work.
      enableAuth: true
      existingConfigSecret: seaweedfs-s3-config
      logs:
        type: emptyDir
      createBuckets:
        - name: general
        - name: backups
        - name: mlflow
        - name: openvitae
        - name: inquizitive
        - name: primer-sources
        - name: opendiagnostics-weights
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    admin:
      enabled: true
      replicas: 1
      # weed admin >=4.46 refuses a non-loopback bind without auth.
      secret:
        existingSecret: seaweedfs-admin
        userKey: username
        pwKey: password
      data:
        type: persistentVolumeClaim
        size: 2Gi
        storageClass: longhorn
      logs:
        type: emptyDir
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
