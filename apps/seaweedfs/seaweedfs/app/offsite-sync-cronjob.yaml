---
# The Postgres backups and the Omni archives live in SeaweedFS, which runs on
# this cluster's own storage: a cluster-wide loss would take the backups with
# it. Mirror the bucket to Cloudflare R2 every night, one way. `sync` also
# removes what the source dropped, so barman's retention applies off-site too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-backup-sync
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: offsite-backup-sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: sync
              image: rclone/rclone:1.71.1
              args:
                - sync
                - seaweedfs:backups
                - r2:homelab-backups/seaweedfs-backups
                - --fast-list
                - --transfers=8
                - --stats-one-line
                - --stats=5m
              env:
                # Source: SeaweedFS in this cluster.
                - name: RCLONE_CONFIG_SEAWEEDFS_TYPE
                  value: s3
                - name: RCLONE_CONFIG_SEAWEEDFS_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_SEAWEEDFS_ENDPOINT
                  value: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
                - name: RCLONE_CONFIG_SEAWEEDFS_REGION
                  value: us-east-1
                - name: RCLONE_CONFIG_SEAWEEDFS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: config-backup-s3
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_SEAWEEDFS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: config-backup-s3
                      key: AWS_SECRET_ACCESS_KEY
                # Destination: Cloudflare R2, same credentials Longhorn uses.
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_REGION
                  value: auto
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: longhorn-r2
                      key: AWS_ENDPOINTS
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: longhorn-r2
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: longhorn-r2
                      key: AWS_SECRET_ACCESS_KEY
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 1Gi
