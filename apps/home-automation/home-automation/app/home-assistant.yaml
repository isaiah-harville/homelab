---
# Home Assistant writes UI-driven configuration into /config/.storage, not into
# configuration.yaml, so configuration.yaml can safely be owned by Git and
# mounted read-only. Integrations added through the UI (including the MQTT
# broker) are unaffected; only YAML-level settings belong here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-configuration
data:
  configuration.yaml: |
    default_config:

    homeassistant:
      name: Home
      time_zone: America/Chicago
      # The companion apps use external_url away from home.
      external_url: "https://home-assistant.harville.dev"
      internal_url: "https://home-assistant.int.harville.dev"

    # No http: block. Home Assistant now owns the HTTP settings in .storage
    # (Settings > System > Network) and ignores them here; the reverse proxy
    # values it needs are in docs/apps/home-automation.md.

    # Sign-in through Authentik (hass-oidc-auth, installed by the
    # install-auth-oidc init container). Home Assistant's own login stays
    # available as the "alternative" option for break-glass access.
    auth_oidc:
      client_id: home-assistant
      discovery_url: https://auth.harville.dev/application/o/home-assistant/.well-known/openid-configuration
      display_name: Authentik
      roles:
        admin: authentik Admins
        user: Home Assistant Users

    # These are edited by Home Assistant's own UI editors, so they live on the
    # PVC rather than in this ConfigMap.
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  labels:
    # Daily snapshots plus a weekly backup off-site (Cloudflare R2).
    recurring-job-group.longhorn.io/default: enabled
    recurring-job-group.longhorn.io/offsite: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # configuration.yaml !includes these; Home Assistant refuses to start if
        # a referenced file is missing. Create them empty once, then leave them
        # alone so the UI editors keep their contents.
        - name: seed-includes
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              set -eu
              for f in automations.yaml scripts.yaml scenes.yaml; do
                [ -e "/config/$f" ] || printf '[]\n' > "/config/$f"
              done
          volumeMounts:
            - name: config
              mountPath: /config
        # hass-oidc-auth is a custom integration, so it is not in the image.
        # Install the pinned release (checksum-verified) into the PVC; bump
        # both values together to upgrade.
        - name: install-auth-oidc
          image: ghcr.io/home-assistant/home-assistant:2026.8.2
          command:
            - python3
            - -c
            - |
              import hashlib, io, pathlib, shutil, urllib.request, zipfile
              version = "v1.2.1"
              sha256 = "e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd"
              dest = pathlib.Path("/config/custom_components/auth_oidc")
              stamp = dest / ".release"
              if stamp.exists() and stamp.read_text() == version:
                  raise SystemExit(0)
              url = f"https://github.com/christiaangoossens/hass-oidc-auth/releases/download/{version}/hass-oidc-auth.zip"
              data = urllib.request.urlopen(url, timeout=60).read()
              if hashlib.sha256(data).hexdigest() != sha256:
                  raise SystemExit(f"checksum mismatch for {url}")
              shutil.rmtree(dest, ignore_errors=True)
              zipfile.ZipFile(io.BytesIO(data)).extractall(dest)
              stamp.write_text(version)
              print("installed hass-oidc-auth", version)
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.8.2
          ports:
            - name: http
              containerPort: 8123
          env:
            - name: TZ
              value: America/Chicago
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            # Home Assistant's first boot installs integration requirements and
            # can take several minutes.
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: configuration
          configMap:
            name: home-assistant-configuration
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
spec:
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: http
