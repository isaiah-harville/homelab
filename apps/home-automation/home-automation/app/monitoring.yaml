---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-automation
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: home-automation
      rules:
        - alert: HomeAutomationWorkloadUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace="apps",
              deployment=~"home-assistant|matter-server|mosquitto|otbr|zigbee2mqtt"
            }
              < on (namespace, deployment)
            kube_deployment_spec_replicas{
              namespace="apps",
              deployment=~"home-assistant|matter-server|mosquitto|otbr|zigbee2mqtt"
            }
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.deployment }} is unavailable"
            description: >-
              The home-automation Deployment has had fewer available replicas
              than desired for 15 minutes. A Deployment deliberately scaled to
              zero does not alert.
        - alert: HomeAutomationContainerRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="apps",
              container=~"home-assistant|matter-server|mosquitto|otbr|zigbee2mqtt"
            }[30m]) > 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.container }} is restarting repeatedly"
            description: >-
              The smart-home container restarted more than three times in the
              last 30 minutes.
