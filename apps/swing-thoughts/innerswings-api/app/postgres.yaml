---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: innerswings-postgres
  namespace: swing-thoughts
spec:
  # Accounts, friendships, and shared-round scores: one instance per node, and
  # every commit reaches a standby before it's acknowledged.
  # TODO(backups): add the barman-cloud plugin and an ObjectStore like
  # switchback-site-postgres once `config-backup-s3` is reflected into
  # swing-thoughts (its SOPS file needs the age key to edit).
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
  primaryUpdateStrategy: unsupervised
  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      # See primer-postgres: an unbounded slot for a down replica can fill the volume.
      max_slot_wal_keep_size: 2GB
  bootstrap:
    initdb:
      database: innerswings
      owner: innerswings
  storage:
    storageClass: longhorn-database
    size: 2Gi
  inheritedMetadata:
    labels:
      recurring-job-group.longhorn.io/default: enabled
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  monitoring:
    disableDefaultQueries: false
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: innerswings-postgres
  namespace: swing-thoughts
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: innerswings-postgres
  podMetricsEndpoints:
    - port: metrics
