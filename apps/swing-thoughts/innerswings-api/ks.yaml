---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: innerswings-api
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/swing-thoughts/innerswings-api/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The `swing-thoughts` Kustomization owns the GitRepository this app's
  # upstream manifests come from.
  dependsOn:
    - name: swing-thoughts
