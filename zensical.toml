# Documentation site, built with Zensical (https://zensical.org).
#   uv run python scripts/generate_reference.py   # generated reference pages
#   uv run zensical serve                          # preview
#   uv run zensical build --strict                 # what CI runs
[project]
site_name = "Homelab"
site_description = "Architecture, operations, and repository guides for the homelab"
site_url = "https://homelab.harville.dev/"
repo_url = "https://github.com/isaiah-harville/homelab"
repo_name = "isaiah-harville/homelab"
docs_dir = "docs"
site_dir = "site"
strict = true
# Included READMEs live outside docs/; serve rebuilds when they change.
watch = [
  "README.md",
  "apps",
  "clusters",
  "infrastructure",
  "omni-server/README.md",
  "omni-server/coreos/README.md",
  "omni-server/coreos/INSTALL-ISO.md",
  "talos/README.md",
  "terraform/omni/README.md",
  "scripts/generate_reference.py",
]
nav = [
  { "Home" = "README.md" },
  { "Architecture" = [
    { "Overview" = "architecture/overview.md" },
    { "Reconciliation model" = "architecture/reconciliation.md" },
  ] },
  { "Repository" = [
    { "Apps" = "apps/README.md" },
    { "Primer" = "apps/primer.md" },
    { "Excalidraw" = "apps/excalidraw.md" },
    { "Inquizitive" = "apps/inquizitive.md" },
    { "Media" = "apps/media.md" },
    { "Clusters" = "clusters/README.md" },
    { "Homelab composition" = "clusters/homelab/README.md" },
    { "Infrastructure" = "infrastructure/README.md" },
    { "Flux layout and moves" = "operations/flux-layout.md" },
  ] },
  { "Runbooks" = [
    { "Omni management plane" = "omni-server/README.md" },
    { "Omni host on Fedora CoreOS" = "omni-server/coreos/README.md" },
    { "Build the Omni install ISO" = "omni-server/coreos/INSTALL-ISO.md" },
    { "Upgrades (Omni, Talos, Kubernetes)" = "operations/upgrades.md" },
    { "Talos cluster" = "talos/README.md" },
    { "Terraform for Omni" = "terraform/omni/README.md" },
    { "Backup and recovery" = "operations/backups.md" },
    { "Secrets" = "operations/secrets.md" },
    { "Authentication" = "operations/authentication.md" },
    { "Storage" = "operations/storage.md" },
    { "Monitoring" = "operations/monitoring.md" },
  ] },
  { "Decisions" = [
    { "Terraform state backend" = "decisions/terraform-state.md" },
    { "Metrics Server TLS" = "decisions/metrics-server-tls.md" },
    { "Omni resource identity" = "decisions/omni-resource-identity.md" },
  ] },
  { "Generated reference" = [
    { "About generated docs" = "reference/index.md" },
    { "Helm releases" = "reference/helm-releases.md" },
    { "Flux sources" = "reference/sources.md" },
    { "Flux reconciliation" = "reference/flux-kustomizations.md" },
  ] },
  { "Contributing" = [
    { "Documentation" = "contributing/documentation.md" },
  ] },
]

[project.theme]
# Zensical's default (modern) design, matching the xpt docs.
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
toc.permalink = true

# Inlines the in-tree READMEs into docs/ stubs (Zensical reimplements the
# MkDocs include-markdown plugin natively). Per-include arguments such as
# rewrite-relative-urls are ignored: included links are never rewritten.
[project.plugins.include-markdown]
enabled = true
