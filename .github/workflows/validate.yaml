---
name: Validate

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint

  render:
    name: Render (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - clusters/homelab/apps
          - clusters/homelab/infra
          - clusters/homelab/flux-system
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Render manifests
        run: kubectl kustomize "${{ matrix.path }}" >/dev/null

  render-components:
    name: Render apps and infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      # clusters/homelab/{apps,infra} only render the per-component Flux
      # Kustomizations, so render each component's own directory too.
      - name: Render every app and infrastructure component
        run: |
          set -e
          for ks in $(find apps infrastructure -name ks.yaml | sort); do
            echo "::group::$(dirname "$ks")"
            kubectl kustomize "$(dirname "$ks")/app" >/dev/null
            echo "::endgroup::"
          done

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: YAML files must not be executable
        run: |
          bad="$(find . -type f \( -name '*.yaml' -o -name '*.yml' \) -perm /111 | sort)"
          if [ -n "$bad" ]; then
            echo "Executable YAML files found:"
            echo "$bad"
            exit 1
          fi

      - name: Helm repositories belong in infrastructure/sources
        run: |
          bad="$(
            rg -l '^kind: HelmRepository$' infrastructure apps |
            grep -v '^infrastructure/sources/' || true
          )"
          if [ -n "$bad" ]; then
            echo "HelmRepository manifests found outside infrastructure/sources:"
            echo "$bad"
            exit 1
          fi

      - name: Git repositories belong to an app or component
        run: |
          bad="$(
            rg -l '^kind: GitRepository$' apps infrastructure clusters |
            grep -v -E '^(apps|infrastructure)/[^/]*/[^/]*/app/' || true
          )"
          if [ -n "$bad" ]; then
            echo "GitRepository manifests found outside an app or component directory:"
            echo "$bad"
            exit 1
          fi

      - name: Shared wildcard TLS stays centralized for app ingresses
        run: |
          bad="$(
            rg -n 'secretName: harville-wildcard-shared-tls' apps \
              --glob '*ingress.yaml' || true
          )"
          if [ -n "$bad" ]; then
            echo "App ingress manifests should not hardcode the shared wildcard TLS secret:"
            echo "$bad"
            exit 1
          fi
