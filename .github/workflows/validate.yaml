---
name: Validate

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - clusters/homelab/apps
          - clusters/homelab/infra
          - clusters/homelab/flux-system
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Render manifests
        run: kubectl kustomize "${{ matrix.path }}" >/dev/null

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Lint workflows
        uses: rhysd/actionlint@v1

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: YAML files must not be executable
        run: |
          bad="$(find . -type f \( -name '*.yaml' -o -name '*.yml' \) -perm /111 | sort)"
          if [ -n "$bad" ]; then
            echo "Executable YAML files found:"
            echo "$bad"
            exit 1
          fi

      - name: Helm repositories belong in infrastructure/base/sources
        run: |
          bad="$(rg -l '^kind: HelmRepository$' infrastructure/base apps | grep -v '^infrastructure/base/sources/' || true)"
          if [ -n "$bad" ]; then
            echo "HelmRepository manifests found outside infrastructure/base/sources:"
            echo "$bad"
            exit 1
          fi
