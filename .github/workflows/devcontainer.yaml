---
name: Publish mono devcontainer

"on":
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/mono

jobs:
  build-and-push:
    name: Build and push mono
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the devcontainer (Microsoft base image + features, no Dockerfile).
      # Build cache is read from and written to a dedicated registry tag
      # (:buildcache) via buildx registry cache, so rebuilds only redo what
      # changed.
      - name: Build and push devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.IMAGE }}
          imageTag: latest
          cacheFrom: type=registry,ref=${{ env.IMAGE }}:cache
          cacheTo: type=registry,ref=${{ env.IMAGE }}:cache,mode=max
          push: always
