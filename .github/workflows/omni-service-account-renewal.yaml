---
# Keep the Omni service account CI uses (terraform) from expiring. Omni caps
# keys at a year, so once a month this renews the key, re-encrypts
# omni-terraform.sops.yaml (encrypting needs only the public age recipient
# in .sops.yaml), and merges that as a PR. Flux updates the Secret and the
# next runner pod picks up the new key. If anything fails after the renewal,
# the old key stays valid until its own expiry, so CI is never locked out.
#
# The Omni host's pxe-menu account renews itself on the host
# (omni-server/coreos/files/bin/pxe-menu).
name: Renew Omni service account keys

"on":
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: omni-service-account-renewal
  cancel-in-progress: false

env:
  SECRET_FILE: infrastructure/arc-systems/actions-runner-controller/app/omni-terraform.sops.yaml
  SOPS_VERSION: v3.13.3
  SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b

jobs:
  terraform:
    name: Renew the terraform key
    # In-cluster runner: it can reach Omni and already holds the terraform
    # key (OMNI_ENDPOINT, OMNI_SERVICE_ACCOUNT_KEY from omni-terraform).
    runs-on: homelab
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install omnictl and sops
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          # omnictl matching the Omni version the repo pins, checked against
          # the release's own sha256sum.txt.
          version=$(sed -nE 's/^[[:space:]]*omni:.*:(v[0-9]+\.[0-9]+\.[0-9]+).*/\1/p' omni-server/coreos/versions.yaml)
          release=https://github.com/siderolabs/omni/releases/download/$version
          sum=$(curl -fsSL "$release/sha256sum.txt" | awk '$2 == "omnictl-linux-amd64" {print $1}')
          curl -fsSL -o "$RUNNER_TEMP/bin/omnictl" "$release/omnictl-linux-amd64"
          echo "$sum  $RUNNER_TEMP/bin/omnictl" | sha256sum --check --quiet
          curl -fsSL -o "$RUNNER_TEMP/bin/sops" \
            "https://github.com/getsops/sops/releases/download/$SOPS_VERSION/sops-$SOPS_VERSION.linux.amd64"
          echo "$SOPS_SHA256  $RUNNER_TEMP/bin/sops" | sha256sum --check --quiet
          chmod +x "$RUNNER_TEMP/bin/omnictl" "$RUNNER_TEMP/bin/sops"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Renew the key and re-encrypt the secret
        run: |
          set -euo pipefail
          # Never print omnictl's output: it contains the new key.
          new=$(omnictl serviceaccount renew terraform --ttl 8760h 2> /dev/null |
            sed -nE 's/^OMNI_SERVICE_ACCOUNT_KEY=//p')
          [[ -n $new ]] || { echo "::error::omnictl returned no key"; exit 1; }
          echo "::add-mask::$new"
          umask 077
          # Same header and Secret as before; only the key changes.
          {
            sed -n '/^apiVersion:/q;p' "$SECRET_FILE"
            printf 'apiVersion: v1\nkind: Secret\nmetadata:\n  name: omni-terraform\n  namespace: arc-runners\ntype: Opaque\nstringData:\n'
            printf '  OMNI_ENDPOINT: %s\n' "$(jq -Rn --arg v "$OMNI_ENDPOINT" '$v')"
            printf '  OMNI_SERVICE_ACCOUNT_KEY: %s\n' "$(jq -Rn --arg v "$new" '$v')"
          } > "$SECRET_FILE.new"
          mv "$SECRET_FILE.new" "$SECRET_FILE"
          sops --encrypt --in-place "$SECRET_FILE"
          grep -q '^sops:' "$SECRET_FILE" || { echo "::error::$SECRET_FILE is not encrypted"; exit 1; }
          if grep -qF "$new" "$SECRET_FILE"; then
            echo "::error::plaintext key in $SECRET_FILE"
            exit 1
          fi

      - name: Merge the renewal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=renew/omni-terraform-$(date -u +%Y%m%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$SECRET_FILE"
          git commit -m "chore(arc): renew the Omni terraform service account key"
          git push origin "$branch"
          api=https://api.github.com/repos/$GITHUB_REPOSITORY
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          pr=$(curl -fsS "${auth[@]}" -X POST "$api/pulls" -d "$(jq -n --arg h "$branch" --arg b "$GITHUB_REF_NAME" \
            '{title: "chore(arc): renew the Omni terraform service account key", head: $h, base: $b,
              body: "Monthly renewal by .github/workflows/omni-service-account-renewal.yaml. The previous key stays valid until its own expiry."}')" |
            jq -r .number)
          curl -fsS "${auth[@]}" -X PUT "$api/pulls/$pr/merge" -d '{"merge_method": "squash"}' > /dev/null
          curl -fsS "${auth[@]}" -X DELETE "$api/git/refs/heads/$branch" > /dev/null || true
          echo "merged #$pr"
