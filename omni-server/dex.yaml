# The local account remains available when the cluster and Authelia are down.
# Enable the Authelia connector after its Dex client is configured.
---
issuer: https://omni-dex.int.harville.dev:5556

storage:
  type: sqlite3
  config:
    file: /etc/dex/dex.db

web:
  https: 0.0.0.0:5556
  tlsCert: /etc/dex/tls/server-chain.pem
  tlsKey: /etc/dex/tls/server-key.pem

oauth2:
  skipApprovalScreen: true

staticClients:
  - name: Omni
    id: omni
    # Must match DEX_OMNI_CLIENT_SECRET in .env.
    secret: change-me-long-random
    redirectURIs:
      - https://omni.int.harville.dev/oidc/consume

# Break-glass local admin
enablePasswordDB: true
staticPasswords:
  - email: admin@int.harville.dev
    username: admin
    # htpasswd -bnBC 10 "" 'yourpassword' | tr -d ':\n'
    hash: "$2y$10$REPLACE_WITH_BCRYPT_HASH"

