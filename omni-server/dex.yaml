---
# Dex for Omni's OIDC login. Independent of the cluster on purpose: the static
# admin below is the break-glass account that still works when the cluster
# (and Authentik) is down.
#
# No secrets live in this file. Both come from omni-server/.env via the dex
# service's environment in compose.yaml, so the host's copy of this file never
# differs from git and `git pull` can't conflict on it.
issuer: https://omni-dex.int.harville.dev:5556

storage:
  type: sqlite3
  config:
    file: /etc/dex/dex.db

web:
  https: 0.0.0.0:5556
  tlsCert: /etc/dex/tls/server-chain.pem
  tlsKey: /etc/dex/tls/server-key.pem

oauth2:
  skipApprovalScreen: true

staticClients:
  - name: Omni
    id: omni
    secretEnv: DEX_OMNI_CLIENT_SECRET
    redirectURIs:
      - https://omni.int.harville.dev/oidc/consume

enablePasswordDB: true
staticPasswords:
  - email: admin@int.harville.dev
    username: admin
    # bcrypt hash: htpasswd -bnBC 10 "" '<password>' | tr -d ':\n'
    hashFromEnv: DEX_ADMIN_PASSWORD_HASH
