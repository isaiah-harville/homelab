# Omni's state directories on the omni-data partition. Podman will not create
# a missing bind-mount source, and a restore or fresh partition may lack some.
d /var/lib/omni/data    0750 root root -
d /var/lib/omni/secrets 0700 root root -
d /var/lib/omni/certs   0750 root 1001 -
d /var/lib/omni/.lego   0700 root root -
d /var/lib/omni/backups 0700 root root -
