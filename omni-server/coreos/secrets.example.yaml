# Template for secrets.sops.yaml. Copy it, fill in the values, then encrypt
# from the repo root so .sops.yaml applies:
#
#   cp omni-server/coreos/secrets.example.yaml omni-server/coreos/secrets.sops.yaml
#   $EDITOR omni-server/coreos/secrets.sops.yaml
#   sops --encrypt --in-place omni-server/coreos/secrets.sops.yaml
#
# The repo's creation rule encrypts only data/stringData, so keep every value
# under stringData.
stringData:
  # openssl rand -hex 32. Shared by Dex (static client) and Omni.
  dex_omni_client_secret: REPLACE_ME
  # htpasswd -bnBC 12 "" '<password>' | tr -d ':\n'   (break-glass admin)
  dex_admin_password_hash: REPLACE_ME
  # Optional: the plaintext of that hash, kept here so the break-glass
  # password is recoverable with the age identity. Not rendered.
  dex_admin_password: REPLACE_ME
  # Cloudflare token with Zone:DNS:Edit on the zone, for lego DNS-01.
  cloudflare_dns_api_token: REPLACE_ME
  # openssl rand -hex 64. LUKS key for the omni-data partition. Never change
  # it on a running host: a reinstall with a different key can't open the
  # preserved data.
  omni_data_luks_key: REPLACE_ME
  # Optional: Omni service account key for the host's network-boot menu.
  # Set it with pxe/set-service-account.sh rather than by hand.
  omni_pxe_service_account_key: REPLACE_ME
