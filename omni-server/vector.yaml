sources:
  talos_services:
    type: socket
    mode: tcp
    address: 0.0.0.0:5170
    decoding:
      codec: json
    framing:
      method: newline_delimited
  talos_kernel:
    type: socket
    mode: tcp
    address: 0.0.0.0:5171
    decoding:
      codec: json
    framing:
      method: newline_delimited

sinks:
  service_files:
    type: file
    inputs: [talos_services]
    path: "/logs/{{ host }}/%Y-%m-%d-services.log"
    encoding:
      codec: json
  kernel_files:
    type: file
    inputs: [talos_kernel]
    path: "/logs/{{ host }}/%Y-%m-%d-kernel.log"
    encoding:
      codec: json
