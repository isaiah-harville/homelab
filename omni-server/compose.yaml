# Omni runs outside the cluster so it survives a full cluster outage.
# TLS certificates are managed with lego, not the in-cluster cert-manager.
---
services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: dex
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/dex.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dex.yaml:/etc/dex/dex.yaml:ro
      - ./certs/server-chain.pem:/etc/dex/tls/server-chain.pem:ro
      - ./certs/server-key.pem:/etc/dex/tls/server-key.pem:ro

  omni:
    image: ghcr.io/siderolabs/omni:${OMNI_VERSION}
    container_name: omni
    restart: unless-stopped
    depends_on:
      - dex
    # Required for the SideroLink WireGuard tunnel.
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./certs/ca.pem:/etc/ssl/certs/ca-certificates.crt:ro
      - ./certs/server-chain.pem:/server-chain.pem:ro
      - ./certs/server-key.pem:/server-key.pem:ro
      - ./secrets/omni.asc:/omni.asc:ro
      - ./secrets/omni-public.asc:/omni-public.asc:ro
      # /_out contains both databases and must be backed up.
      - ./data:/_out:rw
    command:
      - --name=omni
      - --cert=/server-chain.pem
      - --key=/server-key.pem
      - --machine-api-cert=/server-chain.pem
      - --machine-api-key=/server-key.pem
      - --machine-api-bind-addr=0.0.0.0:8090
      - --machine-api-advertised-url=https://${OMNI_HOST}:8090/
      - --private-key-source=file:///omni.asc
      - --public-key-files=/omni-public.asc
      - --storage-kind=etcd
      - --etcd-embedded
      - --etcd-embedded-db-path=/_out/etcd
      - --sqlite-storage-path=/_out/omni.db
      - --event-sink-port=8091
      - --bind-addr=0.0.0.0:443
      - --k8s-proxy-bind-addr=0.0.0.0:8100
      - --advertised-api-url=https://${OMNI_HOST}/
      - --siderolink-wireguard-advertised-addr=${OMNI_LAN_IP}:50180
      - --advertised-kubernetes-proxy-url=https://${OMNI_HOST}:8100/
      # Dex provides OIDC with a local break-glass account.
      - --auth-auth0-enabled=false
      - --auth-oidc-enabled=true
      - --auth-oidc-provider-url=https://${DEX_HOST}:5556
      - --auth-oidc-client-id=omni
      - --auth-oidc-client-secret=${DEX_OMNI_CLIENT_SECRET}
      - --auth-oidc-scopes=openid
      - --auth-oidc-scopes=profile
      - --auth-oidc-scopes=email
      - --initial-users=${OMNI_ADMIN_EMAIL}
      - --eula-accept-name=${EULA_NAME}
      - --eula-accept-email=${EULA_EMAIL}
