# Runner registration credential for actions-runner-controller (ARC).
# ARC accepts either a GitHub App (app id/installation/private key) or a PAT
# via `github_token`. We use the PAT path (gh CLI token, `repo` scope) for a
# repo-level runner on isaiah-harville/homelab. Injected into runners via
# envFrom / referenced by the runner-scale-set's githubConfigSecret.
#
# To rotate: `gh auth token` (or a fresh PAT with `repo`), replace the value,
# then re-encrypt:
#   sops --encrypt --in-place clusters/homelab/infra/secrets/actions-runner-controller/github-config.yaml
