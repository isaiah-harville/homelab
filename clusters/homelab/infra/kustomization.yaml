---
# Each namespace folder holds its Namespace and one Flux Kustomization per
# component (ks.yaml); those apply the component itself, with their own
# health checks and dependsOn ordering.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure/flux-system
  - ../../../infrastructure/traefik-internal
  - ../../../infrastructure/traefik-public
  - ../../../infrastructure/cert-manager
  - ../../../infrastructure/certificates
  - ../../../infrastructure/metallb-system
  - ../../../infrastructure/reflector
  - ../../../infrastructure/reloader
  - ../../../infrastructure/longhorn-system
  - ../../../infrastructure/monitoring
  - ../../../infrastructure/kube-system
  - ../../../infrastructure/cnpg-system
  - ../../../infrastructure/rabbitmq-system
  - ../../../infrastructure/gpu-operator
  - ../../../infrastructure/arc-systems
  - ../../../infrastructure/apps
