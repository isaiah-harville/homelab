---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure/base/namespaces
  - ../../../infrastructure/base/traefik
  - ../../../infrastructure/base/cert-manager
  - ../../../infrastructure/base/metallb
  - ../../../infrastructure/base/reflector
  - ../../../infrastructure/base/longhorn
  - ../../../infrastructure/base/monitoring
  - ../../../infrastructure/base/metrics-server
  - ./secrets/cert-manager/cloudflare-api-token.yaml
  - ./secrets/monitoring/cluster-user-auth.yaml
  # actions-runner-controller — self-hosted runner for the Terraform jobs.
  - ../../../infrastructure/base/actions-runner-controller
  - ./secrets/actions-runner-controller/github-config.yaml
  - ./secrets/actions-runner-controller/omni-terraform.yaml
patches:
  - target:
      kind: Ingress
      namespace: longhorn-system
    patch: |-
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: websecure
