---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
  annotations:
    # TEMPORARY: ownership of this object is moving to the infra Kustomization;
    # stops flux-system deleting it (and pruning what it owns) on the way out.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 5m
  path: ./infrastructure/base/metallb-config
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra
