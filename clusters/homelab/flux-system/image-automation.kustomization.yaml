---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
  annotations:
    # TEMPORARY: ownership of this object is moving to the infra Kustomization;
    # stops flux-system deleting it (and pruning what it owns) on the way out.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 5m
  path: ./clusters/homelab/image-automation
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: sources
