---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/homelab/infra
  # TEMPORARY: off while ownership moves to the per-component Kustomizations,
  # so nothing this one used to own is deleted before its new owner applies it.
  prune: false
  # Namespaces and per-component Kustomizations only; each component reports
  # its own health.
  wait: false
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: sources
