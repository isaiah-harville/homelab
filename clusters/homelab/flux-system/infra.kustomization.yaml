apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/homelab/infra
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: namespaces
  healthChecks:
    - kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - kind: HelmRelease
      name: metallb
      namespace: metallb-system
    - kind: HelmRelease
      name: traefik-public
      namespace: traefik-public
    - kind: HelmRelease
      name: traefik-internal
      namespace: traefik-internal
