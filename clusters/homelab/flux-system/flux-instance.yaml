---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  # Follow the current supported minor and take patch releases automatically.
  distribution:
    version: 2.8.x
    registry: ghcr.io/fluxcd
    artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  sync:
    kind: GitRepository
    url: ssh://git@github.com/isaiah-harville/homelab
    ref: refs/heads/main
    path: ./clusters/homelab/flux-system
    pullSecret: flux-system
    interval: 1m
  migrateResources: true
