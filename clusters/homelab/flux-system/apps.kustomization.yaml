---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/homelab/apps
  # TEMPORARY: off while ownership moves to the per-app Kustomizations, so
  # nothing this one used to own is deleted before its new owner applies it.
  prune: false
  # Namespaces and per-app Kustomizations only; each app reports its own
  # health, so one broken app no longer holds every other app's changes.
  wait: false
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: certificates
    - name: infra
    - name: sources
