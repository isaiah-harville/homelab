---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/homelab/apps
  prune: true
  wait: true
  # Allow first-time stateful bootstraps (including Authentik and its database)
  # to complete without racing the Kustomization timeout.
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: certificates
    - name: infra
    - name: sources
