---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/homelab/apps
  prune: true
  # Namespaces and per-app Kustomizations only; each app reports its own
  # health, so one broken app no longer holds every other app's changes.
  wait: false
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # The platform pieces apps need before their own Kustomizations can apply:
  # storage, TLS, and the operators whose CRDs apps use.
  dependsOn:
    - name: sources
    - name: certificates
    - name: longhorn
    - name: cloudnative-pg
    - name: cnpg-barman-plugin
    - name: rabbitmq-operator
    - name: kube-prometheus-stack
