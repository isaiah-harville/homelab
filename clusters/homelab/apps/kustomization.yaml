---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secrets/ghcr-pull.yaml
  - ./secrets/authelia-core.yaml
  - ./secrets/authelia-config.yaml
  - ./secrets/authelia-extras.yaml
  - ./secrets/authelia-oidc-rsa.yaml
  - ./secrets/authelia-secrets.yaml
  - ./secrets/authelia-users-database.yaml
  - ./secrets/swing-thoughts-auth.yaml
  - ./secrets/seaweedfs-s3-config.yaml
  - ./secrets/harbor-secrets.yaml
  - ./secrets/vllm-api-key.yaml
  - ./secrets/frp-token.yaml
  - ../../../apps/base/authelia
  - ../../../apps/base/echo-server
  - ../../../apps/base/headlamp
  - ../../../apps/base/homepage
  - ../../../apps/releases/swing-thoughts
  - ../../../apps/releases/pigeon
  - ../../../apps/base/pigeon-relay
  - ../../../apps/releases/orion
  - ../../../apps/base/admin
  - ../../../apps/releases/website
  - ../../../apps/base/openwebui
  - ../../../apps/base/seaweedfs
  - ../../../apps/base/harbor
  - ../../../apps/base/vllm
patches:
  - target:
      kind: Ingress
      namespace: apps
    patch: |-
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: websecure
  - target:
      kind: Ingress
      namespace: apps
    patch: |-
      - op: replace
        path: /spec/tls/0/secretName
        value: harville-wildcard-shared-tls
replacements:
  - source:
      kind: ConfigMap
      name: authelia-config
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: authelia
          namespace: apps
        fieldPaths:
          - spec.values.pod.annotations.authelia-config-mac
        options:
          create: true
  - source:
      kind: Secret
      name: authelia-core
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: authelia
          namespace: apps
        fieldPaths:
          - spec.values.pod.annotations.authelia-core-mac
        options:
          create: true
  - source:
      kind: Secret
      name: authelia-extras
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: authelia
          namespace: apps
        fieldPaths:
          - spec.values.pod.annotations.authelia-extras-mac
        options:
          create: true
  - source:
      kind: Secret
      name: authelia-oidc-rsa
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: authelia
          namespace: apps
        fieldPaths:
          - spec.values.pod.annotations.authelia-oidc-rsa-mac
        options:
          create: true
  - source:
      kind: Secret
      name: authelia-secrets
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: authelia
          namespace: apps
        fieldPaths:
          - spec.values.pod.annotations.authelia-secrets-mac
        options:
          create: true
  - source:
      kind: Secret
      name: authelia-users-database
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: authelia
          namespace: apps
        fieldPaths:
          - spec.values.pod.annotations.authelia-users-database-mac
        options:
          create: true
