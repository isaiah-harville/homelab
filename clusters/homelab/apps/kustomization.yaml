---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secrets/ghcr-pull.yaml
  - ./secrets/authentik-core.yaml
  - ./secrets/authentik-postgres.yaml
  - ./secrets/authentik-social.yaml
  - ./secrets/swing-thoughts-auth.yaml
  - ./secrets/seaweedfs-s3-config.yaml
  - ./secrets/omni-backup-s3-creds.yaml
  - ./secrets/harbor-secrets.yaml
  - ./secrets/harbor-oidc.yaml
  - ./secrets/config-backup-s3.yaml
  - ./secrets/vllm-api-key.yaml
  - ./secrets/pigeon-relay-apns.yaml
  - ./secrets/openvitae-secrets.yaml
  - ./secrets/books-oidc.yaml
  - ./secrets/books-smtp.yaml
  - ./secrets/qbittorrent.yaml
  - ./secrets/media-auth.yaml
  - ../../../apps/base/authentik
  - ../../../apps/base/books
  - ../../../apps/base/qbittorrent
  - ../../../apps/base/media-stack
  - ../../../apps/base/echo-server
  - ../../../apps/base/headlamp
  - ../../../apps/base/homepage
  - ../../../apps/releases/swing-thoughts
  - ../../../apps/releases/pigeon
  - ../../../apps/releases/runway
  - ../../../apps/base/pigeon-relay
  - ../../../apps/releases/orion
  - ../../../apps/base/admin
  - ../../../apps/releases/openvitae
  - ../../../apps/base/lucerna
  - ../../../apps/base/openwebui
  - ../../../apps/base/seaweedfs
  - ../../../apps/base/harbor
  - ../../../apps/base/vllm-router
  - ../../../apps/base/searxng
patches:
  - target:
      kind: Ingress
      namespace: apps
    patch: |-
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: websecure
  - target:
      kind: Ingress
      namespace: apps
    patch: |-
      - op: replace
        path: /spec/tls/0/secretName
        value: harville-wildcard-shared-tls
replacements:
  - source:
      kind: Secret
      name: authentik-core
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: authentik
          namespace: apps
        fieldPaths:
          - spec.values.global.podAnnotations.authentik-core-mac
        options:
          create: true
  - source:
      kind: Secret
      name: authentik-social
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: authentik
          namespace: apps
        fieldPaths:
          - spec.values.global.podAnnotations.authentik-social-mac
        options:
          create: true
      - select:
          kind: ConfigMap
          name: authentik-customization
          namespace: apps
        fieldPaths:
          - data.homelab-customization\.yaml
        options:
          delimiter: '# authentik-social-mac: '
          index: 1
  - source:
      kind: Secret
      name: books-oidc
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: Deployment
          name: books
          namespace: apps
        fieldPaths:
          - spec.template.metadata.annotations.books-oidc-mac
        options:
          create: true
      - select:
          kind: HelmRelease
          name: authentik
          namespace: apps
        fieldPaths:
          - spec.values.global.podAnnotations.books-oidc-mac
        options:
          create: true
  - source:
      kind: Secret
      name: media-auth
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: authentik
          namespace: apps
        fieldPaths:
          - spec.values.global.podAnnotations.media-auth-mac
        options:
          create: true
      - select:
          kind: Deployment
          namespace: apps
          name: books
        fieldPaths:
          - spec.template.metadata.annotations.media-auth-mac
        options:
          create: true
      - select:
          kind: Deployment
          namespace: apps
          name: prowlarr
        fieldPaths:
          - spec.template.metadata.annotations.media-auth-mac
        options:
          create: true
      - select:
          kind: Deployment
          namespace: apps
          name: radarr
        fieldPaths:
          - spec.template.metadata.annotations.media-auth-mac
        options:
          create: true
      - select:
          kind: Deployment
          namespace: apps
          name: jellyfin
        fieldPaths:
          - spec.template.metadata.annotations.media-auth-mac
        options:
          create: true
      - select:
          kind: Deployment
          namespace: apps
          name: authentik-ldap
        fieldPaths:
          - spec.template.metadata.annotations.media-auth-mac
        options:
          create: true
  - source:
      kind: Secret
      name: harbor-oidc
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: harbor
          namespace: apps
        fieldPaths:
          - spec.values.core.podAnnotations.harbor-oidc-mac
        options:
          create: true
      - select:
          kind: HelmRelease
          name: authentik
          namespace: apps
        fieldPaths:
          - spec.values.global.podAnnotations.harbor-oidc-mac
        options:
          create: true
  - source:
      kind: Secret
      name: books-smtp
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: Deployment
          name: books
          namespace: apps
        fieldPaths:
          - spec.template.metadata.annotations.books-smtp-mac
        options:
          create: true
  - source:
      kind: Secret
      name: qbittorrent
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: Deployment
          name: qbittorrent
          namespace: apps
        fieldPaths:
          - spec.template.metadata.annotations.qbittorrent-secret-mac
        options:
          create: true
      - select:
          kind: Deployment
          name: books
          namespace: apps
        fieldPaths:
          - spec.template.metadata.annotations.qbittorrent-secret-mac
        options:
          create: true
      - select:
          kind: Deployment
          name: prowlarr
          namespace: apps
        fieldPaths:
          - spec.template.metadata.annotations.qbittorrent-secret-mac
        options:
          create: true
