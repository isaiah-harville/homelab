---
# Each namespace folder holds its Namespace and one Flux Kustomization per
# app (ks.yaml); those apply the app itself, with their own health checks.
# Secrets shared by apps in different namespaces live in ./secrets and are
# copied where they're needed by reflector.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secrets/books-oidc.yaml
  - ./secrets/cloudflare-smtp.yaml
  - ./secrets/config-backup-s3.yaml
  - ./secrets/ghcr-pull.yaml
  - ./secrets/media-auth.yaml
  - ./secrets/mlflow-oidc.yaml
  - ./secrets/primer-oidc.yaml
  - ./secrets/qbittorrent.yaml
  - ./secrets/vllm-api-key.yaml
  - ../../../apps/authentik
  - ../../../apps/harville-labs
  - ../../../apps/headlamp
  - ../../../apps/home-automation
  - ../../../apps/homepage
  - ../../../apps/inference
  - ../../../apps/media
  - ../../../apps/mlflow
  - ../../../apps/openvitae
  - ../../../apps/orion
  - ../../../apps/pigeon
  - ../../../apps/primer
  - ../../../apps/scriptura
  - ../../../apps/searxng
  - ../../../apps/seaweedfs
  - ../../../apps/swing-thoughts
