---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secrets/ghcr-pull.yaml
  - ./secrets/authentik-core.yaml
  - ./secrets/authentik-postgres.yaml
  - ./secrets/authentik-social.yaml
  - ./secrets/swing-thoughts-auth.yaml
  - ./secrets/seaweedfs-s3-config.yaml
  - ./secrets/omni-backup-s3-creds.yaml
  - ./secrets/harbor-secrets.yaml
  - ./secrets/vllm-api-key.yaml
  - ./secrets/pigeon-relay-apns.yaml
  - ./secrets/openvitae-secrets.yaml
  - ../../../apps/base/authentik
  - ../../../apps/base/echo-server
  - ../../../apps/base/headlamp
  - ../../../apps/base/homepage
  - ../../../apps/releases/swing-thoughts
  - ../../../apps/releases/pigeon
  - ../../../apps/releases/runway
  - ../../../apps/base/pigeon-relay
  - ../../../apps/releases/orion
  - ../../../apps/base/admin
  - ../../../apps/releases/openvitae
  - ../../../apps/base/lucerna
  - ../../../apps/base/openwebui
  - ../../../apps/base/seaweedfs
  - ../../../apps/base/harbor
  - ../../../apps/base/vllm-router
  - ../../../apps/base/searxng
patches:
  - target:
      kind: Ingress
      namespace: apps
    patch: |-
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: websecure
  - target:
      kind: Ingress
      namespace: apps
    patch: |-
      - op: replace
        path: /spec/tls/0/secretName
        value: harville-wildcard-shared-tls
replacements:
  - source:
      kind: Secret
      name: authentik-core
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: authentik
          namespace: apps
        fieldPaths:
          - spec.values.global.podAnnotations.authentik-core-mac
        options:
          create: true
  - source:
      kind: Secret
      name: authentik-social
      namespace: apps
      fieldPath: sops.mac
    targets:
      - select:
          kind: HelmRelease
          name: authentik
          namespace: apps
        fieldPaths:
          - spec.values.global.podAnnotations.authentik-social-mac
        options:
          create: true
      - select:
          kind: ConfigMap
          name: authentik-customization
          namespace: apps
        fieldPaths:
          - data.homelab-customization\.yaml
        options:
          delimiter: '# authentik-social-mac: '
          index: 1
  - source:
      kind: Secret
      name: authentik-social
      namespace: apps
      fieldPath: sops.lastmodified
    targets:
      - select:
          kind: ConfigMap
          name: authentik-customization
          namespace: apps
        fieldPaths:
          - data.homelab-customization\.yaml
        options:
          delimiter: '@@'
          index: 1
