---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # --unsafe: mkdocs.yml uses !!python/name tags (pymdownx), which the
        # safe loader can't construct. This still checks syntax.
        args: [--allow-multiple-documents, --unsafe]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]
        files: '\.(ya?ml)$'
        exclude: '(^clusters/.*/secrets/|^clusters/.*/sops/|\.sops\.ya?ml$|^\.sops\.ya?ml$)'
