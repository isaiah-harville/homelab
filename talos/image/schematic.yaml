# Longhorn requires iSCSI and filesystem trim tools.
# Create the Image Factory schematic ID with:
#   curl -X POST --data-binary @schematic.yaml https://factory.talos.dev/schematics
---
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/iscsi-tools
      - siderolabs/util-linux-tools
