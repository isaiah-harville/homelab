# Longhorn storage on Talos. Two parts:
#
#   1. UserVolumeConfig — the modern way to dedicate a disk (machine.disks is
#      DEPRECATED). Claims the first NON-system disk (the laptops' unused ~1TB
#      drive; OS stays on the NVMe) and mounts it at /var/mnt/longhorn
#      (UserVolumes always mount under /var/mnt/<name>).
#   2. kubelet extraMounts — bind /var/mnt/longhorn into the kubelet mount
#      namespace with rshared propagation, so Longhorn's manager/engine pods can
#      see the volume. Talos is immutable; without this Longhorn can't persist.
#
# Longhorn's Helm defaultDataPath is set to /var/mnt/longhorn to match
# (infrastructure/base/longhorn/helmrelease.yaml).
#
# ⚠️ NODES WITHOUT A SPARE DISK (single-NVMe laptops): the diskSelector below
# matches nothing, so UserVolumeConfig won't provision. Options for those nodes:
#   - carve a partition off the system disk and select it here, OR
#   - drop this UserVolumeConfig for that machine class and let Longhorn use a
#     directory on the ephemeral system disk (still needs the extraMounts bind,
#     but pointed at /var/lib/longhorn and Helm defaultDataPath adjusted).
# Confirm per-node disk inventory at bring-up and split machine classes.
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: "!system_disk"
  minSize: 100GB
---
machine:
  kubelet:
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
